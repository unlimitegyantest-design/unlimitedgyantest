<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Unlimited Gyan Test</title>

    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Inter:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js">

    <script>
        window.MathJax = {
            tex: { inlineMath: [["\\(", "\\)"], ["$", "$"]], displayMath: [["\\[", "\\]"], ["$$", "$$"]], processEscapes: true },
            options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] },
            startup: { typeset: false }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js'}else{this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js'}"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js'}else{this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js'}"></script>
    <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>@keyframes ugSpin { to { transform: rotate(360deg); } }</style>
</head>
<body style="margin:0;background:#0f172a;font-family:'Noto Sans Devanagari','Inter',Arial,sans-serif;">
    <div id="root">
        <div id="ug-cloud-loader-ui" style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e1b4b);color:#fff;padding:24px;text-align:center;">
            <div style="width:54px;height:54px;border:4px solid rgba(56,189,248,0.25);border-top-color:#38bdf8;border-radius:50%;animation:ugSpin 0.8s linear infinite;margin-bottom:16px;"></div>
            <h2 style="margin:0;font-size:20px;font-weight:900;letter-spacing:0.5px;">UNLIMITED GYAN TEST</h2>
            <p id="ug-boot-status" style="margin:8px 0 0 0;font-size:13px;color:#cbd5e1;font-weight:600;">Firebase Cloud से वेबसाइट लोड हो रही है…</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { initializeFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
          "apiKey": "AIzaSyD02eg9jaNN-jACslUNpb0QL8wTsHlQnGM",
          "authDomain": "unlimited-gyan1.firebaseapp.com",
          "projectId": "unlimited-gyan1",
          "storageBucket": "unlimited-gyan1.firebasestorage.app",
          "messagingSenderId": "576198101472",
          "appId": "1:576198101472:web:2496fda85c2d5439934385",
          "measurementId": "G-4ZNEC6QNX0"
};

        const APP_ID = "unlimited-gyan-secure-app";
        const BUNDLE_COL = "cloud_code_bundle";
        const CACHE_DB_NAME = "UGT_CloudBundle_DB_" + firebaseConfig.projectId;
        const CACHE_STORE = "bundle";
        const CACHE_KEY = "latest_bundle";

        const setStatus = (txt) => { const el = document.getElementById("ug-boot-status"); if (el) el.textContent = txt; };
        const escapeHtml = (str) => String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

        function openCacheDB() {
            return new Promise((resolve) => {
                if (!window.indexedDB) return resolve(null);
                try {
                    const req = indexedDB.open(CACHE_DB_NAME, 1);
                    req.onupgradeneeded = (e) => { if (!e.target.result.objectStoreNames.contains(CACHE_STORE)) e.target.result.createObjectStore(CACHE_STORE); };
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = () => resolve(null);
                } catch (err) { resolve(null); }
            });
        }
        async function idbGet(key) {
            const db = await openCacheDB(); if (!db) return null;
            return new Promise((resolve) => { try { const r = db.transaction(CACHE_STORE, "readonly").objectStore(CACHE_STORE).get(key); r.onsuccess = () => resolve(r.result || null); r.onerror = () => resolve(null); } catch (e) { resolve(null); } });
        }
        async function idbSet(key, val) {
            const db = await openCacheDB(); if (!db) return;
            try { db.transaction(CACHE_STORE, "readwrite").objectStore(CACHE_STORE).put(val, key); } catch (e) {}
        }
        async function idbClear() {
            const db = await openCacheDB(); if (!db) return;
            return new Promise((resolve) => { try { const r = db.transaction(CACHE_STORE, "readwrite").objectStore(CACHE_STORE).clear(); r.onsuccess = () => resolve(); r.onerror = () => resolve(); } catch (e) { resolve(); } });
        }
        function waitForReactReady() {
            return new Promise((resolve) => {
                if (window.React && window.ReactDOM) return resolve();
                const t = setInterval(() => { if (window.React && window.ReactDOM) { clearInterval(t); resolve(); } }, 30);
                setTimeout(() => { clearInterval(t); resolve(); }, 12000);
            });
        }
        function mountCloudPayload(payloadObj) {
            if (!payloadObj || !Array.isArray(payloadObj.scripts) || payloadObj.scripts.length === 0) throw new Error("Cloud बंडल में वैध कोड नहीं मिला। कृपया cloud_uploader.html से दोबारा अपलोड करें।");
            if (payloadObj.title) document.title = payloadObj.title;
            (payloadObj.styles || []).forEach((st) => { const sEl = document.createElement("style"); if (st.id) sEl.id = st.id; sEl.textContent = st.css || ""; document.head.appendChild(sEl); });
            (payloadObj.scripts || []).forEach((sc) => { const jsEl = document.createElement("script"); if (sc.id) jsEl.id = sc.id; if (sc.type) jsEl.type = sc.type; jsEl.textContent = sc.code || ""; document.body.appendChild(jsEl); });
            setTimeout(() => { window.dispatchEvent(new Event("DOMContentLoaded")); document.dispatchEvent(new Event("DOMContentLoaded")); }, 30);
        }
        function showBootError(message) {
            const root = document.getElementById("root"); if (!root) return;
            root.innerHTML = '<div style="min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#f8fafc;padding:20px;text-align:center;font-family:\'Noto Sans Devanagari\',Arial,sans-serif;"><div style="width:100%;max-width:440px;background:#fff;border:2px solid #fecdd3;border-radius:20px;padding:24px;"><h2 style="color:#be123c;margin:0 0 8px 0;font-size:20px;font-weight:900;">वेबसाइट Cloud से लोड नहीं हो सकी</h2><p style="color:#475569;font-size:13px;line-height:1.6;margin:0 0 18px 0;">' + escapeHtml(message) + '</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;"><button id="ug-btn-reload" type="button" style="background:#0284c7;color:#fff;border:none;padding:10px 20px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;">पेज Reload करें</button><button id="ug-btn-clear-reload" type="button" style="background:#f1f5f9;color:#0f172a;border:1px solid #cbd5e1;padding:10px 16px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;">कैश साफ़ कर Reload करें</button></div></div></div>';
            const r1 = document.getElementById("ug-btn-reload"); if (r1) r1.onclick = () => window.location.reload();
            const r2 = document.getElementById("ug-btn-clear-reload"); if (r2) r2.onclick = async () => { await idbClear(); window.location.reload(); };
        }
        async function bootFromFirebaseCloud() {
            let bootApp = null;
            try {
                const cached = await idbGet(CACHE_KEY);
                bootApp = initializeApp(firebaseConfig, "ug_cloud_loader_" + Date.now());
                const db = initializeFirestore(bootApp, { experimentalAutoDetectLongPolling: true });
                let manifest = null;
                try {
                    const mSnap = await Promise.race([getDoc(doc(db, "artifacts", APP_ID, "public", "data", BUNDLE_COL, "manifest")), new Promise((_, rej) => setTimeout(() => rej(new Error("Firebase सर्वर से समय पर जवाब नहीं मिला (Timeout)।")), 12000))]);
                    if (mSnap && mSnap.exists()) manifest = mSnap.data();
                } catch (netErr) { if (!cached) throw netErr; }
                let payloadStr = null;
                if (cached && cached.payloadStr && (!manifest || Number(cached.version) === Number(manifest.version))) {
                    setStatus("लोकल हाई-स्पीड कैश से खुल रही है…");
                    payloadStr = cached.payloadStr;
                } else if (manifest && Number(manifest.chunkCount) > 0) {
                    setStatus("नया क्लाउड अपडेट (v" + manifest.version + ") डाउनलोड हो रहा है…");
                    const ps = [];
                    for (let i = 0; i < Number(manifest.chunkCount); i++) ps.push(getDoc(doc(db, "artifacts", APP_ID, "public", "data", BUNDLE_COL, "chunk_" + i)));
                    const snaps = await Promise.all(ps);
                    payloadStr = snaps.map((s) => (s.exists() ? (s.data().data || "") : "")).join("");
                    if (!payloadStr) throw new Error("Cloud चंक्स खाली मिले। कृपया cloud_uploader.html से दोबारा अपलोड करें।");
                    await idbSet(CACHE_KEY, { version: manifest.version, payloadStr });
                } else {
                    throw new Error("नए Firebase Cloud में अभी वेबसाइट का कोड अपलोड नहीं है। कृपया पहले cloud_uploader.html से अपलोड करें।");
                }
                try { await deleteApp(bootApp); bootApp = null; } catch (e) {}
                await waitForReactReady();
                mountCloudPayload(JSON.parse(payloadStr));
            } catch (err) {
                if (bootApp) { try { await deleteApp(bootApp); } catch (e) {} }
                showBootError(err && err.message ? err.message : "इंटरनेट जाँचें और पेज Reload करें।");
            }
        }
        bootFromFirebaseCloud();
    </script>
</body>
</html>
