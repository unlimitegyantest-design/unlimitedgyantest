  // ==================== 7. MODERN EDTECH 3-LINE SIDEBAR HIDE + PERMANENT DELETE "मेनू छुपाए" + ESC FULLSCREEN ====================
  (function initModernEdTechSidebarAndEscFullscreen() {
    if (window.__UG_MODERN_EDTECH_SB_INIT__) return;
    window.__UG_MODERN_EDTECH_SB_INIT__ = true;

    var OLD_HIDE_MENU_RE = /(?:(?:मेनू|मेन्यू|मेनु|साइडबार)\s*(?:छुपाए|छुपाएँ|छुपाएं|छिपाए|छिपाएँ|छिपाएं|दिखाए|दिखाएँ|दिखाएं|बंद\s*करें|खोलें))|(?:^(?:hide|show|collapse|toggle)\s+(?:menu|sidebar)$)|(?:^(?:menu|sidebar)\s+(?:hide|show)$)/i;

    // ---------- A. CSS इंजेक्शन (Modern EdTech 3-Line + असली Sidebar Smooth Collapse + Permanent Delete) ----------
    function injectModernSidebarCss() {

      st.id = "ug-modern-edtech-sb-css";
      st.textContent = [

        ".ug-real-sidebar-el { transition: transform 0.28s cubic-bezier(0.22,1,0.36,1), width 0.28s cubic-bezier(0.22,1,0.36,1), min-width 0.28s cubic-bezier(0.22,1,0.36,1), opacity 0.22s ease !important; will-change: transform, width; }",
        "html.ug-sidebar-hidden .ug-real-sidebar-el { width:0 !important; min-width:0 !important; max-width:0 !important; flex-basis:0 !important; padding-left:0 !important; padding-right:0 !important; margin-left:0 !important; margin-right:0 !important; border-width:0 !important; opacity:0 !important; pointer-events:none !important; overflow:hidden !important; transform:translateX(-106%) !important; }",
        "html.ug-sidebar-hidden .ug-main-expand-el { margin-left:0 !important; padding-left:0 !important; width:100% !important; max-width:100% !important; }",
        "@media (max-width: 768px) {",
        "  .ug-real-sidebar-el { position:fixed !important; top:0 !important; left:0 !important; bottom:0 !important; z-index:2147483641 !important; max-width:82vw !important; box-shadow:16px 0 42px rgba(2,6,23,0.72) !important; }",
        "  html.ug-sidebar-hidden .ug-real-sidebar-el { transform:translateX(-110%) !important; }",
        "}",
        "#ug-modern-sb-backdrop { position:fixed; inset:0; z-index:2147483640; background:rgba(2,6,23,0.58); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity 0.22s ease; }",
        "#ug-modern-sb-backdrop.is-show { opacity:1; pointer-events:auto; }",
        "#ug-modern-sb-toggle { position:fixed; top:12px; left:12px; z-index:2147483643; width:36px; height:36px; border-radius:10px; border:1px solid rgba(56,189,248,0.45); background:linear-gradient(135deg, rgba(15,23,42,0.92), rgba(30,41,59,0.92)); color:#f8fafc; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:none; flex-direction:column; align-items:center; justify-content:center; gap:4.5px; cursor:pointer; box-shadow:0 6px 20px rgba(2,6,23,0.48); transition:left 0.28s cubic-bezier(0.22,1,0.36,1), top 0.2s ease, background 0.18s ease, border-color 0.18s ease, transform 0.16s ease; padding:0; outline:none; }",
        "#ug-modern-sb-toggle:hover { background:linear-gradient(135deg, rgba(30,64,175,0.95), rgba(15,23,42,0.98)); border-color:#38bdf8; transform:scale(1.06); }",
        "#ug-modern-sb-toggle:active { transform:scale(0.95); }",
        "#ug-modern-sb-toggle .ug-bar { display:block; width:18px; height:2px; border-radius:999px; background:#f8fafc; transition:transform 0.22s ease, width 0.22s ease, background 0.22s ease; }",
        "#ug-modern-sb-toggle .ug-bar-2 { width:13px; align-self:flex-start; margin-left:8px; background:#38bdf8; }",
        "#ug-modern-sb-toggle .ug-bar-3 { width:16px; align-self:flex-start; margin-left:8px; }",
        "#ug-modern-sb-toggle.is-sb-open .ug-bar-1 { width:16px; }",
        "#ug-modern-sb-toggle.is-sb-open .ug-bar-2 { width:12px; background:#34d399; }",
        "#ug-modern-sb-toggle.is-sb-open .ug-bar-3 { width:18px; }",

      (document.head || document.documentElement).appendChild(st);
    }

    // ---------- B. पुराना "मेनू छुपाए" बटन हमेशा के लिए PERMANENT DELETE (React-Safe) ----------
    function permanentlyDeleteOldHideMenuButtons() {
      try {
        var rootScope = document.getElementById("root") || document.body;
        if (!rootScope) return;
        var els = rootScope.querySelectorAll("button, a, [role=button], span, div");
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          if (!el || el.classList.contains("ug-deleted-old-menu-btn")) continue;
          if (el.id === "root" || el.id === "ug-modern-sb-toggle" || el.classList.contains("ug-real-sidebar-el")) continue;
          if (el.children && el.children.length > 3) continue;
          var txt = String(el.textContent || "").replace(/\s+/g, " ").trim();
          if (!txt || txt.length > 36) continue;
          if (!OLD_HIDE_MENU_RE.test(txt)) continue;
          var targetBtn = (el.closest && el.closest("button, a, [role=button]")) || el;
          if (!targetBtn || targetBtn.id === "root" || targetBtn.id === "ug-modern-sb-toggle" || targetBtn.classList.contains("ug-real-sidebar-el")) continue;
          targetBtn.classList.add("ug-deleted-old-menu-btn");
          targetBtn.setAttribute("aria-hidden", "true");
          targetBtn.setAttribute("tabindex", "-1");
          var par = targetBtn.parentElement;
          if (par && par.id !== "root" && !par.classList.contains("ug-real-sidebar-el") && par.children && par.children.length === 1) {
            var pTxt = String(par.textContent || "").replace(/\s+/g, " ").trim();
            if (pTxt.length <= 36 && OLD_HIDE_MENU_RE.test(pTxt)) {
              par.classList.add("ug-deleted-old-menu-btn");
            }
          }
        }
      } catch (e) {}
    }

    // ---------- C. असली UNLIMITED GYAN SIDEBAR की स्मार्ट पहचान व TOP-CORNER 3-LINE CONTROL ----------
    var realSidebarEl = null;
    var mainSiblingEl = null;
    var toggleBtnEl = null;
    var backdropEl = null;
    var sidebarHidden = false;
    var sbScanTimer = null;

    try {
      if (sessionStorage.getItem("ug_edtech_sb_hidden_v1") === "1") sidebarHidden = true;
    } catch (e) {}

    function isSidebarValidCandidate(el) {
      if (!el || el === document.body || el === document.documentElement || el.id === "root") return false;
      if (el.id === "ug-modern-sb-host" || (el.closest && el.closest("#ug-modern-sb-host"))) return false;
      if (el.classList.contains("ug-real-sidebar-el")) return true;
      var r = el.getBoundingClientRect();
      var vw = window.innerWidth || 1024;
      var maxAllowedW = vw <= 520 ? Math.min(360, vw * 0.9) : Math.min(380, vw * 0.45);
      if (r.left > 60) return false;
      if (r.width < 155 || r.width > maxAllowedW) return false;
      if (r.height < Math.min(300, (window.innerHeight || 600) * 0.45)) return false;
      return true;
    }

    function findRealSidebar() {
      if (realSidebarEl && document.body && document.body.contains(realSidebarEl)) return realSidebarEl;
      realSidebarEl = null;
      var rootScope = document.getElementById("root") || document.body;
      if (!rootScope) return null;

      // 1) पहले <aside> खोजें
      var asides = rootScope.querySelectorAll("aside");
      for (var a = 0; a < asides.length; a++) {
        if (isSidebarValidCandidate(asides[a])) {
          realSidebarEl = asides[a];
          return realSidebarEl;
        }
      }

      // 2) फिर Unlimited Gyan के असली मेन्यू आइटम (Mock Test Series, RRB PYQ, Admin ID Provider आदि) से पैरेंट साइडबार खोजें
      var navNodes = rootScope.querySelectorAll("button, a, div, li");
      var anchorNode = null;
      for (var i = 0; i < navNodes.length; i++) {
        var n = navNodes[i];
        if (!n || (n.children && n.children.length > 4)) continue;
        var t = String(n.textContent || "").replace(/\s+/g, " ").trim();
        if (t && t.length <= 45 && SIDEBAR_ITEM_HINT_RE.test(t)) {
          anchorNode = n;
          break;
        }
      }
      if (anchorNode) {
        var cur = anchorNode.parentElement;
        var best = null;
        var depth = 0;
        while (cur && cur !== rootScope && cur !== document.body && depth < 8) {
          if (isSidebarValidCandidate(cur)) best = cur;
          cur = cur.parentElement;
          depth++;
        }
        if (best) {
          realSidebarEl = best;
          return realSidebarEl;
        }
      }
      return null;
    }

    function detectMainExpandSibling(sb) {
      if (!sb || !sb.parentElement) return;
      if (mainSiblingEl && document.body.contains(mainSiblingEl)) return;
      try {
        var cs = window.getComputedStyle(sb);
        if (cs.position === "fixed" || cs.position === "absolute") {
          var sibs = sb.parentElement.children;
          for (var i = 0; i < sibs.length; i++) {
            var s = sibs[i];
            if (s === sb) continue;
            var scs = window.getComputedStyle(s);
            var ml = parseFloat(scs.marginLeft || "0") || 0;
            var pl = parseFloat(scs.paddingLeft || "0") || 0;
            if (ml >= 150 || pl >= 150 || s.tagName === "MAIN") {
              mainSiblingEl = s;
              mainSiblingEl.classList.add("ug-main-expand-el");
              break;
            }
          }
        }
      } catch (e) {}
    }

    function positionTopCornerToggleBtn() {
      if (!toggleBtnEl) return;
      var sb = findRealSidebar();
      if (!sb) {
        toggleBtnEl.style.display = "none";
        if (backdropEl) backdropEl.classList.remove("is-show");
        return;
      }
      sb.classList.add("ug-real-sidebar-el");
      detectMainExpandSibling(sb);
      toggleBtnEl.style.display = "flex";
      var isMobile = (window.innerWidth || 1024) <= 768;
      if (sidebarHidden) {
        toggleBtnEl.classList.remove("is-sb-open");
        toggleBtnEl.style.left = "12px";
        toggleBtnEl.style.top = "12px";
        toggleBtnEl.title = "साइडबार मेन्यू दिखाएँ";
        toggleBtnEl.setAttribute("aria-label", "साइडबार मेन्यू दिखाएँ");
        toggleBtnEl.setAttribute("aria-expanded", "false");
        if (backdropEl) backdropEl.classList.remove("is-show");
      } else {
        toggleBtnEl.classList.add("is-sb-open");
        var r = sb.getBoundingClientRect();
        var sbW = (r.width >= 150 && r.width <= 400) ? r.width : 260;
        var targetLeft = Math.max(12, Math.min((window.innerWidth || 1024) - 48, Math.round(r.left + sbW - 44)));
        toggleBtnEl.style.left = targetLeft + "px";
        toggleBtnEl.style.top = "12px";
        toggleBtnEl.title = "साइडबार मेन्यू छुपाएँ";
        toggleBtnEl.setAttribute("aria-label", "साइडबार मेन्यू छुपाएँ");
        toggleBtnEl.setAttribute("aria-expanded", "true");
        if (backdropEl) backdropEl.classList.toggle("is-show", isMobile);
      }
    }

    function applySidebarHiddenState(hide) {
      sidebarHidden = !!hide;
      try { sessionStorage.setItem("ug_edtech_sb_hidden_v1", sidebarHidden ? "1" : "0"); } catch (e) {}
      document.documentElement.classList.toggle("ug-sidebar-hidden", sidebarHidden);
      positionTopCornerToggleBtn();
      setTimeout(positionTopCornerToggleBtn, 310);
    }

    function mountModernTopCornerSystem() {
      injectModernSidebarCss();
      if (!document.getElementById("ug-modern-sb-host")) {
        var hostParent = document.body || document.documentElement;
        if (!hostParent) return;
        var host = document.createElement("div");
        host.id = "ug-modern-sb-host";

        backdropEl = document.createElement("div");
        backdropEl.id = "ug-modern-sb-backdrop";
        backdropEl.addEventListener("click", function () { applySidebarHiddenState(true); });

        toggleBtnEl = document.createElement("button");
        toggleBtnEl.id = "ug-modern-sb-toggle";
        toggleBtnEl.type = "button";
        var b1 = document.createElement("span"); b1.className = "ug-bar ug-bar-1";
        var b2 = document.createElement("span"); b2.className = "ug-bar ug-bar-2";
        var b3 = document.createElement("span"); b3.className = "ug-bar ug-bar-3";
        toggleBtnEl.appendChild(b1); toggleBtnEl.appendChild(b2); toggleBtnEl.appendChild(b3);
        toggleBtnEl.addEventListener("click", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          applySidebarHiddenState(!sidebarHidden);
        });

        host.appendChild(backdropEl);
        host.appendChild(toggleBtnEl);
        hostParent.appendChild(host);
      }

      // मोबाइल पर किसी साइडबार मेन्यू आइटम पर क्लिक करते ही साइडबार ऑटो-हाइड हो जाए
      document.addEventListener("click", function (ev) {
        if ((window.innerWidth || 1024) > 768 || sidebarHidden) return;
        var t = ev && ev.target;
        if (!t || !t.closest) return;
        if (t.closest("#ug-modern-sb-toggle")) return;
        var inSb = t.closest(".ug-real-sidebar-el");
        if (inSb && t.closest("button, a, [role=button]")) {
          setTimeout(function () { applySidebarHiddenState(true); }, 140);
        }
      }, true);

      function syncSidebarAndPurgeOldBtn() {
        permanentlyDeleteOldHideMenuButtons();
        var sb = findRealSidebar();
        if (sb) {
          sb.classList.add("ug-real-sidebar-el");
          document.documentElement.classList.toggle("ug-sidebar-hidden", sidebarHidden);
        }
        positionTopCornerToggleBtn();
      }

      function scheduleSbSync() {
        if (sbScanTimer) return;
        sbScanTimer = setTimeout(function () {
          sbScanTimer = null;
          syncSidebarAndPurgeOldBtn();
        }, 220);
      }

      syncSidebarAndPurgeOldBtn();
      setTimeout(syncSidebarAndPurgeOldBtn, 500);
      setTimeout(syncSidebarAndPurgeOldBtn, 1400);
      setTimeout(syncSidebarAndPurgeOldBtn, 2600);
      window.addEventListener("resize", scheduleSbSync);
      if (typeof MutationObserver !== "undefined" && document.body) {
        new MutationObserver(function (records) {
          for (var i = 0; i < records.length; i++) {
            var t = records[i].target;
            if (t && (t.id === "ug-modern-sb-host" || t.id === "ug-fs-esc-toast" || t.id === "ug-pw-eye-layer" || (t.closest && (t.closest("#ug-modern-sb-host") || t.closest("#ug-pw-eye-layer"))))) continue;
            scheduleSbSync();
            break;
          }
        }).observe(document.body, { childList: true, subtree: true });
      }
    }

    // ---------- D. ALL-TIME FULLSCREEN ENGINE (केवल ESC से ON/OFF) ----------
    var fsWanted = true;
    var wasFsActive = false;
    var lastFsExitTs = 0;
    var fsToastTimer = null;

    function isFsActive() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
    }
    function showFsToast(text) {
      try {
        var host = document.body || document.documentElement;
        if (!host) return;
        var t = document.getElementById("ug-fs-esc-toast");
        if (!t) {
          t = document.createElement("div");
          t.id = "ug-fs-esc-toast";
          host.appendChild(t);
        }
        t.textContent = text;
        t.classList.add("show");
        clearTimeout(fsToastTimer);
        fsToastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
      } catch (e) {}
    }
    function enterFullscreenSafe() {
      if (isFsActive()) { wasFsActive = true; return; }
      var el = document.documentElement;
      if (!el) return;
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (typeof fn !== "function") return;
      try {
        var p = fn.call(el);
        if (p && typeof p.catch === "function") p.catch(function () {});
      } catch (e) {}
    }
    function exitFullscreenSafe() {
      if (!isFsActive()) return;
      var fn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if (typeof fn !== "function") return;
      try {
        var p = fn.call(document);
        if (p && typeof p.catch === "function") p.catch(function () {});
      } catch (e) {}
    }
    function onFsStateChange() {
      var active = isFsActive();
      if (active) {
        wasFsActive = true;
        fsWanted = true;
      } else if (wasFsActive) {
        wasFsActive = false;
        lastFsExitTs = Date.now();
        if (fsWanted) {
          fsWanted = false;
          showFsToast("⏸️ Fullscreen OFF — दोबारा ON करने के लिए ESC दबाएँ");
        }
      }
      setTimeout(positionTopCornerToggleBtn, 120);
    }
    document.addEventListener("fullscreenchange", onFsStateChange);
    document.addEventListener("webkitfullscreenchange", onFsStateChange);
    document.addEventListener("mozfullscreenchange", onFsStateChange);
    document.addEventListener("MSFullscreenChange", onFsStateChange);

    window.addEventListener("keydown", function (e) {
      var isEsc = (e && (e.key === "Escape" || e.key === "Esc" || e.keyCode === 27));
      if (isEsc) {
        if (e.repeat) return;
        if (Date.now() - lastFsExitTs < 260) return;
        if (isFsActive()) {
          fsWanted = false;
          wasFsActive = false;
          lastFsExitTs = Date.now();
          exitFullscreenSafe();
          showFsToast("⏸️ Fullscreen OFF — दोबारा ON करने के लिए ESC दबाएँ");
        } else {
          fsWanted = true;
          enterFullscreenSafe();
          showFsToast("⛶ Fullscreen ON — बंद करने के लिए ESC दबाएँ");
        }
        return;
      }
      if (fsWanted && !isFsActive()) enterFullscreenSafe();
    }, true);

    window.addEventListener("pointerdown", function () {
      if (fsWanted && !isFsActive()) enterFullscreenSafe();
    }, true);

    function bootAll() {
      mountModernTopCornerSystem();
      enterFullscreenSafe();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bootAll);
    else bootAll();
  })();

})();
