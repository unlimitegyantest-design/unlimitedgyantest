            function isActiveModalOrDialog(el) {

            // 3. मोबाइल बॉटम "मेनू खोलें" रिमूवर (textContent आधारित — ज़ीरो लेआउट थ्रैशिंग)
            function cleanupBottomMenuOption() {
                if (!isTouchOrTabletView()) return;

                var nodes = document.querySelectorAll("button, a, [role='button']");
                for (var i = 0; i < nodes.length; i++) {
                    var el = nodes[i];

                    if (el.closest("#" + PORTAL_ID) || el.closest(".razorpay-container")) continue;

            // 4. Master Account राइट साइडबार व मोबाइल ड्रॉअर टच/ओवरले हीलर (हल्का व तेज़)
            function healMobileSidebars() {
                if (!isTouchOrTabletView()) return;
                var vw = window.innerWidth || 390;
                var vh = window.innerHeight || 700;
                var els = document.querySelectorAll("aside, nav, [class*='fixed'], [class*='sidebar' i], [class*='drawer' i], [id*='sidebar' i]");

                var sidebars = [];

                for (var i = 0; i < els.length; i++) {
                    var el = els[i];
                    if (!el || el.closest("#" + PORTAL_ID) || isActiveModalOrDialog(el)) continue;
                    if (el.classList.contains("ug-tb-palette-host")) continue;
                    var cs = getComputedStyle(el);
                    if (cs.display === "none" || cs.visibility === "hidden" || parseFloat(cs.opacity || "1") < 0.05) continue;
                    var pos = cs.position;

                    var r = el.getBoundingClientRect();
                    if (r.width <= 0 || r.height <= 0) continue;

                    var hint = (el.id || "") + " " + (typeof el.className === "string" ? el.className : "");

            // 5. स्मार्ट Testbook / PW मोबाइल एग्जाम डिटेक्टर (ज़ीरो innerText लेआउट थ्रैशिंग)

                var r = el.getBoundingClientRect();

            function detectActiveTestState() {

                var allBtns = root.querySelectorAll("button, [role='button']");
                var actionBtns = [];
                var submitBtns = [];
                var numBtns = [];
                var hasResultMarker = false;
                var hasAdminMarker = false;

                var actionRe = /\b(save\s*&?\s*next|save\s+and\s+next|mark\s+for\s+review|clear\s+response|next\s+question|previous|prev\b|skip\b|submit\s*test|finish\s*test|end\s*test)\b|(सेव\s*(?:और|&)\s*अगला|अगला\s*प्रश्न|पिछला|समीक्षा\s*के\s*लिए|उत्तर\s*हटा|टेस्ट\s*सबमिट|समाप्त\s*करें)/i;
                var submitRe = /\b(submit\s*test|finish\s*test|end\s*test|final\s*submit)\b|(टेस्ट\s*सबमिट|फाइनल\s*सबमिट)/i;
                var resultBtnRe = /\b(re-?attempt|retake\s*test|back\s*to\s*dashboard|view\s*solutions?|download\s*pdf|leaderboard)\b|(डैशबोर्ड\s*पर\s*वापस|पुनः\s*प्रयास|परिणाम\s*देखें)/i;
                var adminBtnRe = /\b(upload\s*question|create\s*test|manage\s*users|master\s*admin|grant\s*access|razorpay|pay\s*₹)\b/i;

                for (var i = 0; i < allBtns.length; i++) {
                    var b = allBtns[i];
                    if (b.getAttribute("data-ug-hidden-bottom-menu") === "1" || b.closest("[role='dialog']")) continue;
                    var t = String(b.textContent || "").replace(/\s+/g, " ").trim();
                    if (!t) continue;
                    if (!isVisibleQuick(b)) continue;
                    if (resultBtnRe.test(t)) hasResultMarker = true;
                    if (adminBtnRe.test(t)) hasAdminMarker = true;
                    if (actionRe.test(t) && t.length <= 42) actionBtns.push(b);
                    if (submitRe.test(t) && t.length <= 36) submitBtns.push(b);
                    if (/^\d{1,3}$/.test(t)) {
                        var n = parseInt(t, 10);
                        if (n >= 1 && n <= 300) numBtns.push({ el: b, num: n });
                    }
                }

                if (hasAdminMarker && actionBtns.length < 2) return { active: false };
                var active = actionBtns.length >= 2;
                if (!active && (actionBtns.length >= 1 || submitBtns.length >= 1)) {
                    var fastText = String(root.textContent || "").slice(0, 4500);
                    var hasTimer = /\b\d{1,2}\s*:\s*\d{2}(?:\s*:\s*\d{2})?\b/.test(fastText);
                    var hasQ = /\b(Q\s*\.?\s*\d+|Question\s+\d+|Marks\s*:)\b|(प्रश्न\s*(?:सं\.|संख्या)?\s*\d+)/i.test(fastText);
                    if (hasTimer && (!hasResultMarker || hasQ)) active = true;
                }
                return { active: active, actionBtns: actionBtns, numBtns: numBtns, root: root };
            }

            function detectPaletteContainer(numBtns, root) {
                if (!numBtns || numBtns.length < 5) return null;
                var counts = new Map();
                for (var i = 0; i < numBtns.length; i++) {
                    var p = numBtns[i].el.parentElement;
                    for (var d = 0; d < 4 && p && p !== root && p !== document.body; d++) {
                        var entry = counts.get(p);

                        entry.add(numBtns[i].num);
                        p = p.parentElement;
                    }

                counts.forEach(function (set, node) {
                    if (set.size < 5) return;
                    var hits = 0;
                    for (var k = 1; k <= 5; k++) if (set.has(k)) hits++;

                    if (set.size > bestScore && (!bestGrid || !node.contains(bestGrid))) {
                        bestScore = set.size; bestGrid = node;
                    }
                });
                if (!bestGrid) return null;

                var host = bestGrid, cur = bestGrid.parentElement;
                while (cur && cur !== root && cur !== document.body) {
                    var txt = String(cur.textContent || "");
                    if (/(save\s*&?\s*next|save\s+and\s+next|सेव\s*(?:और|&)\s*अगला)/i.test(txt)) break;
                    if (cur.querySelector("input[type='radio']")) break;
                    if (cur.tagName === "ASIDE" || /(palette|answered|not\s*answered|marked|not\s*visited|पैलेट|उत्तर\s*दिया|समीक्षा)/i.test(txt) || /palette|sidebar|drawer/i.test(String(cur.className || "") + " " + String(cur.id || ""))) {
                        host = cur;
                        if (cur.tagName === "ASIDE") break;
                    }
                    cur = cur.parentElement;
                }
                var fTxt = String(host.textContent || "");
                var ok = host.tagName === "ASIDE" || /(palette|answered|not\s*answered|marked|not\s*visited|submit|पैलेट|उत्तर|समीक्षा|सबमिट)/i.test(fTxt) || /palette|sidebar|question-nav/i.test(String(host.className || "") + " " + String(host.id || ""));

            }

            function detectFooterContainer(actionBtns, paletteHost, root) {
                var filtered = [];
                for (var i = 0; i < actionBtns.length; i++) {

                }

                while (cand && cand !== root && cand !== document.body) {

                    for (var j = 0; j < filtered.length; j++) if (cand.contains(filtered[j])) cnt++;

                var r = cand.getBoundingClientRect();

            }

            function swapClass(prevEl, nextEl, cls) {

                    return nextEl;
                }
                if (prevEl) prevEl.classList.remove(cls);
                if (nextEl) nextEl.classList.add(cls);
                return nextEl;
            }

            function clearExamClasses() {
                if (!document.body.classList.contains("ug-mobile-test-active")) return;
                document.body.classList.remove("ug-mobile-test-active", "ug-tb-palette-open", "ug-tb-dark-surface");
                curPaletteHost = swapClass(curPaletteHost, null, "ug-tb-palette-host");
                curFooterHost = swapClass(curFooterHost, null, "ug-tb-footer-host");
                curLayoutRow = swapClass(curLayoutRow, null, "ug-tb-layout-row");
                curQuestionHost = swapClass(curQuestionHost, null, "ug-tb-question-host");
            }

            function syncUI() {

                try {
                    injectStyles();
                    optimizeRenderedMedia();

                    // डेस्कटॉप पर मोबाइल-स्पेसिफ़िक स्कैन न चलाएँ (100% ज़ीरो ओवरहेड)

                    }

                    var state = detectActiveTestState();

                            if ((nextPalette && nextPalette.contains(obEl)) || (nextFooter && nextFooter.contains(obEl)) || obEl.closest("header, nav, [role='dialog']")) continue;
                            var obTxt = String(obEl.textContent || "").trim();
                            if (/^(?:\(?[A-E1-5]\)?[\.\)\s:-]+|Option\s+[A-E])/i.test(obTxt) && obTxt.length >= 2) obEl.classList.add("ug-tb-option-card");

            // 6. सिंगल एकीकृत इवेंट लिसनर्स (पैलेट ऑटो-क्लोज़ + Master साइडबार टच-टू-क्लिक ब्रिज)

                    if (document.body.classList.contains("ug-tb-palette-open") && target && target.closest) {
                        var pal = target.closest(".ug-tb-palette-host");
                        if (pal) {
                            var btn = target.closest("button, [role='button'], a");
                            if (btn && (/^\d{1,3}$/.test(String(btn.textContent || "").trim()) || /submit|सबमिट/i.test(String(btn.textContent || "")))) {
                                setTimeout(function () { document.body.classList.remove("ug-tb-palette-open"); }, 120);
                            }
                        }
                    }
                    // मोबाइल टैप पर CSS क्लास/स्टाइल से खुलने वाले साइडबार व व्यू को तुरंत सिंक करें (0ms आइडल ओवरहेड)

                // स्मार्ट MutationObserver: केवल असली Element बदलावों पर चलता है (1-सेकंड टाइमर टिक पर 0ms ओवरहेड!)

                            var m = mutations[i];
                            if (m.target && m.target.closest && m.target.closest("#" + PORTAL_ID + ", #ug-update-toast")) continue;
                            for (var a = 0; a < m.addedNodes.length; a++) { if (m.addedNodes[a].nodeType === 1) { hasElementChange = true; break; } }
                            if (hasElementChange) break;
                            for (var r = 0; r < m.removedNodes.length; r++) { if (m.removedNodes[r].nodeType === 1) { hasElementChange = true; break; } }
                            if (hasElementChange) break;
                        }
                        if (hasElementChange) scheduleSync(180);
                    });
                    obs.observe(document.documentElement, { childList: true, subtree: true });
                }
            }

            syncUI();
        }

        // बैकग्राउंड में क्लाउड अपडेट जाँचता है (Instant SWR बूट के बाद बिना किसी लैग के)
        function syncCloudUpdatesInBackground(bootedActiveId, bootedVersion) {
            var runBg = async function () {
                try {
                    var metaPair = await Promise.all([
                        fsGetDoc("manifest", 10000).catch(function () { return null; }),
                        fsGetDoc("updates_registry", 10000).catch(function () { return null; })
                    ]);
                    var manifest = metaPair[0], regDoc = metaPair[1], regItems = [];
                    if (regDoc && typeof regDoc.itemsJson === "string") { try { regItems = JSON.parse(regDoc.itemsJson); } catch (e) {} }
                    else if (regDoc && Array.isArray(regDoc.items)) regItems = regDoc.items;
                    if (regItems.length) void idbSet("updates_registry_cache", regItems);

                    var enabledNew = (regItems || []).filter(function (it) { return it && it.mode === "patch" && it.enabled !== false && it.id; });
                    var activeNew = enabledNew.length ? enabledNew[enabledNew.length - 1] : null;

                    if (activeNew) {
                        var liveId = activeNew.id, liveVer = Number(activeNew.version || 1);
                        if (liveId === bootedActiveId && liveVer === Number(bootedVersion || 1)) return;
                        var freshStr = await fetchChunks("upd_" + liveId + "_chunk_", activeNew.chunkCount);
                        var freshObj = JSON.parse(freshStr);
                        var joined = (freshObj.scripts || []).map(function (s) { return String((s && s.code) || ""); }).join("\n");
                        if (joined.indexOf("function bootFromFirebaseCloud(") !== -1) return;
                        await idbSet("active_new_site_" + liveId, { schema: CACHE_SCHEMA, version: liveVer, payloadStr: freshStr, savedAt: Date.now() });
                        await idbSet("last_good_base", { schema: CACHE_SCHEMA, activeId: liveId, version: liveVer, payloadStr: freshStr, savedAt: Date.now() });
                        showUpdateReadyToast();
                    } else if (manifest && manifest.chunkCount) {
                        var baseVer = Number(manifest.version || 1);
                        if (bootedActiveId === "__base__" && baseVer === Number(bootedVersion || 1)) return;
                        var baseStr = await fetchChunks("chunk_", manifest.chunkCount);
                        var baseObj = JSON.parse(baseStr);
                        if (isSelfLoaderPayload(baseObj)) return;
                        await idbSet("base_bundle", { schema: CACHE_SCHEMA, version: baseVer, payloadStr: baseStr, savedAt: Date.now() });
                        await idbSet("last_good_base", { schema: CACHE_SCHEMA, activeId: "__base__", version: baseVer, payloadStr: baseStr, savedAt: Date.now() });
                        showUpdateReadyToast();
                    }
                } catch (e) {}
            };
            if (typeof window.requestIdleCallback === "function") {
                setTimeout(function () { window.requestIdleCallback(function () { void runBg(); }, { timeout: 3000 }); }, 1400);
            } else {
                setTimeout(function () { void runBg(); }, 1800);
            }
        }

        async function bootFromFirebaseCloud() {
            initSafeGlobalsAndErrorWatcher();
            installDynamicScriptSanitizer();
            initNetworkStatusWatcher();
            ensureFastUIAndExamEngine();
            setTimeout(function () { if (document.getElementById("ug-cloud-loader-ui") && capturedBaseErr) void showBootError("स्क्रिप्ट एरर: " + capturedBaseErr); }, 6500);
            try {
                var reactWait = Promise.race([window.__UG_REACT_READY__ || Promise.resolve(false), new Promise(function (r) { setTimeout(function () { r(false); }, 10000); })]);

                // 1. सुपरफास्ट Instant Stale-While-Revalidate (SWR) बूट: लोकल कैश से तुरंत वेबसाइट खोलें!
                if (!forceFresh && !targetPageId && !useBackup && !skipPatches) {
                    var instantCached = await idbGet("last_good_base");
                    if (instantCached && instantCached.schema === CACHE_SCHEMA && instantCached.payloadStr) {
                        try {
                            var instantObj = JSON.parse(instantCached.payloadStr);
                            if (instantObj && !isSelfLoaderPayload(instantObj)) {
                                setStatus("तेज़ लोकल कैश से खुल रहा है…");
                                if (instantCached.cloudLink) window.__UG_CLOUD_LINK__ = instantCached.cloudLink;
                                await reactWait;
                                await mountBaseBundle(instantObj);
                                if (instantCached.loadedUpdate) window.__UG_LOADED_UPDATES__.push(instantCached.loadedUpdate);
                                var bsFast = document.getElementById("ug-boot-loader-style");
                                if (bsFast && !document.getElementById("ug-cloud-loader-ui")) bsFast.remove();
                                syncCloudUpdatesInBackground(instantCached.activeId || "", instantCached.version || 1);
                                return;
                            }
                        } catch (e) {}
                    }
                }

                // 2. यदि ?page=... पैरामीटर है
                if (targetPageId) {
                    setStatus("लिंक किया पेज (" + targetPageId + ") लोड हो रहा है…");
                    var pMan = await fsGetDoc("upd_" + targetPageId + "_manifest").catch(function () { return null; });
                    if (!pMan && Array.isArray(EMBEDDED_LINKED_ITEMS)) pMan = EMBEDDED_LINKED_ITEMS.find(function (x) { return x && x.id === targetPageId; }) || null;
                    var pData = await getCachedOrFreshBundle("page_" + targetPageId, pMan && pMan.version, "upd_" + targetPageId + "_chunk_", pMan && pMan.chunkCount, "पेज डाउनलोड हो रहा है…");
                    if (!pData) throw new Error("पेज ?page=" + targetPageId + " Cloud में नहीं मिला।");
                    await reactWait; await mountBaseBundle(pData.payloadObj); return;
                }

                // 3. पहली बार विज़िट या ?fresh=1 होने पर Cloud से लोड करें
                var activeManId = useBackup ? "backup_manifest" : "manifest", activePref = useBackup ? "backup_chunk_" : "chunk_", activeKey = useBackup ? "backup_base_bundle" : "base_bundle";
                var forceOldBase = skipPatches || useBackup;
                var manifest = null, regDoc = null, regOk = false, regItems = [];
                try {
                    var metaPair = await Promise.all([
                        fsGetDoc(activeManId, 10000).catch(function () { return null; }),
                        forceOldBase ? Promise.resolve(null) : fsGetDoc("updates_registry", 10000).then(function (d) { regOk = true; return d; }).catch(function () { return null; })
                    ]);
                    manifest = metaPair[0];
                    regDoc = metaPair[1];
                } catch (e) {}
                if (!forceOldBase) {
                    if (regOk) {
                        if (regDoc && typeof regDoc.itemsJson === "string") { try { regItems = JSON.parse(regDoc.itemsJson); } catch (e) {} }
                        else if (regDoc && Array.isArray(regDoc.items)) regItems = regDoc.items;
                        await idbSet("updates_registry_cache", regItems);
                    } else {
                        var cReg = await idbGet("updates_registry_cache");
                        regItems = (Array.isArray(cReg) && cReg.length) ? cReg : EMBEDDED_LINKED_ITEMS;
                    }
                    var enabledNewFiles = (regItems || []).filter(function (it) { return it && it.mode === "patch" && it.enabled !== false && it.id; });
                    var activeNewFile = enabledNewFiles.length > 0 ? enabledNewFiles[enabledNewFiles.length - 1] : null;
                    window.__UG_CLOUD_LINK__ = {
                        mode: activeNewFile ? "new-file-only" : "old-base-fallback",
                        oldBaseConnectedInCloud: !!manifest,
                        oldBaseExecuted: false,
                        oldBaseMeta: manifest ? { version: manifest.version || 1, fileName: manifest.fileName || "index.html", totalBytes: manifest.totalBytes || 0 } : null,
                        activeNewFile: activeNewFile ? { id: activeNewFile.id, title: activeNewFile.title || activeNewFile.id, version: activeNewFile.version || 1, fileName: activeNewFile.fileName || "" } : null
                    };
                    if (activeNewFile) {
                        var newCacheKey = "active_new_site_" + activeNewFile.id;
                        var newData = await getCachedOrFreshBundle(newCacheKey, activeNewFile.version, "upd_" + activeNewFile.id + "_chunk_", activeNewFile.chunkCount, "वेबसाइट लोड हो रही है…");
                        if (!newData || !newData.payloadObj) throw new Error("नई अपडेटेड फ़ाइल (" + activeNewFile.id + ") Cloud से लोड नहीं हो सकी।");
                        var newJoinedScripts = (newData.payloadObj.scripts || []).map(function (s) { return String((s && s.code) || ""); }).join("\n");
                        if (newJoinedScripts.indexOf("function bootFromFirebaseCloud(") !== -1) throw new Error("नई अपडेट फ़ाइल में Auto-Sync Cloud Loader लूप है। कृपया सही HTML अपलोड करें।");
                        await reactWait;
                        await mountBaseBundle(newData.payloadObj);
                        var loadedNewMeta = { id: activeNewFile.id, version: activeNewFile.version || 1, title: activeNewFile.title || activeNewFile.id, mode: "new-file-only" };
                        window.__UG_LOADED_UPDATES__.push(loadedNewMeta);
                        var bsNew = document.getElementById("ug-boot-loader-style"); if (bsNew && !document.getElementById("ug-cloud-loader-ui")) bsNew.remove();
                        setTimeout(function () { if (!document.getElementById("ug-cloud-loader-ui")) { var bsNew2 = document.getElementById("ug-boot-loader-style"); if (bsNew2) bsNew2.remove(); void idbSet("last_good_base", { schema: CACHE_SCHEMA, activeId: activeNewFile.id, version: activeNewFile.version || 1, payloadStr: newData.payloadStr, cloudLink: window.__UG_CLOUD_LINK__ || null, loadedUpdate: loadedNewMeta, savedAt: Date.now() }); } }, 1800);
                        return;
                    }
                }
                var cachedLocal = forceFresh ? null : await idbGet(activeKey);
                var hasCache = !!(cachedLocal && cachedLocal.schema === CACHE_SCHEMA && cachedLocal.payloadStr);
                var baseData = null;
                try {
                    baseData = await getCachedOrFreshBundle(activeKey, manifest && manifest.version, activePref, manifest && manifest.chunkCount, "मुख्य वेबसाइट (v" + (manifest ? manifest.version : 1) + ") लोड हो रही है…");
                } catch (netErr) {
                    if (hasCache) { try { baseData = { version: cachedLocal.version, payloadStr: cachedLocal.payloadStr, payloadObj: JSON.parse(cachedLocal.payloadStr) }; } catch (e) {} }
                    if (!baseData) throw netErr;
                }
                if (!baseData) throw new Error("Cloud में मुख्य वेबसाइट अपलोड नहीं है। कृपया Cloud Uploader से मुख्य वेबसाइट अपलोड करें।");
                if (!useBackup && isSelfLoaderPayload(baseData.payloadObj)) {
                    var bakMan = await fsGetDoc("backup_manifest", 10000).catch(function () { return null; });
                    var bakData = bakMan ? await getCachedOrFreshBundle("backup_base_bundle", bakMan.version, "backup_chunk_", bakMan.chunkCount, "Backup लोड हो रहा है…") : null;
                    if (bakData && !isSelfLoaderPayload(bakData.payloadObj)) baseData = bakData;
                    else throw new Error("Cloud के manifest में Cloud Loader अपलोड हो गया है। कृपया Cloud Uploader में 'मुख्य वेबसाइट बदलें (Base)' चुनकर अपनी असली बड़ी HTML वेबसाइट अपलोड करें।");
                }
                window.__UG_CLOUD_LINK__ = window.__UG_CLOUD_LINK__ || {};
                window.__UG_CLOUD_LINK__.oldBaseExecuted = true;
                await reactWait;
                await mountBaseBundle(baseData.payloadObj);
                var bs = document.getElementById("ug-boot-loader-style"); if (bs && !document.getElementById("ug-cloud-loader-ui")) bs.remove();
                setTimeout(function () { if (!document.getElementById("ug-cloud-loader-ui")) { var bs2 = document.getElementById("ug-boot-loader-style"); if (bs2) bs2.remove(); void idbSet("last_good_base", { schema: CACHE_SCHEMA, activeId: "__base__", version: baseData.version || 1, payloadStr: baseData.payloadStr, cloudLink: window.__UG_CLOUD_LINK__ || null, savedAt: Date.now() }); } }, 1800);
            } catch (err) { await showBootError(err && err.message ? err.message : "इंटरनेट जाँचें और पेज Reload करें।"); }
        }
        bootFromFirebaseCloud();
    })();
    </script>
