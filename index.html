<style id="ug-mobile-interface-css">
    /* मोबाइल ब्राउज़र की सही ऊँचाई के लिए वेरिएबल */
    :root {
        --ug-vh: 1vh;
    }

    /* डेस्कटॉप पर मोबाइल बॉटम बार को छिपा कर रखें */
    #ug-mobile-bottom-bar,
    #ug-mobile-backdrop {
        display: none;
    }

    /* केवल मोबाइल और छोटे टैबलेट (768px या उससे कम चौड़ाई) के लिए नियम */
    @media (max-width: 768px) {
        /* 1. स्क्रीन को दाएं-बाएं हिलने (Horizontal Scroll) से रोकें */
        html, body {
            max-width: 100vw !important;
            overflow-x: hidden !important;
            height: calc(var(--ug-vh, 1vh) * 100) !important;
            height: 100dvh !important;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        /* नीचे के मोबाइल बॉटम बार के लिए थोड़ी खाली जगह छोड़ें */
        body {
            padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)) !important;
        }

        /* 2. साइडबार (Sidebar) को मोबाइल स्लाइड मेनू (Drawer) में बदलें */
        .sidebar, aside {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            height: 100dvh !important;
            width: 82vw !important;
            max-width: 310px !important;
            z-index: 9998 !important;
            transform: translateX(-105%);
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1) !important;
            overflow-y: auto !important;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.35) !important;
        }

        /* जब मोबाइल मेनू खुले */
        .sidebar.ug-mobile-open, aside.ug-mobile-open {
            transform: translateX(0) !important;
        }

        /* मेनू खुलने पर पीछे का हल्का काला पर्दा (Backdrop) */
        #ug-mobile-backdrop.ug-show {
            display: block !important;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            z-index: 9997;
        }

        /* 3. प्रश्न, ऑप्शन और सॉल्यूशन बॉक्स को मोबाइल स्क्रीन पर फिट करें */
        .solution-html-container .q-row,
        .solution-html-container > div {
            width: 100% !important;
            min-width: 0 !important;
            padding: 12px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            gap: 10px !important;
            box-sizing: border-box !important;
        }

        .solution-html-container .q-num-text {
            width: 100% !important;
            font-size: 1.1rem !important;
            white-space: normal !important;
            word-break: break-word !important;
            text-align: left !important;
        }

        .solution-html-container .q-opts {
            width: 100% !important;
            margin-left: 0 !important;
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 10px !important;
        }

        /* 4. सभी फोटो, वीडियो और कैनवास मोबाइल से बाहर न निकलें */
        img, video, svg, canvas, iframe {
            max-width: 100% !important;
            height: auto;
        }

        /* 5. उंगली से दबाने (Touch) के लिए बटन और इनपुट को आसान बनाएं */
        button, a, label {
            touch-action: manipulation;
        }

        /* iPhone/Android में टाइप करते समय ज़ूम होने की समस्या रोकें */
        input, select, textarea {
            font-size: 16px !important;
        }

        /* चौड़ी टेबल के लिए स्क्रॉल बॉक्स */
        .ug-table-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 6. मोबाइल ऐप जैसा बॉटम नेविगेशन बार (Bottom App Bar) */
        #ug-mobile-bottom-bar {
            display: flex !important;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(58px + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: #0f172a;
            border-top: 1px solid rgba(148, 163, 184, 0.25);
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            align-items: center;
            justify-content: space-around;
        }

        #ug-mobile-bottom-bar button {
            flex: 1;
            height: 100%;
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-family: 'Noto Sans Devanagari', sans-serif;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
        }

        #ug-mobile-bottom-bar button:active {
            background: rgba(255, 255, 255, 0.12);
            color: #38bdf8;
        }

        #ug-mobile-bottom-bar .ug-icon {
            font-size: 17px;
            line-height: 1;
        }
    }

            _initDB() {

                    if (!window.indexedDB) return resolve(null);
                    try {
                        const req = window.indexedDB.open('UGT_UltraFast_DB', 1);
                        req.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains('kv')) {
                                db.createObjectStore('kv');
                            }
                        };
                        req.onsuccess = (e) => resolve(e.target.result);
                        req.onerror = () => resolve(null);

                    }

            get(key, fallback = null) {
                if (this._ram.has(key)) return this._ram.get(key);
                try {
                    const raw = localStorage.getItem('ugt_fast_' + key);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        this._ram.set(key, parsed);
                        return parsed;
                    }
                } catch (e) {}
                return fallback;
            },
            set(key, val) {

                            if (req.result !== undefined) {
                                this._ram.set(key, req.result);

                            } else {

                            }
                        };

                    return this.get(key, fallback);
                }
            },

                            let code = str.charCodeAt(i);
                            if (code >= 2304 && code <= 2431) return true;

                    function stripQPrefix(str) {
                        if (!str) return '';
                        let s = str.trim();
                        if (s.toUpperCase().startsWith('Q')) {
                            s = s.substring(1).trim();
                            if (s.startsWith('.')) s = s.substring(1).trim();
                        }
                        while (s.length > 0 && s.charCodeAt(0) >= 48 && s.charCodeAt(0) <= 57) {
                            s = s.substring(1);
                        }
                        if (s.startsWith('.') || s.startsWith(':') || s.startsWith(')') || s.startsWith('-')) {

                        let parts = [];

                            let ch = line[i];

                            if (ch === '?' || ch === '।' || ch === '|') {
                                if (cur.trim()) parts.push(cur.trim());
                                cur = '';
                            }

                        let result = [];
                        parts.forEach(part => {

                            }

                            let lastHi = -1;
                            for (let i = 0; i < part.length; i++) {

                                    if (firstHi === -1) firstHi = i;

                                }

                            let suffix = part.substring(lastHi + 1).trim();
                            if (prefix.length > 22) {
                                result.push(prefix);
                                result.push(part.substring(firstHi).trim());
                            } else if (suffix.length > 22) {
                                let rest = part.substring(lastHi + 1);
                                let dotIdx = rest.indexOf('.');
                                let splitPos = dotIdx !== -1 ? lastHi + 1 + dotIdx + 1 : lastHi + 1;
                                result.push(part.substring(0, splitPos).trim());
                                if (part.substring(splitPos).trim()) {

                                }
                            } else {
                                result.push(part);

            </div>
            <div style="padding:14px 16px; border-top:1px solid #cbd5e1; background:white; display:flex; flex-direction:column; gap:8px;">
                <button onclick="openSubmitModal()" style="width:100%; background:#16a34a; color:white; border:none; padding:12px; border-radius:8px; font-weight:900; font-size:0.95rem; cursor:pointer; box-shadow:0 4px 12px rgba(22,163,74,0.25);">Submit Test</button>
            </div>
        </div>
    </div>

    <div class="tb-modal-backdrop" id="submit-modal">
        <div style="background:white; width:90%; max-width:460px; border-radius:16px; padding:24px; box-shadow:0 20px 50px rgba(0,0,0,0.3); text-align:center;">
            <h3 style="margin:0 0 8px 0; font-size:1.3rem; font-weight:900; color:#0f172a;">क्या आप टेस्ट सबमिट करना चाहते हैं?</h3>
            <p style="margin:0 0 18px 0; font-size:0.88rem; color:#64748b;">सबमिट करने से पहले अपने प्रयासों का विवरण देखें:</p>
            <div id="submit-summary-box" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; text-align:left; font-size:0.85rem; font-weight:800;"></div>
            <div style="display:flex; gap:12px;">
                <button onclick="closeSubmitModal()" style="flex:1; padding:11px; border-radius:8px; border:2px solid #cbd5e1; background:white; font-weight:800; cursor:pointer;">वापस टेस्ट पर जाएं</button>
                <button onclick="finalSubmit()" style="flex:1; padding:11px; border-radius:8px; border:none; background:#16a34a; color:white; font-weight:900; cursor:pointer;">Confirm & Submit</button>
            </div>
        </div>
    </div>

    <div class="tb-modal-backdrop" id="tb-pause-modal">
        <div style="background:white; width:90%; max-width:420px; border-radius:16px; padding:28px 24px; box-shadow:0 20px 50px rgba(0,0,0,0.35); text-align:center;">
            <div style="width:56px; height:56px; border-radius:999px; background:#fef3c7; color:#d97706; display:flex; align-items:center; justify-content:center; font-size:1.6rem; margin:0 auto 14px auto; font-weight:900;">⏸</div>
            <h3 style="margin:0 0 8px 0; font-size:1.35rem; font-weight:900; color:#0f172a;">टेस्ट रोक दिया गया है (Test Paused)</h3>
            <p style="margin:0 0 22px 0; font-size:0.9rem; color:#64748b; line-height:1.5;">आपका समय (Timer) सुरक्षित रूप से रुका हुआ है। जब आप तैयार हों, तो नीचे दिए गए बटन पर क्लिक करके टेस्ट फिर से शुरू करें।</p>
            <div style="display:flex; gap:12px;">
                <button onclick="exitTest()" style="flex:1; padding:12px; border-radius:10px; border:2px solid #cbd5e1; background:white; color:#475569; font-weight:800; cursor:pointer; font-size:0.9rem;">Exit Test</button>
                <button onclick="toggleTbPause()" style="flex:1.4; padding:12px; border-radius:10px; border:none; background:#0284c7; color:white; font-weight:900; cursor:pointer; font-size:0.95rem; box-shadow:0 4px 12px rgba(2,132,199,0.3);">▶ Resume Test</button>
            </div>
        </div>
    </div>

    <script>
        const questions = ${safeJsonQuestions};
        let currentIdx = 0;
        let activeSection = 'ALL';
        let sectionList = ['ALL'];
        let langMode = 'HI';
        let userResponses = {};
        let questionStates = {};
        let hasStartedExam = false;

        questions.forEach((_, i) => { questionStates[i] = i === 0 ? 'not_answered' : 'not_visited'; });

        function hasDevanagariChars(str) {
            if (!str) return false;
            const s = String(str);
            for (let i = 0; i < s.length; i++) {
                const code = s.charCodeAt(i);
                if (code >= 2304 && code <= 2431) return true;
            }
            return false;
        }

        function hasLatinWords(str) {
            if (!str) return false;
            const s = String(str);
            let count = 0;
            for (let i = 0; i < s.length; i++) {
                const c = s.charCodeAt(i);
                if ((c >= 65 && c <= 90) || (c >= 97 && c <= 122)) {
                    count++;
                    if (count >= 2) return true;
                } else {
                    count = 0;
                }
            }
            return false;
        }

        window.syncInstructionLang = function(val) {
            langMode = val || 'HI';
            const topSel = document.getElementById('lang-mode-select');
            if (topSel) topSel.value = langMode;
            ensureQuestionBilingual(currentIdx);
            renderQuestion();
        };

        window.startExamFromInstructions = function() {
            const chk = document.getElementById('inst-ready-check');
            if (chk && !chk.checked) {
                alert('कृपया परीक्षा शुरू करने से पहले घोषणा (Declaration) बॉक्स पर टिक करें।');
                return;
            }
            const instSel = document.getElementById('inst-default-lang');
            if (instSel) {
                langMode = instSel.value || 'HI';
            }
            const topSel = document.getElementById('lang-mode-select');
            if (topSel) topSel.value = langMode;

            const overlay = document.getElementById('tb-instructions-overlay');
            if (overlay) overlay.style.display = 'none';

            hasStartedExam = true;
            ensureQuestionBilingual(currentIdx);
            renderQuestion();
            renderPalette();
        };

        window.toggleTbFullscreen = function() {
            try {
                const parentDoc = (window.parent && window.parent.document) ? window.parent.document : document;
                const rootEl = parentDoc.documentElement || document.documentElement;
                const isFs = parentDoc.fullscreenElement || parentDoc.webkitFullscreenElement || document.fullscreenElement;
                const btn = document.getElementById('tb-fullscreen-btn');
                if (!isFs) {
                    window._userExitedFullscreen = false;
                    if (rootEl.requestFullscreen) rootEl.requestFullscreen({ navigationUI: 'hide' }).catch(()=>{});
                    else if (rootEl.webkitRequestFullscreen) rootEl.webkitRequestFullscreen();
                    window.parent.postMessage({ type: 'FORCE_FULLSCREEN' }, '*');
                    if (btn) btn.innerHTML = '🗗 Exit Full Screen';
                } else {
                    if (parentDoc.exitFullscreen) parentDoc.exitFullscreen().catch(()=>{});
                    else if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
                    window.parent.postMessage({ type: 'EXIT_FULLSCREEN' }, '*');
                    if (btn) btn.innerHTML = '⛶ Full Screen';
                }
            } catch (err) {
                window.parent.postMessage({ type: 'FORCE_FULLSCREEN' }, '*');
            }
        };

        async function translateSingleStringLive(text, sl, tl) {
            const clean = String(text || '').trim();
            if (!clean) return '';
            try {
                const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + sl + '&tl=' + tl + '&dt=t&q=' + encodeURIComponent(clean);
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && Array.isArray(data[0])) {
                        return data[0].map(part => part[0]).join('').trim();
                    }
                }
            } catch (e) {}
            return clean;
        }

        async function ensureQuestionBilingual(idx) {
            const q = questions[idx];
            if (!q) return;
            const hi = (q.questionHi || '').trim();
            const en = (q.questionEn || '').trim();

            if (hi && !en && !q._translatingEn) {
                q._translatingEn = true;
                q.questionEn = await translateSingleStringLive(hi, 'hi', 'en');
                if (currentIdx === idx) renderQuestion();
            } else if (en && !hi && !q._translatingHi) {
                q._translatingHi = true;
                q.questionHi = await translateSingleStringLive(en, 'en', 'hi');
                if (currentIdx === idx) renderQuestion();
            }

            if (Array.isArray(q.options)) {
                if (langMode === 'EN' && !q._optionsEn && !q._translatingOptsEn) {
                    const needsEnOpts = q.options.some(o => hasDevanagariChars(o) && String(o).indexOf(' / ') === -1);
                    if (needsEnOpts) {
                        q._translatingOptsEn = true;
                        q._optionsEn = await Promise.all(q.options.map(async (opt) => {
                            const raw = String(opt || '').trim();
                            if (!raw || raw.indexOf(' / ') !== -1 || !hasDevanagariChars(raw)) return raw;
                            return await translateSingleStringLive(raw, 'hi', 'en');
                        }));
                        if (currentIdx === idx) renderQuestion();
                    }
                } else if (langMode === 'HI' && !q._optionsHi && !q._translatingOptsHi) {
                    const needsHiOpts = q.options.some(o => !hasDevanagariChars(o) && hasLatinWords(o) && String(o).indexOf(' / ') === -1);
                    if (needsHiOpts) {
                        q._translatingOptsHi = true;
                        q._optionsHi = await Promise.all(q.options.map(async (opt) => {
                            const raw = String(opt || '').trim();
                            if (!raw || raw.indexOf(' / ') !== -1 || hasDevanagariChars(raw) || !hasLatinWords(raw)) return raw;
                            return await translateSingleStringLive(raw, 'en', 'hi');
                        }));
                        if (currentIdx === idx) renderQuestion();
                    }
                }
            }
        }

        window.changeLangMode = function(newMode) {
            langMode = newMode || 'HI';
            const instSel = document.getElementById('inst-default-lang');
            if (instSel) instSel.value = langMode;
            ensureQuestionBilingual(currentIdx);
            renderQuestion();
        };

        function renderSectionTabs() {
            sectionList = ['ALL'];
            questions.forEach(q => {
                const sec = q.section || 'सामान्य';
                if (!sectionList.includes(sec)) sectionList.push(sec);
            });
            const container = document.getElementById('section-tabs');
            container.innerHTML = sectionList.map((sec, sIdx) => {
                const count = sec === 'ALL' ? questions.length : questions.filter(q => (q.section || 'सामान्य') === sec).length;
                return '<button class="tb-sec-tab ' + (activeSection === sec ? 'active' : '') + '" onclick="filterSectionByIndex(' + sIdx + ')">' + (sec === 'ALL' ? 'सभी प्रश्न (All)' : sec) + ' (' + count + ')</button>';
            }).join('');
        }

        window.filterSectionByIndex = function(sIdx) {
            const sec = sectionList[sIdx] || 'ALL';
            activeSection = sec;
            if (sec !== 'ALL') {
                const firstIdx = questions.findIndex(q => (q.section || 'सामान्य') === sec);
                if (firstIdx !== -1) goToQuestion(firstIdx);
            }
            renderSectionTabs();
            renderPalette();
        };

        window.selectOption = function(optKey) {
            userResponses[currentIdx] = optKey;
            if (questionStates[currentIdx] === 'review' || questionStates[currentIdx] === 'ans_review') {
                questionStates[currentIdx] = 'ans_review';
            } else {
                questionStates[currentIdx] = 'answered';
            }
            renderQuestion();
            renderPalette();
        };

        window.clearResponse = function() {
            delete userResponses[currentIdx];
            questionStates[currentIdx] = 'not_answered';
            renderQuestion();
            renderPalette();
        };

        window.saveAndNext = function() {
            if (userResponses[currentIdx]) {
                questionStates[currentIdx] = 'answered';
            } else {
                questionStates[currentIdx] = 'not_answered';
            }
            if (currentIdx < questions.length - 1) {
                goToQuestion(currentIdx + 1);
            } else {
                renderPalette();
                openSubmitModal();
            }
        };

        window.markForReviewAndNext = function() {
            if (userResponses[currentIdx]) {
                questionStates[currentIdx] = 'ans_review';
            } else {
                questionStates[currentIdx] = 'review';
            }
            if (currentIdx < questions.length - 1) {
                goToQuestion(currentIdx + 1);
            } else {
                renderPalette();
            }
        };

        window.prevQuestion = function() {
            if (currentIdx > 0) goToQuestion(currentIdx - 1);
        };

        window.goToQuestion = function(idx) {
            currentIdx = idx;
            if (questionStates[currentIdx] === 'not_visited') {
                questionStates[currentIdx] = 'not_answered';
            }
            renderQuestion();
            renderPalette();
        };

        function formatOptionForActiveLang(q, oIdx, fallbackKey) {
            const rawOptStr = (q.options && q.options[oIdx]) ? q.options[oIdx] : '';
            const raw = String(rawOptStr || '').trim();
            if (!raw) return (langMode === 'EN' ? 'Option ' : 'विकल्प ') + fallbackKey;

            if (raw.indexOf(' / ') !== -1) {
                const parts = raw.split(' / ').map(s => s.trim()).filter(Boolean);
                if (parts.length >= 2) {
                    const hiPart = parts.find(p => hasDevanagariChars(p));
                    const enPart = parts.find(p => !hasDevanagariChars(p));
                    if (hiPart && enPart) {
                        return langMode === 'EN' ? enPart : hiPart;
                    }
                    return langMode === 'EN' ? parts[0] : parts[parts.length - 1];
                }
            }

            if (langMode === 'EN' && q._optionsEn && q._optionsEn[oIdx]) {
                return q._optionsEn[oIdx];
            }
            if (langMode === 'HI' && q._optionsHi && q._optionsHi[oIdx]) {
                return q._optionsHi[oIdx];
            }
            return raw;
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            if (!q) {
                document.getElementById('q-body-container').innerHTML = '<div style="padding:20px; font-weight:800; color:#64748b;">कोई प्रश्न उपलब्ध नहीं है।</div>';
                return;
            }
            ensureQuestionBilingual(currentIdx);
            if (currentIdx + 1 < questions.length) ensureQuestionBilingual(currentIdx + 1);

            document.getElementById('q-number-label').innerText = (langMode === 'EN' ? 'Question No. ' : 'प्रश्न क्र. ') + (currentIdx + 1) + ' / ' + questions.length;
            document.getElementById('q-sec-badge').innerText = q.section || 'RRB PYQ';

            const selected = userResponses[currentIdx] || null;
            const optKeys = ['A', 'B', 'C', 'D'];

            const englishQ = (q.questionEn || '').trim();
            const hindiQ = (q.questionHi || '').trim();

            let qTextHtml = '';
            if (langMode === 'EN') {
                qTextHtml = '<div class="tb-q-text-en">' + (englishQ || hindiQ) + '</div>';
            } else {
                qTextHtml = '<div class="tb-q-text-hi">' + (hindiQ || englishQ) + '</div>';
            }

            const imgHtml = q.image ? '<div style="margin: 14px 0 20px 0;"><img src="' + q.image + '" style="max-height:240px; max-width:100%; border-radius:8px; border:1px solid #cbd5e1;" /></div>' : '';

            const optsHtml = optKeys.map((k, i) => {
                const optVal = formatOptionForActiveLang(q, i, k);
                const isSel = selected === k;
                return '<div class="tb-opt-card ' + (isSel ? 'selected' : '') + '" onclick="selectOption(\\'' + k + '\\')">' +
                    '<div class="tb-opt-circle">' + k + '</div>' +
                    '<div class="tb-opt-text" style="font-size:1.08rem; font-weight:700; color:#1e293b; flex:1;">' + optVal + '</div>' +
                '</div>';
            }).join('');

            document.getElementById('q-body-container').innerHTML = qTextHtml + imgHtml + '<div style="margin-top:20px;">' + optsHtml + '</div>';
        }

        function renderPalette() {
            let ans = 0, notAns = 0, notVis = 0, rev = 0;
            Object.values(questionStates).forEach(st => {
                if (st === 'answered') ans++;
                else if (st === 'not_answered') notAns++;
                else if (st === 'not_visited') notVis++;
                else if (st === 'review' || st === 'ans_review') rev++;
            });
            document.getElementById('cnt-ans').innerText = ans;
            document.getElementById('cnt-not-ans').innerText = notAns;
            document.getElementById('cnt-not-vis').innerText = notVis;
            document.getElementById('cnt-rev').innerText = rev;

            const grid = document.getElementById('palette-grid');
            grid.innerHTML = questions.map((q, i) => {
                if (activeSection !== 'ALL' && (q.section || 'सामान्य') !== activeSection) return '';
                const st = questionStates[i] || 'not_visited';
                return '<button class="tb-p-btn ' + st + ' ' + (currentIdx === i ? 'current' : '') + '" onclick="goToQuestion(' + i + ')">' + (i + 1) + '</button>';
            }).join('');
        }

        window.openSubmitModal = function() {
            let ans = 0, notAns = 0, notVis = 0, rev = 0;
            Object.values(questionStates).forEach(st => {
                if (st === 'answered' || st === 'ans_review') ans++;
                else if (st === 'not_answered') notAns++;
                else if (st === 'not_visited') notVis++;
                else if (st === 'review') rev++;
            });
            document.getElementById('submit-summary-box').innerHTML =
                '<div style="background:#f0fdf4; padding:10px; border-radius:8px; color:#166534;">Answered: ' + ans + '</div>' +
                '<div style="background:#fef2f2; padding:10px; border-radius:8px; color:#991b1b;">Not Answered: ' + notAns + '</div>' +
                '<div style="background:#f8fafc; padding:10px; border-radius:8px; color:#475569;">Not Visited: ' + notVis + '</div>' +
                '<div style="background:#faf5ff; padding:10px; border-radius:8px; color:#6b21a8;">Marked Review: ' + rev + '</div>';
            document.getElementById('submit-modal').style.display = 'flex';
        };

        window.closeSubmitModal = function() {
            document.getElementById('submit-modal').style.display = 'none';
        };

        let time = ${timeInSeconds};
        let isPaused = false;
        window.toggleTbPause = function() {
            if (!hasStartedExam) return;
            isPaused = !isPaused;
            const pm = document.getElementById('tb-pause-modal');
            if (pm) pm.style.display = isPaused ? 'flex' : 'none';
            const pb = document.getElementById('tb-pause-btn');
            if (pb) pb.innerHTML = isPaused ? '▶ Resume' : '⏸ Pause';
        };

        let timerInterval = setInterval(() => {
            if (!hasStartedExam || isPaused) return;
            if (time <= 0) {
                clearInterval(timerInterval);
                finalSubmit();
                return;
            }
            time--;
            let m = Math.floor(time / 60).toString().padStart(2, '0');
            let s = (time % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = 'Time Left 00:' + m + ':' + s;
        }, 1000);

        window.exitTest = function() {
            clearInterval(timerInterval);
            window.parent.postMessage({ type: 'TEST_EXIT' }, '*');
        };

        // AI/clipboard solution ko safe text ke roop mein render karein.
        // HTML tags escape hote hain, isliye pasted content question/options ka layout nahi bigaad sakta.
        function formatSolutionForDisplay(raw) {
            const escapeHtml = function(value) {
                return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            };
            const normalized = String(raw || '').replace(/\\r\\n?/g, '\\n')
                .replace(/[\\u00a0\\u2007\\u202f]/g, ' ').trim();
            if (!normalized) return '';
            return normalized.split('\\n').map(function(line) {
                const bullet = line.match(/^\\s*[•●▪◦‣*-]\\s*(.*)$/);
                if (bullet) {
                    return '<div style="padding-left:1.25em;text-indent:-1.1em;margin:3px 0;">• ' + escapeHtml(bullet[1]) + '</div>';
                }
                const numbered = line.match(/^\\s*(\\d+[.)])\\s*(.*)$/);
                if (numbered) {
                    return '<div style="padding-left:1.7em;text-indent:-1.5em;margin:4px 0;"><b>' + escapeHtml(numbered[1]) + '</b> ' + escapeHtml(numbered[2]) + '</div>';
                }
                return line.trim() ? '<div style="margin:3px 0;">' + escapeHtml(line) + '</div>' : '<div style="height:7px;"></div>';
            }).join('');
        }

        window.finalSubmit = function() {
            clearInterval(timerInterval);
            let attempted = 0;
            let correctCount = 0;
            let details = [];
            const optKeys = ['A', 'B', 'C', 'D'];

            questions.forEach((q, idx) => {
                const userAns = userResponses[idx] ? String(userResponses[idx]).trim().toUpperCase() : null;
                const correctAns = String(q.answer || 'A').trim().toUpperCase();
                if (userAns) {
                    attempted++;
                    if (userAns === correctAns) correctCount++;
                }

                const radiosHtml = optKeys.map((k, oIdx) => {
                    const optText = (q.options && q.options[oIdx]) ? q.options[oIdx] : ('Option ' + k + ' / विकल्प ' + k);
                    return '<label style="display:flex; align-items:center; gap:12px; font-size:1.1rem; font-weight:700; color:#1e293b; padding:10px 16px; margin-bottom:8px; border-radius:8px;">' +
                        '<input type="radio" name="q' + (idx + 1) + '" value="' + k + '" ' + (userAns === k ? 'checked' : '') + ' style="transform:scale(1.4);" /> ' +
                        '<span><b>(' + k + ')</b> ' + optText + '</span>' +
                    '</label>';
                }).join('');

                const solutionHtml =
                    '<div style="margin-top:22px; padding:20px 24px; background:linear-gradient(135deg, #f0fdf4 0%, #ecfeff 100%); border:1px solid #86efac; border-left:6px solid #16a34a; border-radius:14px; box-shadow:0 4px 12px rgba(22,163,74,0.08);">' +
                        '<div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px dashed #86efac;">' +
                            '<span style="font-weight:900; color:#15803d; font-size:1.05rem;">✅ सही उत्तर / Correct Answer: विकल्प (' + correctAns + ')</span>' +
                            '<span style="background:#16a34a; color:white; font-size:0.72rem; font-weight:900; padding:4px 10px; border-radius:999px; letter-spacing:0.4px;">TESTBOOK DETAILED SOLUTION</span>' +
                        '</div>' +
                        '<div style="color:#0f172a; font-size:1rem; font-weight:600; line-height:1.85; overflow-wrap:anywhere;">' + formatSolutionForDisplay(q.solution || ('सही उत्तर विकल्प (' + correctAns + ') है।')) + '</div>' +
                    '</div>';

                const englishQuestionText = (q.questionEn || '').trim();
                const hindiQuestionText = (q.questionHi || '').trim();

                const bilingualBlockHtml =
                    (hindiQuestionText ? '<div style="font-size:1.2rem; font-weight:700; color:#0f172a; margin-bottom:10px; line-height:1.7; white-space:pre-line;">' + hindiQuestionText + '</div>' : '') +
                    (englishQuestionText ? '<div style="font-size:1.08rem; font-weight:700; color:#334155; background:#f8fafc; padding:10px 14px; border-left:4px solid #3b82f6; border-radius:6px; margin-bottom:14px; line-height:1.6; white-space:pre-line;">' + englishQuestionText + '</div>' : '');

                const rowHtml =
                    '<div style="background:white; padding:24px; border-radius:12px; border:1px solid #e2e8f0;">' +
                        '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">' +
                            '<span class="q-num" style="font-weight:900; font-size:1.2rem;">Q. ' + (idx + 1) + '</span>' +
                            '<span style="background:#e0f2fe; color:#0369a1; font-size:0.8rem; font-weight:800; padding:4px 12px; border-radius:999px;">' + (q.section || 'RRB PYQ') + '</span>' +
                        '</div>' +
                        bilingualBlockHtml +
                        (q.image ? '<div style="margin:12px 0;"><img src="' + q.image + '" style="max-height:220px; border-radius:8px; border:1px solid #cbd5e1;" /></div>' : '') +
                        '<div style="margin-top:14px;">' + radiosHtml + '</div>' +
                        solutionHtml +
                    '</div>';

                details.push({
                    id: idx,
                    userAns: userAns ? userAns.toLowerCase() : null,
                    correctAns: correctAns.toLowerCase(),
                    html: rowHtml,
                    type: 'custom'
                });
            });

            const totalQs = questions.length || 1;
            const mean = totalQs * 0.65;
            const sd = totalQs * 0.15 || 1;
            const tScore = 50 + 10 * ((correctCount - mean) / sd);

            window.parent.postMessage({

            return tok;

        // (g) एकल कैपिटल अक्षर वेरिएबल (A, B, C, D, P, Q, R, X, Y, Z) - वाक्य के शुरू में 'A' आर्टिकल को छोड़कर
        s = s.replace(/(^|[\s,(\[])([B-HJ-Z])(?=[\s,.)\]:;?!'"]|$)/g, (_, pre, ch) => `${pre}${lockToken(ch)}`);
        s = s.replace(/(,\s*|\band\s+|\bor\s+|\bpoint\s+|\bperson\s+|\bletter\s+|\bfrom\s+|\bto\s+|\bbetween\s+)A(?=[\s,.)\]:;?!'"]|$)/gi, (_, pre) => `${pre}${lockToken('A')}`);
        s = s.replace(/\bA(?=\s*(?:,\s*[B-Z]|\band\s+[B-Z]|\bor\s+[B-Z]|\bis\s+the\b|\bsits\b|\blives\b|\bcan\b|=|\+|\-|:))/g, () => lockToken('A'));

        const restoreTokens = (translatedStr) => {
            if (!translatedStr) return '';
            let out = String(translatedStr);
            out = out.replace(/⟪\s*([०-९0-9]+)\s*⟫/g, (_, rawIdx) => {
                const asciiIdx = Number(
                    String(rawIdx).replace(/[०-९]/g, d => String(devDigits.indexOf(d)))
                );
                return vault[asciiIdx] !== undefined ? vault[asciiIdx] : _;
            });
            return out;
        };

        return { protectedText: s, restoreTokens };
    };

    // 7. मुख्य लाइव ट्रांसलेटर (Google Translate + Smart Token Protection + RRB Exam Glossary)
    const translateTextLive = async (text, sourceLang, targetLang, contextHint = '') => {
        const clean = cleanMathAndSymbolsForDemo(String(text || '').trim());
        if (!clean) return '';

        // यदि पहले से ही छोटा तकनीकी/नियम वाक्यांश है, तो सीधे शब्दकोश से शुद्ध हिन्दी लौटाएं
        if (sourceLang === 'en' && targetLang === 'hi') {
            for (const [regex, hiVal] of EXAM_TECH_EXACT_HINDI_MAP) {
                if (regex.test(clean)) {
                    return hiVal.replace(regex, hiVal);
                }
            }
        }

        try {
            const protection = (sourceLang === 'en' && targetLang === 'hi')
                ? protectEssentialEnglishTokens(clean, contextHint)
                : { protectedText: clean, restoreTokens: (x) => x };

            const textToSend = protection.protectedText;
            const lines = textToSend.split('\n');
            const chunks = [];
            let currentChunk = '';
            for (const line of lines) {
                if ((currentChunk.length + line.length + 1) > 1100 && currentChunk.trim()) {
                    chunks.push(currentChunk);
                    currentChunk = line;
                } else {
                    currentChunk = currentChunk ? `${currentChunk}\n${line}` : line;
                }
            }
            if (currentChunk.trim()) chunks.push(currentChunk);

            const translatedChunks = [];
            for (const chunk of chunks) {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(chunk)}`;
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && Array.isArray(data[0])) {
                        const partStr = data[0].map(part => part[0]).join('').trim();
                        translatedChunks.push(partStr);
                    } else {
                        translatedChunks.push(chunk);
                    }
                } else {
                    translatedChunks.push(chunk);
                }
            }

            let finalTranslated = protection.restoreTokens(translatedChunks.join('\n').trim());

            if (targetLang === 'hi') {
                // रीजनिंग और तकनीकी वाक्यों के लिए पोस्ट-प्रोसेसिंग सुधार
                finalTranslated = finalTranslated
                    .replace(/एक\s+निश्चित\s+कोड\s+भाषा\s+में/g, 'एक निश्चित कूट भाषा में')
                    .replace(/अजीब\s+(?:का\s+)?चयन\s+करें|विषम\s+का\s+चयन\s+करें/g, 'असंगत (भिन्न) का चयन करें')
                    .replace(/पत्र[\s\-]*समूह/g, 'अक्षर-समूह')
                    .replace(/संभावित\s+अंतर/g, 'विभवांतर')
                    .replace(/वर्तमान\s+प्रवाह/g, 'विद्युत धारा प्रवाह');
                finalTranslated = fixBrokenHindiText(finalTranslated);
            }
            return finalTranslated;
        } catch (e) {}
        return clean;
    };

    const repairHindiWithCloudModel = async (rawHindiText) => {
        let localFixed = fixBrokenHindiText(rawHindiText);
        if (!localFixed || localFixed.length < 2) return localFixed;
        const isSafeCorrection = (originalStr, candidateStr) => {
            if (!candidateStr || !/[\u0900-\u097F]/.test(candidateStr)) return false;
            if (candidateStr.length < originalStr.length * 0.75 || candidateStr.length > originalStr.length * 1.35) return false;
            const origNums = (originalStr.match(/\d+/g) || []).join(',');
            const candNums = (candidateStr.match(/\d+/g) || []).join(',');
            return origNums === candNums;
        };
        try {
            const sentences = localFixed.split(/(?<=[।?!\n])/);
            const checkedSentences = await Promise.all(sentences.map(async (sent) => {
                const trimmedSent = sent.trim();
                if (!trimmedSent || trimmedSent.length < 3) return sent;
                try {
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=hi&tl=hi&dt=sp&dt=t&q=${encodeURIComponent(trimmedSent)}`;
                    const res = await fetch(url);
                    if (res.ok) {
                        const data = await res.json();
                        if (Array.isArray(data) && Array.isArray(data[7]) && typeof data[7][1] === 'string' && data[7][1].trim()) {
                            const spellChecked = data[7][1].replace(/<\/?(?:b|i|em)>/gi, '').trim();
                            if (isSafeCorrection(trimmedSent, spellChecked)) {
                                return fixBrokenHindiText(spellChecked);
                            }
                        }
                    }
                } catch (e) {}
                return fixBrokenHindiText(sent);
            }));
            localFixed = fixBrokenHindiText(checkedSentences.join(' '));
        } catch (e) {}
        return fixBrokenHindiText(localFixed);
    };

    // 8. स्मार्ट ऑप्शन ट्रांसलेटर (English -> शुद्ध हिन्दी, केवल जरूरी English डेटा ही रखेगा!)
    const translateOptionSmartEnToHi = async (optRaw, contextStem = '') => {
        let cleanOpt = cleanMathAndSymbolsForDemo(String(optRaw || '').trim());
        if (!cleanOpt) return '';

        // यदि खाली प्लेसहोल्डर है
        if (/^(?:Option\s*[A-D]\s*\/\s*विकल्प\s*[A-D]|विकल्प\s*[A-D]|Option\s*[A-D])$/i.test(cleanOpt)) {
            const letter = cleanOpt.match(/[A-D]/i)?.[0]?.toUpperCase() || 'A';
            return `विकल्प ${letter}`;
        }

        // यदि पहले से "English / हिन्दी" स्लैश फॉर्मेट में है (स्पेस के साथ ' / '), तो केवल शुद्ध हिन्दी भाग या आवश्यक भाग निकालें
        if (cleanOpt.includes(' / ') && /[\u0900-\u097F]/.test(cleanOpt)) {
            const parts = cleanOpt.split(/\s+\/\s+/).map(p => p.trim()).filter(Boolean);
            const hiPart = parts.find(p => /[\u0900-\u097F]/.test(p));
            const enPart = parts.find(p => !/[\u0900-\u097F]/.test(p));
            if (hiPart) {
                const fixedHi = fixBrokenHindiText(hiPart);
                // यदि अंग्रेजी भाग कोई जरूरी शॉर्ट-फॉर्म (जैसे AC, DC, MOSFET, LED) है और हिन्दी में नहीं लिखा है, तो ब्रैकेट में रखें
                if (enPart && ESSENTIAL_TECH_ACRONYMS.has(enPart.toUpperCase()) && !fixedHi.toUpperCase().includes(enPart.toUpperCase())) {
                    return `${fixedHi} (${enPart.toUpperCase()})`;
                }
                return fixedHi;
            }
        }

        // स्टेप A: जाँचें कि क्या यह विकल्प पहले से ही शुद्ध हिन्दी में है
        const hasHi = /[\u0900-\u097F]/.test(cleanOpt);
        const hasEnWords = /[A-Za-z]{2,}/.test(cleanOpt);
        if (hasHi && !hasEnWords) {
            return fixBrokenHindiText(cleanOpt);
        }

        // स्टेप B: जाँचें कि क्या इस विकल्प का डेटा 100% जरूरी English/Symbolic डेटा है (जैसे 25 m/s, H2SO4, MOSFET, KQW, 1400)
        if (isCodeOrMathOnlyOption(cleanOpt, contextStem)) {
            return cleanOpt;
        }

        // स्टेप C: जाँचें कि क्या यह हमारे सटीक तकनीकी शब्दकोश में है
        for (const [regex, hiReplacement] of EXAM_TECH_EXACT_HINDI_MAP) {
            if (regex.test(cleanOpt)) {
                return cleanOpt.replace(regex, hiReplacement);
            }
        }

        // स्टेप D: Google Translate से शुद्ध हिन्दी में बदलें (जरूरी कोड्स/वेरिएबल्स/मात्रकों को सुरक्षित रखते हुए)
        const translatedHi = await translateTextLive(cleanOpt, 'en', 'hi', contextStem);
        if (translatedHi) {
            return fixBrokenHindiText(translatedHi);
        }
        return fixBrokenHindiText(cleanOpt);
    };

    // अब formatBilingualOptionWithSlash भी अनावश्यक English जोड़ने के बजाय शुद्ध हिन्दी + जरूरी English डेटा ही रखेगा
    const formatBilingualOptionWithSlash = async (optRaw, allowNetworkTranslate = true, contextStem = '') => {
        if (!allowNetworkTranslate) {
            return fixBrokenHindiText(String(optRaw || '').trim());
        }
        return await translateOptionSmartEnToHi(optRaw, contextStem);
    };

    const enrichSingleQuestionBilingual = async (qObj, forceNetwork = true) => {
        let qHi = fixBrokenHindiText(qObj.questionHi || '');
        let qEn = String(qObj.questionEn || '').trim();
        if (qHi && !qEn && /[A-Za-z]{4,}/.test(qHi)) {
            const split = splitBilingualStem(qHi);
            if (split.en && split.hi) {
                qEn = split.en;
                qHi = split.hi;
            }
        } else if (qEn && !qHi && /[\u0900-\u097F]/.test(qEn)) {
            const split = splitBilingualStem(qEn);
            if (split.en && split.hi) {
                qEn = split.en;
                qHi = split.hi;
            }
        }
        if (qHi) {
            qHi = forceNetwork ? await repairHindiWithCloudModel(qHi) : fixBrokenHindiText(qHi);
        }
        if (!qHi && qEn) {
            const transHi = await translateTextLive(qEn, 'en', 'hi');
            qHi = fixBrokenHindiText(transHi);
        } else if (!qEn && qHi) {
            qEn = await translateTextLive(qHi, 'hi', 'en');
        }

        const contextForOpts = qEn || qHi || '';
        const updatedOpts = await Promise.all(
            (qObj.options || []).map(opt => translateOptionSmartEnToHi(opt, contextForOpts))
        );

        let fixedSol = qObj.solution ? fixBrokenHindiText(qObj.solution) : '';
        if (fixedSol && !/[\u0900-\u097F]/.test(fixedSol) && /[A-Za-z]{3,}/.test(fixedSol)) {
            const transSolHi = await translateTextLive(fixedSol, 'en', 'hi', contextForOpts);
            if (transSolHi) fixedSol = `हल: ${fixBrokenHindiText(transSolHi)}`;
        }
        return {
            ...qObj,
            questionEn: qEn,
            questionHi: qHi,
            options: updatedOpts,
            solution: fixedSol
        };
    };

// ==================== HIND/ENGLISH SOLUTION FORMATTER HELPERS ====================
    // किसी भी Solution (हल) में से हिन्दी और English भाग को अलग-अलग पहचानने वाला फंक्शन
    const splitBilingualSolutionParts = (rawSol) => {
        if (!rawSol) return { hi: '', en: '' };
        let cleaned = String(rawSol)
            .replace(/\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]/g, '')
            .replace(/(?:^|\n)\s*(?:सही\s*(?:उत्तर|विकल्प)(?:\s*\(Green\))?|Correct\s*(?:Option|Answer)(?:\s*\(Green\))?)\s*[:\-\=]\s*\(?[A-Da-d1-4अ-द]\)?(?=\s|$)/gi, '')
            .trim();

        if (!cleaned) return { hi: '', en: '' };

        // यदि पहले से "हल: ... / Solution: ..." या "Hindi / English" फॉर्मेट में है
        const explicitSlashSplit = cleaned.split(/\s+\/\s+(?=(?:Solution|Explanation|हल|व्याख्या)\s*[:\-])/i);
        if (explicitSlashSplit.length >= 2) {
            let hiPart = '';
            let enPart = '';
            explicitSlashSplit.forEach(part => {
                const stripped = part.replace(/^(?:हल|व्याख्या|Solution|Explanation|Sol)\s*[:\-\/]?\s*/i, '').trim();
                if (/[\u0900-\u097F]/.test(stripped)) {
                    hiPart = hiPart ? `${hiPart} ${stripped}` : stripped;
                } else if (stripped) {
                    enPart = enPart ? `${enPart} ${stripped}` : stripped;
                }
            });
            return { hi: fixBrokenHindiText(hiPart), en: enPart.trim() };
        }

        // सामान्य प्रीफ़िक्स हटाएं
        cleaned = cleaned.replace(/^(?:हल\s*\/\s*Solution|Solution\s*\/\s*हल|हल|व्याख्या|Solution|Explanation|Sol)\s*[:\-\/]?\s*/i, '').trim();

        // यदि बीच में ' / ' है और एक तरफ हिन्दी तथा दूसरी तरफ English है (मात्रक जैसे m/s को छोड़कर)
        if (cleaned.includes(' / ')) {
            const slashParts = cleaned.split(/\s+\/\s+/).map(p => p.trim()).filter(Boolean);
            if (slashParts.length === 2) {
                const p0Hi = /[\u0900-\u097F]/.test(slashParts[0]);
                const p1Hi = /[\u0900-\u097F]/.test(slashParts[1]);
                if (p0Hi && !p1Hi) {
                    return {
                        hi: fixBrokenHindiText(slashParts[0].replace(/^(?:हल|व्याख्या)\s*[:\-]?\s*/i, '').trim()),
                        en: slashParts[1].replace(/^(?:Solution|Explanation|Sol)\s*[:\-]?\s*/i, '').trim()
                    };
                }
                if (!p0Hi && p1Hi) {
                    return {
                        hi: fixBrokenHindiText(slashParts[1].replace(/^(?:हल|व्याख्या)\s*[:\-]?\s*/i, '').trim()),
                        en: slashParts[0].replace(/^(?:Solution|Explanation|Sol)\s*[:\-]?\s*/i, '').trim()
                    };
                }
            }
        }

        // लाइन-दर-लाइन हिन्दी और English वाक्यों को अलग करें
        const lines = cleaned.split('\n').map(l => l.trim()).filter(Boolean);
        const hiLines = [];
        const enLines = [];
        lines.forEach(line => {
            const cleanLine = line.replace(/^(?:हल|व्याख्या|Solution|Explanation|Sol)\s*[:\-\/]?\s*/i, '').trim();
            if (!cleanLine) return;
            if (/[\u0900-\u097F]/.test(cleanLine)) {
                hiLines.push(fixBrokenHindiText(cleanLine));
            } else {
                enLines.push(cleanLine);
            }
        });

        return {
            hi: fixBrokenHindiText(hiLines.join(' ').trim()),
            en: enLines.join(' ').trim()
        };
    };

    // Solution को हमेशा "Hindi / English" (हल: ... / Solution: ...) फॉर्मेट में बदलने वाला फंक्शन
    const formatSolutionHindiEnglish = async (rawSol, allowTranslate = true, contextStem = '', fallbackAns = '') => {
        let { hi, en } = splitBilingualSolutionParts(rawSol);

        if (allowTranslate) {
            if (hi && !en) {
                en = await translateTextLive(hi, 'hi', 'en', contextStem);
            } else if (en && !hi) {
                const trHi = await translateTextLive(en, 'en', 'hi', contextStem);
                hi = fixBrokenHindiText(trHi);
            }
        }

        if (hi && en) {
            return `हल: ${fixBrokenHindiText(hi)} / Solution: ${en}`;
        }
        if (hi) {
            return `हल: ${fixBrokenHindiText(hi)}`;
        }
        if (en) {
            return `Solution: ${en}`;
        }
        if (fallbackAns) {
            return `हल: सही उत्तर विकल्प (${fallbackAns}) है। / Solution: The correct answer is option (${fallbackAns}).`;
        }
        return '';
    };

    // दो अलग-अलग बॉक्स (English Box व हिन्दी Box) के Solutions को "Hindi / English" फॉर्मेट में मर्ज करने वाला फंक्शन
    const mergeSolutionsIntoHindiEnglish = async (solA, solB, allowTranslate = true, contextStem = '', fallbackAns = 'A') => {
        const partsA = splitBilingualSolutionParts(solA);
        const partsB = splitBilingualSolutionParts(solB);

        const isDefaultAutoSol = (txt) => /दिए गए प्रश्न का विश्लेषण करने पर सही उत्तर विकल्प|सही उत्तर विकल्प \([A-D]\) है|The correct answer is option/i.test(String(txt || ''));

        let finalHi = (!isDefaultAutoSol(partsB.hi) && partsB.hi) || (!isDefaultAutoSol(partsA.hi) && partsA.hi) || partsB.hi || partsA.hi || '';
        let finalEn = (!isDefaultAutoSol(partsA.en) && partsA.en) || (!isDefaultAutoSol(partsB.en) && partsB.en) || partsA.en || partsB.en || '';

        if (allowTranslate) {
            if (finalHi && !finalEn) {
                finalEn = await translateTextLive(finalHi, 'hi', 'en', contextStem);
            } else if (finalEn && !finalHi) {
                const trHi = await translateTextLive(finalEn, 'en', 'hi', contextStem);
                finalHi = fixBrokenHindiText(trHi);
            }
        }

        if (finalHi && finalEn) {
            return `हल: ${fixBrokenHindiText(finalHi)} / Solution: ${finalEn}`;
        }
        if (finalHi) {
            return `हल: ${fixBrokenHindiText(finalHi)}`;
        }
        if (finalEn) {
            return `Solution: ${finalEn}`;
        }
        return `हल: सही उत्तर विकल्प (${fallbackAns}) है। / Solution: The correct answer is option (${fallbackAns}).`;
    };

    // Format text for the separate English Box & Hindi Box previews (Preserves Questions, Options, Answers, Images & Solutions!)
    const formatEnglishBoxText = (list) => {
        if (!Array.isArray(list) || list.length === 0) return '';
        return list.map((q, idx) => {
            const imgTokenLine = q.image ? `\n${storeImageInVault(q.image)}` : '';
            const enOpts = (q.options || []).map((o, i) => {
                const rawOpt = String(o || '').trim();
                const parts = rawOpt.includes(' / ') ? rawOpt.split(/\s+\/\s+/).map(s => s.trim()).filter(Boolean) : [rawOpt];
                const enP = parts.find(p => !/[\u0900-\u097F]/.test(p)) || parts[0] || `Option ${['A', 'B', 'C', 'D'][i]}`;
                return `(${['A', 'B', 'C', 'D'][i]}) ${enP}`;
            }).join(' ');
            const { hi: solHi, en: solEn } = splitBilingualSolutionParts(q.solution || '');
            const solDisplay = (solHi && solEn)
                ? `\nSolution: ${solHi} / ${solEn}`
                : solEn
                    ? `\nSolution: ${solEn}`
                    : solHi
                        ? `\nSolution: ${solHi}`
                        : '';
            return `Q.${idx + 1} ${q.questionEn || ''}${imgTokenLine}\n${enOpts}\nCorrect Answer (Green): ${q.answer || 'A'}${solDisplay}`;
        }).join('\n\n');
    };

    const formatHindiBoxText = (list) => {
        if (!Array.isArray(list) || list.length === 0) return '';
        return list.map((q, idx) => {
            const imgTokenLine = q.image ? `\n${storeImageInVault(q.image)}` : '';
            const hiOpts = (q.options || []).map((o, i) => {
                const rawOpt = String(o || '').trim();
                const parts = rawOpt.includes(' / ') ? rawOpt.split(/\s+\/\s+/).map(s => s.trim()).filter(Boolean) : [rawOpt];
                const hiP = parts.find(p => /[\u0900-\u097F]/.test(p)) || parts[parts.length - 1] || `विकल्प ${['A', 'B', 'C', 'D'][i]}`;
                return `(${['A', 'B', 'C', 'D'][i]}) ${hiP}`;
            }).join(' ');
            const { hi: solHi, en: solEn } = splitBilingualSolutionParts(q.solution || '');
            const solDisplay = (solHi && solEn)
                ? `\nहल: ${solHi} / ${solEn}`
                : solHi
                    ? `\nहल: ${solHi}`
                    : solEn
                        ? `\nहल: ${solEn}`
                        : '';
            return `प्र.${idx + 1} ${q.questionHi || ''}${imgTokenLine}\n${hiOpts}\nसही उत्तर (Green): ${q.answer || 'A'}${solDisplay}`;
        }).join('\n\n');
    };

    const enrichBilingualAndGrammarBatch = async (questionsArray, forceNetwork = false) => {
        if (!Array.isArray(questionsArray) || questionsArray.length === 0)
            return [];
        setCorrectingAll(true);
        const total = questionsArray.length;
        const result = [...questionsArray];
        const needsNetworkTranslation = forceNetwork || result.some(q => !q.questionEn || !q.questionHi || (q.options || []).some(o => !String(o || '').includes('/') && !isCodeOrMathOnlyOption(o)));
        const batchSize = needsNetworkTranslation ? 5 : 25;
        try {
            for (let i = 0; i < total; i += batchSize) {
                setExtractStatus(`🌐 Google Translator: प्रश्न ${i + 1} से ${Math.min(i + batchSize, total)} (कुल ${total}) को दोनों भाषाओं और 'Hindi / English' Solution में सेट किया जा रहा है...`);
                const slice = result.slice(i, i + batchSize);
                const enrichedSlice = await Promise.all(slice.map(async (q) => {
                    const enrichedQ = await enrichSingleQuestionBilingual(q, forceNetwork);
                    const formattedSol = await formatSolutionHindiEnglish(
                        enrichedQ.solution || q.solution || '',
                        true,
                        enrichedQ.questionEn || enrichedQ.questionHi || '',
                        enrichedQ.answer || 'A'
                    );
                    return { ...enrichedQ, solution: formattedSol };
                }));
                for (let j = 0; j < enrichedSlice.length; j++) {
                    result[i + j] = enrichedSlice[j];
                }
                setTbQuestions([...result]);
            }
            setRawEnglishInput(formatEnglishBoxText(result));
            setRawHindiInput(formatHindiBoxText(result));
            setMsg({

    const normalizeSingleOptionSlashOrder = (optStr) => {

    const mergeOptionArraysWithSlash = (optsA, optsB) => {

    const parseBilingualQuestionsFromText = (fullText) => {
