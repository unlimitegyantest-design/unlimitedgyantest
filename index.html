<style id="ug-display-mode-style">
    html[data-ug-mode="mobile"], html[data-ug-mode="mobile"] body {
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
    }
    html[data-ug-mode="desktop"], html[data-ug-mode="desktop"] body {
        overflow-x: auto;
    }
</style>
<script id="ug-display-mode-engine">
(function () {
    "use strict";
    var params = new URLSearchParams(window.location.search);
    var urlForce = (params.get("mode") || "").toLowerCase();
    function detectSmartMode() {
        if (urlForce === "desktop" || urlForce === "mobile") return urlForce;
        var w = window.innerWidth || document.documentElement.clientWidth || 1024;
        var ua = navigator.userAgent || "";
        var isMobileUa = /Android|iPhone|iPod|Windows Phone|Mobile/i.test(ua);
        if (w <= 768 || (isMobileUa && w <= 900)) return "mobile";
        return "desktop";
    }
    function applySmartAutoMode() {
        try {
            var active = detectSmartMode();
            window.__UG_DISPLAY_MODE__ = active;
            window.__UG_SMART_BOTH_MODE__ = true;
            window.__UG_FORCE_DESKTOP_MODE__ = (active === "desktop");
            window.__UG_FORCE_MOBILE_MODE__ = (active === "mobile");
            document.documentElement.setAttribute("data-ug-mode", active);
            document.documentElement.classList.toggle("ug-mode-mobile", active === "mobile");
            document.documentElement.classList.toggle("ug-mode-desktop", active === "desktop");
            if (document.body) {
                document.body.setAttribute("data-ug-mode", active);
                document.body.classList.toggle("ug-mode-mobile", active === "mobile");
                document.body.classList.toggle("ug-mode-desktop", active === "desktop");
            }
            var vp = document.querySelector('meta[name="viewport"]');
            if (vp) {
                if (urlForce === "desktop") {
                    var sw = (window.screen && window.screen.width) ? Math.min(window.screen.width, window.screen.height || window.screen.width) : 1280;
                    var sc = sw < 1280 ? Math.max(0.25, +(sw / 1280).toFixed(3)) : 1;
                    vp.setAttribute("content", "width=1280, initial-scale=" + sc + ", minimum-scale=0.25, maximum-scale=5.0, user-scalable=yes");
                } else {
                    vp.setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover");
                }
            }
            if (typeof window.__UG_SYNC_DEVICE_CHANGES__ === "function") {
                window.__UG_SYNC_DEVICE_CHANGES__(active);
            }
        } catch (e) {}
    }
    window.__UG_APPLY_DISPLAY_MODE__ = applySmartAutoMode;
    applySmartAutoMode();
    document.addEventListener("DOMContentLoaded", applySmartAutoMode);
    window.addEventListener("resize", applySmartAutoMode);
    window.addEventListener("orientationchange", applySmartAutoMode);
})();
</script>

<!-- =========================================================================
     PERMANENT GLOBAL UI CLEANER (APPLIES TO ALL LOGIN IDs — DESKTOP & MOBILE)
     1) Permanently removes "RRB ALP PDF Simulator" (including split spans,
        inline !important styles, and CBT/PDF variants) for EVERY login ID.
     2) Permanently removes Hindi "मेनू / मेनु / मेन्यू / मेन्यु" labels while
        keeping 3-line icon functionality 100% intact for non-admins.
     ========================================================================= -->
<style id="ug-permanent-ui-cleaner-css">
    [data-ug-perm-hidden="rrb-alp"],
    [data-ug-perm-hidden="hindi-menu"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        max-height: 0 !important;
        overflow: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
    }
</style>
<script id="ug-permanent-ui-cleaner-engine">
(function () {
    "use strict";

    if (window.__UG_PERM_UI_CLEANER_BOOTED__) return;
    window.__UG_PERM_UI_CLEANER_BOOTED__ = true;

    var isCleaning = false;
    var rafPending = false;

    /* Matches RRB ALP PDF Simulator in any format (with CBT-1/2, dashes, Hindi, or standalone PDF Simulator) */
    var RRB_SIM_RX = /(?:rrb[\s\-–—_/|:•]*alp.{0,45}?(?:pdf|simulator)|alp.{0,30}?pdf.{0,20}?simulator|\bpdf[\s\-–—_/|:•]*simulator\b|आरआरबी\s*एएलपी.{0,25}?(?:पीडीएफ|सिम्युलेटर))/i;
    var RRB_SIM_GLOBAL_RX = /(?:rrb[\s\-–—_/|:•]*alp.{0,45}?(?:pdf|simulator)|alp.{0,30}?pdf.{0,20}?simulator|\bpdf[\s\-–—_/|:•]*simulator\b|आरआरबी\s*एएलपी.{0,25}?(?:पीडीएफ|सिम्युलेटर))/gi;
    var RRB_PART_RX = /^(?:rrb[\s\-–—_/|:•]*alp(?:\s*cbt[\s\-–—]*\d*)?|pdf[\s\-–—_/|:•]*simulator|cbt[\s\-–—]*\d*\s*pdf[\s\-–—_/|:•]*simulator|alp\s*simulator)$/i;

    /* Matches ALL Hindi spellings of Menu: मेनू, मेनु, मेन्यू, मेन्यु, मैनू, मैनु, मैन्यू, मैन्यु */
    var HINDI_MENU_ANY_RX = /(?:म[ेै]न(?:्य)?[ुू][ँं]?)/u;
    var HINDI_MENU_STRIP_RX = /(?:(?:मुख्य|एडमिन|नेविगेशन|साइड|क्विक|होम)\s+)?(?:म[ेै]न(?:्य)?[ुू][ँं]?)(?:\s*(?:खोलें|बंद\s*करें|दिखाएं|छिपाएं|बटन|बार))?/gu;
    var HINDI_MENU_ONLY_RX = /^[\s•·\-–—|:()\[\]<>\/☰≡]*((?:मुख्य|एडमिन|नेविगेशन|साइड|क्विक|होम)\s+)?(?:म[ेै]न(?:्य)?[ुू][ँं]?)(?:\s*(?:खोलें|बंद\s*करें|दिखाएं|छिपाएं|बटन|बार))?[\s•·\-–—|:()\[\]<>\/☰≡]*$/u;

    var SKIP_TAGS = {
        SCRIPT: 1, STYLE: 1, NOSCRIPT: 1, TEXTAREA: 1,
        INPUT: 1, SELECT: 1, OPTION: 1, CODE: 1, PRE: 1
    };

    function cleanText(s) {
        return String(s || "").replace(/\s+/g, " ").trim();
    }

    function hideElementPermanently(el, reason) {
        if (!el || el.nodeType !== 1) return;
        if (el === document.documentElement || el === document.body || el.id === "root") return;
        if (el.id === "ug-madmin-shell" || el.id === "ug-mtest-shell" || el.id === "ug-mintro-shell" || el.id === "ug-mgen-shell" || el.id === "ug-mtest-restore-pill" ||
            (el.closest && (el.closest("#ug-madmin-shell") || el.closest("#ug-mtest-shell") || el.closest("#ug-mintro-shell") || el.closest("#ug-mgen-shell") || el.closest("#ug-mtest-restore-pill")))) return;
        el.setAttribute("data-ug-perm-hidden", reason);
        el.setAttribute("aria-hidden", "true");
        /* Inline !important beats any inline display:flex !important set by patches */
        try {
            el.style.setProperty("display", "none", "important");
            el.style.setProperty("visibility", "hidden", "important");
            el.style.setProperty("opacity", "0", "important");
            el.style.setProperty("pointer-events", "none", "important");
        } catch (e) {}
    }

    function cleanDocumentTitle() {
        try {
            var t = String(document.title || "");
            if (RRB_SIM_RX.test(t) || HINDI_MENU_ANY_RX.test(t)) {
                var cleaned = t
                    .replace(RRB_SIM_GLOBAL_RX, "")
                    .replace(HINDI_MENU_STRIP_RX, "")
                    .replace(/^[\s\-–—|:•]+|[\s\-–—|:•]+$/g, "")
                    .trim();
                document.title = cleaned || "Unlimited Gyan Test";
            }
        } catch (e) {}
    }

    function cleanInjectedStylesheets() {
        try {
            var styles = document.querySelectorAll("style");
            for (var i = 0; i < styles.length; i++) {
                var st = styles[i];
                if (!st || st.id === "ug-permanent-ui-cleaner-css") continue;
                var css = String(st.textContent || "");
                var prevLen = st.getAttribute("data-ug-perm-style-len");
                if (prevLen === String(css.length)) continue;
                if (css && (HINDI_MENU_ANY_RX.test(css) || RRB_SIM_RX.test(css))) {
                    var updated = css.replace(/content\s*:\s*(["'])([^"']*)\1/gi, function (full, q, val) {
                        if (!HINDI_MENU_ANY_RX.test(val) && !RRB_SIM_RX.test(val)) return full;
                        var nextVal = val
                            .replace(RRB_SIM_GLOBAL_RX, "")
                            .replace(HINDI_MENU_STRIP_RX, "")
                            .replace(/\s+/g, " ")
                            .trim();
                        return "content:" + q + nextVal + q;
                    });
                    if (updated !== css) {
                        st.textContent = updated;
                        css = updated;
                    }
                }
                st.setAttribute("data-ug-perm-style-len", String(css.length));
            }
        } catch (e) {}
    }

    function hasMatchingChildElement(el, rx) {
        var children = el.children;
        for (var i = 0; i < children.length; i++) {
            var ch = children[i];
            if (!ch || SKIP_TAGS[ch.tagName]) continue;
            if (ch.getAttribute("data-ug-perm-hidden")) continue;
            var txt = cleanText(ch.textContent || "");
            if (txt && rx.test(txt)) return true;
        }
        return false;
    }

    function removeRrbAlpSimulator(container) {
        if (!container) return;

        /* Pass 1: Element-level scan (handles full banners, badges, headers, and split child spans) */
        var candidates = container.querySelectorAll("h1, h2, h3, h4, h5, h6, a, button, span, p, div, li, small, strong, b, label, header");
        for (var i = 0; i < candidates.length; i++) {
            var el = candidates[i];
            if (!el || SKIP_TAGS[el.tagName]) continue;
            if (el.id === "root" || el.id === "ug-madmin-shell" || el.id === "ug-mtest-shell" || el.id === "ug-mintro-shell" || el.id === "ug-mgen-shell") continue;
            if (el.closest && (el.closest("#ug-madmin-shell") || el.closest("#ug-mtest-shell") || el.closest("#ug-mintro-shell") || el.closest("#ug-mgen-shell") || el.closest('[data-ug-perm-hidden="rrb-alp"]'))) continue;

            var attrTitle = el.getAttribute("title") || "";
            var attrAria = el.getAttribute("aria-label") || "";
            if ((attrTitle && RRB_SIM_RX.test(attrTitle)) || (attrAria && RRB_SIM_RX.test(attrAria))) {
                hideElementPermanently(el, "rrb-alp");
                continue;
            }

            var txt = cleanText(el.textContent || "");
            if (!txt || txt.length > 260 || !RRB_SIM_RX.test(txt)) continue;

            /* Wait for deepest matching child first */
            if (hasMatchingChildElement(el, RRB_SIM_RX)) continue;

            var hasNestedControls = !!el.querySelector("input, form, table, nav");
            var hasNestedButtons = (el.tagName !== "BUTTON" && el.tagName !== "A") && !!el.querySelector("button, a");
            if (txt.length <= 120 && !hasNestedControls && !hasNestedButtons) {
                hideElementPermanently(el, "rrb-alp");
            } else {
                /* Hide split child fragments (e.g. <span>RRB ALP</span><span>PDF Simulator</span>) inside a shared header */
                var subEls = el.querySelectorAll("span, small, p, b, strong, h1, h2, h3, h4, div");
                for (var s = 0; s < subEls.length; s++) {
                    var se = subEls[s];
                    if (SKIP_TAGS[se.tagName] || se.querySelector("button, a, input, form, table")) continue;
                    var stxt = cleanText(se.textContent || "");
                    if (stxt && stxt.length <= 80 && (RRB_SIM_RX.test(stxt) || RRB_PART_RX.test(stxt))) {
                        hideElementPermanently(se, "rrb-alp");
                    }
                }
                var nodes = el.childNodes;
                for (var n = 0; n < nodes.length; n++) {
                    var nd = nodes[n];
                    if (nd.nodeType === 3) {
                        var v = nd.nodeValue || "";
                        if (RRB_SIM_RX.test(v) || RRB_PART_RX.test(cleanText(v))) {
                            nd.nodeValue = v
                                .replace(RRB_SIM_GLOBAL_RX, "")
                                .replace(/^\s*(?:rrb[\s\-]*alp(?:\s*cbt[\s\-]*\d*)?|pdf\s*simulator)\s*$/i, "")
                                .replace(/\s{2,}/g, " ");
                        }
                    }
                }
            }
        }

        /* Pass 2: Direct text-node sweep for any remaining literal occurrences */
        try {
            var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
            var tn;
            while ((tn = walker.nextNode())) {
                var tv = tn.nodeValue || "";
                if (!tv || !RRB_SIM_RX.test(tv)) continue;
                var par = tn.parentElement;
                if (!par || SKIP_TAGS[par.tagName]) continue;
                if (par.closest && (par.closest("#ug-madmin-shell") || par.closest("#ug-mtest-shell") || par.closest("#ug-mintro-shell") || par.closest("#ug-mgen-shell") || par.closest('[data-ug-perm-hidden]'))) continue;
                var nextTv = tv.replace(RRB_SIM_GLOBAL_RX, "").replace(/\s{2,}/g, " ");
                if (nextTv !== tv) tn.nodeValue = nextTv.trim() ? nextTv : "";
            }
        } catch (e) {}
    }

    function removeHindiMenuLabels(container) {
        if (!container) return;

        /* Pass 1: Hide standalone elements that only contain Hindi "मेनू / मेनु / मेन्यू / मेन्यु" */
        var labelEls = container.querySelectorAll("span, small, label, p, b, strong, h1, h2, h3, h4, h5, h6, div");
        for (var i = 0; i < labelEls.length; i++) {
            var el = labelEls[i];
            if (!el || SKIP_TAGS[el.tagName]) continue;
            if (el.id === "root" || el.id === "ug-madmin-shell" || el.id === "ug-mtest-shell" || el.id === "ug-mintro-shell" || el.id === "ug-mgen-shell") continue;
            if (el.closest && (el.closest("#ug-madmin-shell") || el.closest("#ug-mtest-shell") || el.closest("#ug-mintro-shell") || el.closest("#ug-mgen-shell"))) continue;
            var txt = cleanText(el.textContent || "");
            if (!txt || txt.length > 40 || !HINDI_MENU_ONLY_RX.test(txt)) continue;
            if (el.querySelector("i, svg, img, button, a, input, [class*='bar' i], [class*='line' i]")) continue;
            hideElementPermanently(el, "hindi-menu");
        }

        /* Pass 2: Strip Hindi Menu text from mixed text nodes (keeps 3-line icon working for students) */
        try {
            var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
            var textNode;
            while ((textNode = walker.nextNode())) {
                var val = textNode.nodeValue;
                if (!val || !HINDI_MENU_ANY_RX.test(val)) continue;
                var parent = textNode.parentElement;
                if (!parent || SKIP_TAGS[parent.tagName]) continue;
                if (parent.closest && (parent.closest("#ug-madmin-shell") || parent.closest("#ug-mtest-shell") || parent.closest("#ug-mintro-shell") || parent.closest("#ug-mgen-shell") || parent.closest('[data-ug-perm-hidden]'))) continue;
                var trimmed = cleanText(val);
                if (trimmed.length > 60) continue;

                var cleaned = val.replace(HINDI_MENU_STRIP_RX, "").replace(/\s{2,}/g, " ");
                if (cleaned.trim() === "") cleaned = "";
                if (cleaned !== val) {
                    textNode.nodeValue = cleaned;
                }
            }
        } catch (e) {}

        /* Pass 3: Clean tooltips, aria-labels, and data-label attributes */
        var attrEls = container.querySelectorAll("[title], [aria-label], [data-label], [data-tooltip]");
        var attrNames = ["title", "aria-label", "data-label", "data-tooltip"];
        for (var t = 0; t < attrEls.length; t++) {
            var tel = attrEls[t];
            if (tel.closest && (tel.closest("#ug-madmin-shell") || tel.closest("#ug-mtest-shell") || tel.closest("#ug-mintro-shell") || tel.closest("#ug-mgen-shell"))) continue;
            for (var a = 0; a < attrNames.length; a++) {
                var an = attrNames[a];
                var av = tel.getAttribute(an) || "";
                if (!av) continue;
                if (HINDI_MENU_ANY_RX.test(av) || RRB_SIM_RX.test(av)) {
                    var nextAv = av
                        .replace(RRB_SIM_GLOBAL_RX, "")
                        .replace(HINDI_MENU_STRIP_RX, "")
                        .replace(/\s+/g, " ")
                        .trim();
                    if (nextAv) tel.setAttribute(an, nextAv);
                    else tel.removeAttribute(an);
                }
            }
        }
    }

    function runPermanentCleanup() {
        if (isCleaning) return;
        isCleaning = true;
        try {
            cleanDocumentTitle();
            cleanInjectedStylesheets();
            if (document.body) {
                removeRrbAlpSimulator(document.body);
                removeHindiMenuLabels(document.body);
            }
        } catch (e) {
        } finally {
            isCleaning = false;
        }
    }

    function schedulePermanentCleanup() {
        if (rafPending) return;
        rafPending = true;
        var exec = function () {
            rafPending = false;
            runPermanentCleanup();
        };
        if (typeof window.requestAnimationFrame === "function") {
            window.requestAnimationFrame(exec);
        } else {
            setTimeout(exec, 16);
        }
    }

    function startPermanentCleaner() {
        runPermanentCleanup();
        try {
            var docObs = new MutationObserver(function () {
                if (!isCleaning) schedulePermanentCleanup();
            });
            docObs.observe(document.documentElement, {
                childList: true,
                subtree: true,
                characterData: true
            });
        } catch (e) {}

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", runPermanentCleanup);
        }
        window.addEventListener("load", runPermanentCleanup);
        setInterval(runPermanentCleanup, 700);
    }

    startPermanentCleaner();
})();
</script>

<!-- =========================================================================

    function readPref(key, fallback) {
        try {
            var v = localStorage.getItem(PREF_PREFIX + key);
            return v !== null ? v : fallback;
        } catch (e) {
            return fallback;
        }
    }

    function writePref(key, val) {
        try {
            localStorage.setItem(PREF_PREFIX + key, String(val));

    }

    function escapeHtml(str) {
        return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function hapticTap() {

            if (navigator.vibrate) navigator.vibrate(8);

    function stripEmojis(str) {
        return String(str || "")
            .replace(/[\u2600-\u27BF\uFE0F\u200D]|[\uD83C-\uDBFF][\uDC00-\uDFFF]/g, " ")
            .replace(/\s+/g, " ")

    function isStrictlyMobileMode() {
        try {
            var attr = document.documentElement.getAttribute("data-ug-mode");
            if (attr === "desktop") return false;
            if (attr === "mobile") return true;
            if (window.__UG_DISPLAY_MODE__ === "desktop") return false;
            if (window.__UG_DISPLAY_MODE__ === "mobile") return true;
            var w = window.innerWidth || document.documentElement.clientWidth || 1024;
            return w <= 768;
        } catch (e) {
            return false;
        }
    }

    function isInsideAppShell(el) {
        if (!el || el.nodeType !== 1) return false;
        return !!(el.id === "ug-madmin-shell" || el.id === "ug-madmin-restore-pill" ||
            el.id === "ug-mtest-shell" || el.id === "ug-mintro-shell" || el.id === "ug-mgen-shell" || el.id === "ug-mtest-restore-pill" ||
            (el.closest && (el.closest("#ug-madmin-shell") || el.closest("#ug-madmin-restore-pill") ||
                el.closest("#ug-mtest-shell") || el.closest("#ug-mintro-shell") || el.closest("#ug-mgen-shell") || el.closest("#ug-mtest-restore-pill"))));
    }

    function isElementVisible(el) {
        if (!el || el.nodeType !== 1) return false;
        if (isInsideAppShell(el)) return false;
        if (el.getAttribute("data-ug-admin-hidden") || el.getAttribute("data-ug-perm-hidden")) return false;
        try {
            var st = window.getComputedStyle(el);
            if (!st || st.display === "none" || st.visibility === "hidden" || parseFloat(st.opacity) === 0) return false;
            var rect = el.getBoundingClientRect();
            return rect.width > 0 && rect.height > 0;
        } catch (e) {
            return false;
        }
    }

    function cleanLabel(str) {

    function findRealLogoutButton(container) {

        for (var i = 0; i < btns.length; i++) {
            var el = btns[i];

            var t = cleanLabel(el.innerText || el.textContent || el.getAttribute("aria-label") || el.getAttribute("title") || "").toLowerCase();

            if (/^(logout|log\s*out|sign\s*out|लॉगआउट|लॉग\s*आउट|exit\s*admin|admin\s*logout)$/i.test(t) ||

    function isLoginGateVisible(container, hasAdminPanelSignals) {
        if (!container) return true;
        var pwdInputs = container.querySelectorAll('input[type="password"]');
        var visiblePwd = null;
        for (var i = 0; i < pwdInputs.length; i++) {
            if (isElementVisible(pwdInputs[i])) {
                visiblePwd = pwdInputs[i];
                break;
            }
        }
        if (!visiblePwd) return false;

        var formWrap = visiblePwd.closest("form, [role='dialog'], section, main, div");
        var formTxt = cleanLabel(formWrap ? formWrap.innerText : "").toLowerCase();
        var hasLoginWord = /(admin\s*login|student\s*login|user\s*login|sign\s*in|log\s*in|लॉगिन|लॉग इन|पासवर्ड दर्ज|enter\s*password)/i.test(formTxt);
        var hasAdminCreateUserWord = /(create\s*sub|add\s*admin|grant\s*admin|new\s*student|add\s*user|change\s*password|update\s*password|reset\s*password|old\s*password|current\s*password|new\s*password|confirm\s*password|account\s*settings|admin\s*settings|profile\s*settings|security\s*settings|नया\s*एडमिन|पासवर्ड\s*बदलें|पासवर्ड\s*अपडेट|पुराना\s*पासवर्ड|नया\s*पासवर्ड|सेटिंग्स)/i.test(formTxt);

        if (hasAdminCreateUserWord) return false;
        if (!hasLoginWord) return false;

        /* If full-screen login overlay covers viewport, it is definitely the Login Gate */
        var overlay = visiblePwd.closest('[class*="fixed"], [style*="position: fixed"], [style*="position:fixed"]');
        if (overlay && isElementVisible(overlay)) {

    function isLiveExamTakingScreen(container) {
        if (document.documentElement.getAttribute("data-ug-modern-test") === "true" ||
            document.documentElement.getAttribute("data-ug-modern-intro") === "true") return true;
        if (!container) return false;
        var txt = cleanLabel(container.innerText || "").slice(0, 7000).toLowerCase();
        if (/(general\s*instructions|test\s*instructions|exam\s*instructions|i\s*am\s*ready\s*to\s*begin|i\s*have\s*read\s*and\s*understood|agree\s*(?:&|and)\s*continue|सामान्य\s*निर्देश|परीक्षा\s*निर्देश|महत्वपूर्ण\s*निर्देश|मैंने\s*सभी\s*निर्देश)/i.test(txt)) {
            return true;
        }
        var examSignals = 0;
        if (/(save\s*&\s*next|save\s*and\s*next|सेव\s*और\s*नेक्स्ट)/i.test(txt)) examSignals++;
        if (/(mark\s*for\s*review|रिव्यू\s*के\s*लिए)/i.test(txt)) examSignals++;
        if (/(submit\s*test|submit\s*exam|टेस्ट\s*सबमिट|फाइनल\s*सबमिट)/i.test(txt)) examSignals++;
        if (/(clear\s*response|उत्तर\s*हटाएं|question\s*palette)/i.test(txt)) examSignals++;

    function safeReadFlag(obj, key) {
        if (!obj || !(key in obj)) return false;
        try {
            var v = obj[key];
            if (typeof v === "function") return !!v.call(obj);
            return !!v;
        } catch (e) {

        }

    /* Evaluates whether an Admin ID is currently logged in (Mobile OR Desktop).
       Scans full document.body (including patches) and returns isAdmin: false
       for Student IDs, Login Screen, or Guests. */
    function evaluateAdminSession() {
        var result = {
            isAdmin: false,
            roleLabel: "Admin",
            identity: "Verified Admin ID",
            score: 0,
            logoutEl: null
        };

        /* Fail closed: Admin Studio is enabled ONLY by the live app RBAC object.
           Visible labels, page sections, local/session storage hints, and old
           confirmed-session timestamps are never accepted as admin proof. */
        if (isCloudLoaderVisible()) {
            state.lastConfirmedAdminTs = 0;
            return result;
        }

        var container = document.body || document.getElementById("root");
        if (!container || isLiveExamTakingScreen(container)) {
            state.lastConfirmedAdminTs = 0;
            return result;
        }

        try {
            var rbac = window.__UG_ADMIN_RBAC__;
            if (!rbac || typeof rbac !== "object") {
                state.lastConfirmedAdminTs = 0;
                return result;
            }

            var role = "";
            try {
                role = String(
                    (typeof rbac.getRole === "function" ? rbac.getRole() : "") ||
                    rbac.role || rbac.currentRole || rbac.activeRole || rbac.userRole || ""
                ).trim().toLowerCase().replace(/[\s-]+/g, "_");
            } catch (roleError) {}

            var isMasterAdmin = safeReadFlag(rbac, "isMasterAdmin") ||
                safeReadFlag(rbac, "masterAdmin") ||
                safeReadFlag(rbac, "isMaster") ||
                /^(master_admin|super_admin|owner)$/.test(role);
            var isAdmin = isMasterAdmin || safeReadFlag(rbac, "isAdmin") ||
                /^(admin|administrator)$/.test(role);

            /* Explicit student/user/guest roles always deny access, even if
               stale admin hints or a previous session existed in the page. */
            var isStudentOrGuest = /^(student|user|guest|none|anonymous)$/.test(role);
            if (!isAdmin || isStudentOrGuest) {
                state.lastConfirmedAdminTs = 0;
                return result;
            }

            result.isAdmin = true;
            result.roleLabel = isMasterAdmin ? "Master Admin" : "Admin";
            result.identity = String(rbac.email || rbac.adminEmail || rbac.userName || "Verified Admin ID");
            result.logoutEl = findRealLogoutButton(container);
            result.score = 10;
            state.lastConfirmedAdminTs = Date.now();
        } catch (e) {
            state.lastConfirmedAdminTs = 0;
            result.isAdmin = false;
        }

        return result;
    }

    var TOOL_TEXT_RX = /(?:\b(?:all\s+|smart\s+|study\s+|student\s+|exam\s+|pdf\s+|ai\s+|useful\s+|quick\s+|math\s+|extra\s+|free\s+|pro\s+|my\s+|admin\s+)?tools?\b|\btool\s*box\b|\btoolbox\b|\btool\s*kit\b|\btoolkit\b|\btool\s*features?\b|\btools?\s*(?:&|and|\/|\+)\s*(?:utilities?|features?|pdf|calc)|\b(?:scientific\s+|age\s+|percentage\s+)?calculator\b|\bunit\s*converter\b|\brough\s*pad\b|\bscratch\s*pad\b|\bformula\s*sheet\b|\bpomodoro\b|टूल(?:्स|बॉक्स|किट|\s*फीचर्स?)?|कैलकुलेटर|रफ\s*पैड)/i;
    var TOOL_ATTR_RX = /(?:^|[\s\-_:])(?:tools?|toolbox|toolkit|study-?tools?|student-?tools?|exam-?tools?|pdf-?tools?|admin-?tools?|calculator|rough-?pad)(?:$|[\s\-_:])/i;

    var PWD_EXACT_LABEL_RX = /^(?:password|passwords|passcode|admin\s*password|master\s*password|login\s*password|change\s*password|update\s*password|reset\s*password|set\s*password|password\s*settings?|password\s*security|security\s*(?:&|and|\/)\s*password|पासवर्ड|पासवर्ड\s*बदलें|पासवर्ड\s*अपडेट|पासवर्ड\s*सेटिंग्स?|एडमिन\s*पासवर्ड)$/i;
    var PWD_ATTR_RX = /(?:change[-_]?pass|update[-_]?pass|reset[-_]?pass|old[-_]?pass|current[-_]?pass|new[-_]?pass|confirm[-_]?pass|admin[-_]?pass|master[-_]?pass|pass(?:word|code)?[-_]?(?:section|setting|card|box|panel|tab|form|change|update|reset|pin|block|wrap|row))/i;
    var SETTINGS_CONTEXT_RX = /(?:\b(?:settings?|preferences|account\s*settings?|profile\s*settings?|admin\s*settings?|general\s*settings?|security\s*settings?|my\s*profile|my\s*account|profile\s*&\s*security)\b|सेटिंग्स?|सेटिंग|प्रोफ़ाइल|प्रोफाइल|सुरक्षा\s*सेटिंग)/i;
    var CREATE_USER_FORM_RX = /(?:create\s*(?:new\s*)?(?:student|user|sub[\s-]*admin|account|member)|add\s*(?:new\s*)?(?:student|user|sub[\s-]*admin|member)|register\s*(?:student|user)|grant\s*admin|new\s*student|student\s*name|roll\s*no|नया\s*(?:छात्र|यूजर|स्टूडेंट)|छात्र\s*जोड़ें)/i;
    var LOGIN_GATE_SAFETY_RX = /(?:admin\s*login|student\s*login|user\s*login|sign\s*in\s*to|log\s*in\s*to|forgot\s*password|एडमिन\s*लॉगिन|छात्र\s*लॉगिन)/i;
    var UNRELATED_SETTINGS_RX = /(?:razorpay|payment\s*gateway|website\s*title|site\s*name|app\s*name|logo\s*upload|theme\s*color|exam\s*settings|test\s*settings|maintenance\s*mode|cloud\s*sync|whatsapp|telegram|support\s*email|contact\s*number|all\s*users|student\s*list|question\s*bank)/i;

    function isToolText(rawText) {
        var cleaned = stripEmojis(cleanLabel(rawText));
        if (!cleaned || cleaned.length > 75) return false;
        return TOOL_TEXT_RX.test(cleaned);
    }

    function isPasswordSettingsText(rawText) {
        var cleaned = stripEmojis(cleanLabel(rawText));
        if (!cleaned || cleaned.length > 95) return false;
        if (LOGIN_GATE_SAFETY_RX.test(cleaned)) return false;
        return PWD_CHANGE_TEXT_RX.test(cleaned);
    }

    function isInSettingsContext() {
        try {
            var locSig = String(window.location.hash || "") + " " + String(window.location.pathname || "") + " " + String(window.location.search || "");
            if (SETTINGS_CONTEXT_RX.test(locSig)) return true;

            var root = document.getElementById("root") || document.body;
            if (!root) return false;

            /* Check visible headings and active tabs (including Tailwind active tab styles) */
            var nodes = root.querySelectorAll("h1, h2, h3, h4, h5, [aria-selected='true'], [aria-current='page'], .active, button, [role='tab'], a");
            for (var i = 0; i < Math.min(nodes.length, 160); i++) {
                var el = nodes[i];
                if (!isElementVisible(el)) continue;
                var isHeading = /^H[1-5]$/.test(el.tagName);
                var isActiveTab = !isHeading && isLikelyActiveTab(el);
                if (!isHeading && !isActiveTab) continue;
                var t = stripEmojis(cleanLabel(el.textContent || ""));
                if (t && t.length <= 65 && SETTINGS_CONTEXT_RX.test(t)) return true;
            }
        } catch (e) {}
        return false;
    }

    function getInputAssociatedLabelText(inp) {
        if (!inp || inp.tagName !== "INPUT") return "";
        var parts = [];
        try {
            if (inp.id) {
                var escId = inp.id.replace(/["\\]/g, "\\$&");
                var lbl = document.querySelector('label[for="' + escId + '"]');
                if (lbl) parts.push(cleanLabel(lbl.textContent || ""));
            }
            var wrapLabel = inp.closest("label");
            if (wrapLabel) parts.push(cleanLabel(wrapLabel.textContent || ""));
            var prev = inp.previousElementSibling;
            if (prev && /^(LABEL|SPAN|P|DIV|STRONG|B)$/.test(prev.tagName)) {
                var pt = cleanLabel(prev.textContent || "");
                if (pt.length <= 65) parts.push(pt);
            }
            if (inp.parentElement) {
                var pPrev = inp.parentElement.previousElementSibling;
                if (pPrev && /^(LABEL|SPAN|P|DIV|STRONG|B|H[3-6])$/.test(pPrev.tagName)) {
                    var ppt = cleanLabel(pPrev.textContent || "");
                    if (ppt.length <= 65) parts.push(ppt);
                }
                var localLbl = inp.parentElement.querySelector("label");
                if (localLbl) parts.push(cleanLabel(localLbl.textContent || ""));
            }
        } catch (e) {}
        return stripEmojis(parts.join(" ").trim());
    }

    function isPasswordInputElement(inp) {
        if (!inp || inp.tagName !== "INPUT") return false;
        var t = String(inp.getAttribute("type") || "").toLowerCase();
        if (t === "password") return true;
        var sig = String(inp.name || "") + " " + String(inp.id || "") + " " +
            String(inp.getAttribute("placeholder") || "") + " " +
            String(inp.getAttribute("aria-label") || "") + " " +
            String(inp.getAttribute("autocomplete") || "");
        if (/(?:pass(?:word|code)?|pwd|पासवर्ड)/i.test(sig)) return true;

        /* Catch eye-toggled or plain-text password fields using their label text */
        if (t === "" || t === "text") {
            var lblTxt = getInputAssociatedLabelText(inp);
            if (lblTxt && (PWD_CHANGE_TEXT_RX.test(lblTxt) || PWD_EXACT_LABEL_RX.test(lblTxt) || /(?:password|passcode|पासवर्ड)/i.test(lblTxt))) {
                return true;
            }
        }
        return false;
    }

    function isReadonlyIdentifierInput(inp) {
        if (!inp || inp.tagName !== "INPUT") return false;
        if (!inp.readOnly && !inp.disabled) return false;
        var sig = (String(inp.type || "") + " " + String(inp.name || "") + " " + String(inp.id || "") + " " + String(inp.getAttribute("placeholder") || "")).toLowerCase();
        return /(email|user|admin|login|id)/.test(sig);
    }

    function hasUnrelatedFormControls(containerEl) {
        var fields = containerEl.querySelectorAll("input, select, textarea");
        for (var i = 0; i < fields.length; i++) {
            var f = fields[i];
            if (f.tagName === "SELECT" || f.tagName === "TEXTAREA") return true;
            var ft = String(f.getAttribute("type") || "text").toLowerCase();
            if (ft === "hidden" || ft === "submit" || ft === "button" || ft === "reset" || ft === "checkbox") continue;
            if (isPasswordInputElement(f) || isReadonlyIdentifierInput(f)) continue;
            return true;
        }
        return false;
    }

    function findTightestPasswordContainer(startEl, explicitChangeMatch) {
        if (!startEl || startEl.nodeType !== 1 || isInsideAppShell(startEl)) return null;
        if (startEl === document.body || startEl.id === "root") return null;

        /* Safety Check: never hide a Login Gate or a Create Student/User form */
        var nearForm = startEl.closest("form, [role='dialog']");
        if (nearForm) {
            var nfTxt = cleanLabel(nearForm.textContent || "");
            if (LOGIN_GATE_SAFETY_RX.test(nfTxt) && !PWD_CHANGE_TEXT_RX.test(nfTxt)) return null;
            if (!explicitChangeMatch && CREATE_USER_FORM_RX.test(nfTxt)) return null;
        }

        var best = startEl;
        var cur = startEl.parentElement;
        var depth = 0;
        while (cur && depth < 8) {
            depth++;
            if (cur === document.body || cur === document.documentElement || cur.id === "root") break;
            if (cur.tagName === "MAIN" || cur.tagName === "HEADER" || cur.tagName === "NAV" || isInsideAppShell(cur)) break;
            if (cur.querySelector("table")) break;

            var curTxt = cleanLabel(cur.textContent || "");
            if (curTxt.length > 1050) break;
            if (LOGIN_GATE_SAFETY_RX.test(curTxt) && !PWD_CHANGE_TEXT_RX.test(curTxt)) return null;
            if (UNRELATED_SETTINGS_RX.test(curTxt) || PROTECTED_ADMIN_CONTAINER_RX.test(curTxt)) break;
            if (!explicitChangeMatch && CREATE_USER_FORM_RX.test(curTxt)) return null;
            if (hasUnrelatedFormControls(cur)) break;

            var r = cur.getBoundingClientRect();
            if (r.height > window.innerHeight * 0.80 && r.width > window.innerWidth * 0.92 && cur.children.length > 4) break;

            best = cur;
            /* Stop cleanly once we reach an outer semantic card/section/fieldset/form boundary */
            if (cur.tagName === "SECTION" || cur.tagName === "ARTICLE" || cur.tagName === "FIELDSET" || cur.tagName === "FORM") break;
            cur = cur.parentElement;
        }

        return best;
    }

    function hidePasswordSectionInAdmin() {

        /* 1. Explicit password-section / change-password containers by id, class, or data attributes */
        var explicitPwdEls = document.body.querySelectorAll(

            "[class*='change-password' i], [class*='update-password' i], [class*='reset-password' i], " +
            "[class*='password-section' i], [class*='password-setting' i], [class*='password-card' i], [class*='password-box' i]"
        );
        for (var e = 0; e < explicitPwdEls.length; e++) {

            if (isInsideAppShell(exEl)) continue;
            var exTxt = cleanLabel(exEl.textContent || "");
            if (!LOGIN_GATE_SAFETY_RX.test(exTxt) && !PROTECTED_ADMIN_CONTAINER_RX.test(exTxt) && !hasUnrelatedFormControls(exEl)) {
                markAdminHidden(exEl, "password-settings");
            }
        }

        /* 2. Buttons, tabs, links, and menu items for Change Password / Password Settings */
        var controls = document.body.querySelectorAll("button, a, [role='tab'], [role='button'], [role='menuitem'], summary, li");
        for (var c = 0; c < controls.length; c++) {
            var ctrl = controls[c];
            if (isInsideAppShell(ctrl) || ctrl === document.body || ctrl.id === "root") continue;
            var cTxt = stripEmojis(cleanLabel(ctrl.textContent || ""));
            var cAttr = cleanLabel((ctrl.getAttribute("aria-label") || "") + " " + (ctrl.getAttribute("title") || ""));
            var isChangeBtn = (cTxt && isPasswordSettingsText(cTxt)) || (cAttr && isPasswordSettingsText(cAttr));
            var isSettingsPwdTab = inSettings && cTxt && PWD_EXACT_LABEL_RX.test(cTxt);

            if ((isChangeBtn || isSettingsPwdTab) && cTxt.length <= 85 && !PROTECTED_ADMIN_CONTAINER_RX.test(cTxt)) {
                var btnForm = ctrl.closest("form");
                if (btnForm) {
                    var bfTxt = cleanLabel(btnForm.textContent || "");
                    if ((LOGIN_GATE_SAFETY_RX.test(bfTxt) && !isChangeBtn) || (!isChangeBtn && CREATE_USER_FORM_RX.test(bfTxt))) {
                        continue;
                    }
                }
                markAdminHidden(ctrl, "password-settings");
            }
        }

        /* 3. Password Change headings / legends / labels -> hide their tightest password section card/row */
        var headings = document.body.querySelectorAll("h1, h2, h3, h4, h5, h6, legend, label, p, span, div");
        for (var h = 0; h < headings.length; h++) {
            var hd = headings[h];
            if (isInsideAppShell(hd) || hd === document.body || hd.id === "root") continue;
            if (hd.getAttribute("data-ug-admin-hidden")) continue;
            if (hd.tagName === "DIV" && hd.children.length > 4) continue;

            var hTxt = stripEmojis(cleanLabel(hd.textContent || ""));
            if (!hTxt || hTxt.length > 90) continue;

            var explicitMatch = isPasswordSettingsText(hTxt);
            var exactSettingsMatch = inSettings && PWD_EXACT_LABEL_RX.test(hTxt);
            if (!explicitMatch && !exactSettingsMatch) continue;

            var cardTarget = findTightestPasswordContainer(hd, explicitMatch);
            if (cardTarget) {
                /* Hide wrapper if it holds password inputs/buttons or is a dedicated heading/label */
                if (explicitMatch || cardTarget.querySelector("input, button") || hd.tagName === "LABEL" || /^H[1-6]$/.test(hd.tagName)) {
                    markAdminHidden(cardTarget, "password-settings");
                }
            }
        }

        /* 4. Direct password inputs (including eye-toggled & label-matched text password fields) */
        var allInputs = document.body.querySelectorAll("input");
        for (var p = 0; p < allInputs.length; p++) {
            var inp = allInputs[p];
            if (isInsideAppShell(inp) || inp.getAttribute("data-ug-admin-hidden")) continue;
            if (!isPasswordInputElement(inp)) continue;

            var inpSig = String(inp.name || "") + " " + String(inp.id || "") + " " +
                String(inp.getAttribute("placeholder") || "") + " " +
                String(inp.getAttribute("aria-label") || "");
            var assocLabel = getInputAssociatedLabelText(inp);
            var parentTxt = stripEmojis(cleanLabel((inp.parentElement && inp.parentElement.textContent) || ""));
            var isExplicitPwdChange = PWD_ATTR_RX.test(inpSig) || isPasswordSettingsText(inpSig) || isPasswordSettingsText(assocLabel) || isPasswordSettingsText(parentTxt);

            if (!isExplicitPwdChange && !inSettings) continue;

            var pwdTarget = findTightestPasswordContainer(inp, isExplicitPwdChange);
            if (pwdTarget) {
                markAdminHidden(pwdTarget, "password-settings");
            } else {
                /* Fallback: if inside a mixed general-settings form, hide only the password input & its immediate label wrapper */
                var safeForm = inp.closest("form");
                var safeFormTxt = safeForm ? cleanLabel(safeForm.textContent || "") : "";
                if (!LOGIN_GATE_SAFETY_RX.test(safeFormTxt) && (isExplicitPwdChange || !CREATE_USER_FORM_RX.test(safeFormTxt))) {
                    markAdminHidden(inp, "password-settings");
                }
            }
        }
    }

    /* Capture-phase safeguard: prevents any Admin Settings password change click/submit
       Strictly inactive for Student IDs, Login Screen, and Create-User forms. */
    function installAdminPasswordGuard() {
        if (window.__UG_ADMIN_PWD_GUARD_INSTALLED__) return;
        window.__UG_ADMIN_PWD_GUARD_INSTALLED__ = true;

        document.addEventListener("submit", function (ev) {
            if (!state.adminSessionActive) return;
            var form = ev.target;
            if (!form || form.tagName !== "FORM" || isInsideAppShell(form)) return;
            var fTxt = cleanLabel(form.textContent || "");
            if (LOGIN_GATE_SAFETY_RX.test(fTxt) && !PWD_CHANGE_TEXT_RX.test(fTxt)) return;
            if (CREATE_USER_FORM_RX.test(fTxt) && !PWD_CHANGE_TEXT_RX.test(fTxt)) return;

            var hasPwdInput = false;
            var inputs = form.querySelectorAll("input");
            for (var i = 0; i < inputs.length; i++) {
                if (isPasswordInputElement(inputs[i])) { hasPwdInput = true; break; }
            }
            if (hasPwdInput && !hasUnrelatedFormControls(form) && (isPasswordSettingsText(fTxt) || isInSettingsContext())) {
                ev.preventDefault();
                ev.stopPropagation();
                if (typeof ev.stopImmediatePropagation === "function") ev.stopImmediatePropagation();
                markAdminHidden(form, "password-settings");
                if (state.active) showToast("Admin ID में पासवर्ड बदलने की अनुमति बंद है");
            }
        }, true);

        document.addEventListener("click", function (ev) {
            if (!state.adminSessionActive) return;
            var target = ev.target && ev.target.closest ? ev.target.closest("button, a, [role='tab'], [role='button'], [role='menuitem']") : null;
            if (!target || isInsideAppShell(target)) return;
            if (target.getAttribute("data-ug-admin-hidden") === "password-settings") {
                ev.preventDefault();
                ev.stopPropagation();
                if (typeof ev.stopImmediatePropagation === "function") ev.stopImmediatePropagation();
                return;
            }
            var tTxt = stripEmojis(cleanLabel(target.textContent || target.getAttribute("aria-label") || ""));
            if (!tTxt || tTxt.length > 85) return;
            if (isPasswordSettingsText(tTxt) || (isInSettingsContext() && PWD_EXACT_LABEL_RX.test(tTxt))) {
                var nearForm = target.closest("form");
                var nfTxt = nearForm ? cleanLabel(nearForm.textContent || "") : "";
                if (LOGIN_GATE_SAFETY_RX.test(nfTxt) && !isPasswordSettingsText(tTxt)) return;
                if (CREATE_USER_FORM_RX.test(nfTxt) && !isPasswordSettingsText(tTxt)) return;
                ev.preventDefault();
                ev.stopPropagation();
                if (typeof ev.stopImmediatePropagation === "function") ev.stopImmediatePropagation();
                markAdminHidden(target, "password-settings");
                if (state.active) showToast("Admin ID में पासवर्ड सेक्शन लॉक है");
            }
        }, true);
    }

    function setAdminRestrictionCssEnabled(enabled) {
        var st = document.getElementById("ug-admin-only-restrictions-css");
        if (st) st.disabled = !enabled;
    }

    function markAdminHidden(el, reason) {
        if (!el || el.nodeType !== 1) return;
        if (el === document.documentElement || el === document.body || el.id === "root") return;
        if (isInsideAppShell(el)) return;

        if (!el.hasAttribute("data-ug-admin-hidden")) {
            el.setAttribute("data-ug-admin-prev-style", el.getAttribute("style") || "");
        }
        el.setAttribute("data-ug-admin-hidden", reason);
        el.setAttribute("aria-hidden", "true");
        /* Force inline !important so even patch scripts using display:flex !important stay hidden */
        try {
            el.style.setProperty("display", "none", "important");
            el.style.setProperty("visibility", "hidden", "important");
            el.style.setProperty("opacity", "0", "important");
            el.style.setProperty("pointer-events", "none", "important");
        } catch (e) {}
    }

    function clearAllAdminHiddenMarkers() {
        try {
            document.querySelectorAll("[data-ug-admin-hidden]").forEach(function (el) {
                var prevStyle = el.getAttribute("data-ug-admin-prev-style");
                el.removeAttribute("data-ug-admin-hidden");
                el.removeAttribute("data-ug-admin-prev-style");
                if (el.getAttribute("aria-hidden") === "true" && !el.getAttribute("data-ug-perm-hidden")) {
                    el.removeAttribute("aria-hidden");
                }
                if (!el.getAttribute("data-ug-perm-hidden")) {
                    if (prevStyle) el.setAttribute("style", prevStyle);
                    else el.removeAttribute("style");
                }
            });
        } catch (e) {}
    }

    function isThreeLineSvg(svg) {
        if (!svg) return false;
        var lines = svg.querySelectorAll("line");
        if (lines.length === 3) return true;
        var rects = svg.querySelectorAll("rect");
        if (rects.length === 3) return true;
        var paths = svg.querySelectorAll("path");
        /* Lucide Menu, Heroicons Bars3, Feather Menu use 3 <path> elements */
        if (paths.length === 3) return true;
        /* Single <path> hamburger icons (Material/FontAwesome SVG) have 3 M/m subpaths */
        if (paths.length === 1 || paths.length === 2) {
            var combinedD = "";
            for (var i = 0; i < paths.length; i++) {
                combinedD += " " + String(paths[i].getAttribute("d") || "");
            }
            var mCount = (combinedD.match(/[Mm]\s*[\d.-]/g) || []).length;
            if (mCount === 3) return true;
        }
        return false;
    }

    function isThreeLineVisualButton(btn) {
        if (!btn || btn.nodeType !== 1) return false;
        if (btn === document.documentElement || btn === document.body || btn.id === "root" || isInsideAppShell(btn)) return false;

        var sig = (
            String(btn.id || "") + " " +
            String(btn.className || "") + " " +
            String(btn.getAttribute("aria-label") || "") + " " +
            String(btn.getAttribute("title") || "") + " " +
            String(btn.getAttribute("data-feature") || "") + " " +
            String(btn.getAttribute("data-action") || "")
        );
        if (HAMBURGER_ATTR_RX.test(sig)) return true;

        var rawTxt = cleanLabel(btn.textContent || "");
        if (rawTxt && rawTxt.length <= 24 && HAMBURGER_CHAR_RX.test(rawTxt)) return true;

        /* Material Icons / Symbols hamburger icon */
        if (/^menu$/i.test(rawTxt) && /material/i.test(sig)) return true;
        var matSpan = btn.querySelector("[class*='material']");
        if (matSpan && /^menu$/i.test(cleanLabel(matSpan.textContent || ""))) return true;

        /* FontAwesome 3-line icons inside button */
        if (btn.querySelector(".fa-bars, .fa-bars-staggered, .fa-navicon, .fa-reorder, [class*='fa-bars']")) return true;

        var rBtn = btn.getBoundingClientRect();
        var isCompactBtn = (rBtn.width > 0 && rBtn.width <= 130 && rBtn.height > 0 && rBtn.height <= 80);

        /* 3 horizontal CSS spans/divs/hrs (works even if button also had short text like "Menu") */
        if (isCompactBtn && rawTxt.length <= 16) {
            var lineKids = Array.from(btn.querySelectorAll("span, div, i, hr")).filter(function (k) {
                if (k.children.length > 0) return false;
                if (cleanLabel(k.textContent || "").length > 0) return false;
                var r = k.getBoundingClientRect();
                return r.width >= 8 && r.width <= 48 && r.height >= 1 && r.height <= 7 && r.width >= r.height * 1.8;
            });
            if (lineKids.length === 3) return true;

            /* Inline 3-line SVG icon inside compact toggle button */
            var svg = btn.querySelector("svg");
            if (svg && isThreeLineSvg(svg)) return true;
        }
        return false;
    }

    function hideThreeLinesInAdmin() {
        if (!document.body) return;

        /* 1. Direct ID/Class selectors for hamburger buttons & drawers anywhere in document.body */
        var direct3Lines = document.body.querySelectorAll(
            "#ug-hamburger-btn, #ug-modern-hamburger, #ug-modern-menu-btn, #ug-3line-btn, #ug-3line-menu, " +
            "#ug-hamburger-drawer, #ug-modern-menu-drawer, .ug-hamburger-btn, .ug-3line-btn, " +
            "[id*='hamburger' i], [class*='hamburger' i], [id*='3line' i], [class*='3line' i], " +
            "[id*='3-line' i], [class*='3-line' i], [id*='three-line' i], [class*='three-line' i]"
        );
        for (var d = 0; d < direct3Lines.length; d++) {
            markAdminHidden(direct3Lines[d], "three-lines");
        }

        /* 2. FontAwesome 3-line icons anywhere in DOM -> hide clickable wrapper or icon */
        var faBars = document.body.querySelectorAll(".fa-bars, .fa-bars-staggered, .fa-navicon, .fa-reorder, [class*='fa-bars']");
        for (var f = 0; f < faBars.length; f++) {
            var ic = faBars[f];
            if (isInsideAppShell(ic)) continue;
            var wrapper = ic.closest("button, a, [role='button'], [onclick]") || ic;
            markAdminHidden(wrapper, "three-lines");
        }

        /* 3. ALL buttons / clickable toggles (NO truncation limit!) */
        var btns = document.body.querySelectorAll("button, a, [role='button'], [onclick], label");
        for (var b = 0; b < btns.length; b++) {
            var btn = btns[b];
            if (isInsideAppShell(btn)) continue;
            if (isThreeLineVisualButton(btn)) {
                markAdminHidden(btn, "three-lines");
            }
        }

        /* 4. Standalone SVGs or clickable divs that draw 3 lines (e.g. React div onClick) */
        var svgs = document.body.querySelectorAll("svg");
        for (var s = 0; s < svgs.length; s++) {
            var svg = svgs[s];
            if (isInsideAppShell(svg)) continue;
            if (isThreeLineSvg(svg)) {
                var svgWrap = svg.closest("button, a, [role='button'], [onclick]") || svg.parentElement;
                if (svgWrap && svgWrap !== document.body && svgWrap.id !== "root") {
                    var sr = svgWrap.getBoundingClientRect();
                    if (sr.width <= 120 && sr.height <= 80 && !PROTECTED_ADMIN_CONTAINER_RX.test(cleanLabel(svgWrap.textContent || ""))) {
                        markAdminHidden(svgWrap, "three-lines");
                    } else {
                        markAdminHidden(svg, "three-lines");
                    }
                } else {
                    markAdminHidden(svg, "three-lines");
                }
            }
        }

        /* 5. Any text node containing literal ☰ or ≡ */
        try {
            var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
            var tn;
            while ((tn = walker.nextNode())) {
                var tv = tn.nodeValue || "";
                if (!tv || !HAMBURGER_CHAR_RX.test(tv)) continue;
                var par = tn.parentElement;
                if (!par || isInsideAppShell(par)) continue;
                var target = par.closest("button, a, [role='button'], [onclick]") || par;
                if (target && target !== document.body && target.id !== "root" && cleanLabel(target.textContent || "").length <= 28) {
                    markAdminHidden(target, "three-lines");
                }
            }
        } catch (e) {}
    }

    function hideToolElementOrCard(node) {
        if (!node || isInsideAppShell(node) || node === document.body || node.id === "root") return;

        /* Direct clickable button / tab / link / menuitem */
        var interactive = node.closest("button, a, [role='tab'], [role='button'], [role='menuitem'], summary");
        if (interactive && !isInsideAppShell(interactive) && interactive !== document.body && interactive.id !== "root") {
            var itxt = cleanLabel(interactive.textContent || "");
            if (itxt.length <= 90 && !PROTECTED_ADMIN_CONTAINER_RX.test(itxt)) {
                markAdminHidden(interactive, "tool-feature");
                return;
            }
        }

        /* Bounded Tool card / widget / list item / sidebar group */
        var cardWrap = node.closest("li, article, section, [class*='card' i], [class*='widget' i], [class*='tool' i], [id*='tool' i], [class*='rounded-xl'], [class*='rounded-2xl']");
        if (cardWrap && !isInsideAppShell(cardWrap) && cardWrap !== document.body && cardWrap.id !== "root") {
            var cRect = cardWrap.getBoundingClientRect();
            var cTxt = cleanLabel(cardWrap.textContent || "");
            var isBounded = (cRect.width === 0 && cRect.height === 0) || (cRect.height <= window.innerHeight * 0.68 && cRect.width <= window.innerWidth * 0.96);
            if (isBounded && !PROTECTED_ADMIN_CONTAINER_RX.test(cTxt) && !cardWrap.querySelector("table, form")) {
                markAdminHidden(cardWrap, "tool-feature");
                return;
            }
        }

        /* Leaf element fallback */
        if (!node.querySelector("table, form, nav") && !PROTECTED_ADMIN_CONTAINER_RX.test(cleanLabel(node.textContent || ""))) {
            markAdminHidden(node, "tool-feature");
        }
    }

    function hideToolFeaturesInAdmin() {
        if (!document.body) return;

        /* 1. Explicit tool containers / widgets / drawers / attributes */
        var explicitTools = document.body.querySelectorAll(
            "[data-feature*='tool' i], [data-tab*='tool' i], [data-section*='tool' i], " +
            "[id*='tool' i], [class*='tools-widget' i], [class*='tool-card' i], [class*='tool-box' i], " +
            "[class*='toolbox' i], [class*='floating-tool' i], [id*='calculator' i], [class*='calculator' i]"
        );
        for (var e = 0; e < explicitTools.length; e++) {
            var el = explicitTools[e];
            if (isInsideAppShell(el)) continue;
            var fullTxt = cleanLabel(el.textContent || "");
            if (!PROTECTED_ADMIN_CONTAINER_RX.test(fullTxt) && !el.querySelector("table")) {
                markAdminHidden(el, "tool-feature");
            }
        }

        /* 2. Tool-specific FontAwesome icons */
        var toolIcons = document.body.querySelectorAll(".fa-toolbox, .fa-screwdriver-wrench, .fa-wrench, .fa-tools, .fa-calculator, .fa-compass-drafting");
        for (var ti = 0; ti < toolIcons.length; ti++) {
            var iconEl = toolIcons[ti];
            if (isInsideAppShell(iconEl)) continue;
            var btnWrap = iconEl.closest("button, a, [role='tab'], [role='button'], [role='menuitem'], li") || iconEl;
            if (!PROTECTED_ADMIN_CONTAINER_RX.test(cleanLabel(btnWrap.textContent || ""))) {
                markAdminHidden(btnWrap, "tool-feature");
            }
        }

        /* 3. ALL buttons, tabs, links, headings, list items (NO 480-node cap!) */
        var focusedNodes = document.body.querySelectorAll("button, a, [role='tab'], [role='button'], [role='menuitem'], summary, h1, h2, h3, h4, h5, h6, li");
        for (var i = 0; i < focusedNodes.length; i++) {
            var node = focusedNodes[i];
            if (isInsideAppShell(node)) continue;
            if (node.id === "root" || node === document.body) continue;

            var ariaOrTitle = cleanLabel((node.getAttribute("aria-label") || "") + " " + (node.getAttribute("title") || ""));
            var sig = (String(node.id || "") + " " + String(node.className || ""));
            var txt = cleanLabel(node.textContent || "");

            if ((txt && isToolText(txt)) ||
                (ariaOrTitle && isToolText(ariaOrTitle)) ||
                (TOOL_ATTR_RX.test(sig) && txt.length <= 140 && !PROTECTED_ADMIN_CONTAINER_RX.test(txt))) {
                hideToolElementOrCard(node);
            }
        }

        /* 4. TreeWalker sweep for clickable <div>/<span> Tool items without semantic tags */
        try {
            var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
            var tn;
            while ((tn = walker.nextNode())) {
                var raw = tn.nodeValue || "";
                if (!raw || raw.length > 90) continue;
                if (!isToolText(raw)) continue;
                var par = tn.parentElement;
                if (!par || isInsideAppShell(par)) continue;
                if (par.tagName === "SCRIPT" || par.tagName === "STYLE" || par.tagName === "TEXTAREA" || par.tagName === "OPTION") continue;
                hideToolElementOrCard(par);
            }
        } catch (e) {}
    }

    function applyAdminHidesSafely() {
        if (state.isApplyingRestrictions || !state.adminSessionActive) return;
        state.isApplyingRestrictions = true;
        try {
            hideThreeLinesInAdmin();
            hideToolFeaturesInAdmin();
            hidePasswordSectionInAdmin();
        } catch (e) {
        } finally {
            state.isApplyingRestrictions = false;
        }
    }

    function syncAdminOnlyRestrictions(isAdmin) {
        state.adminSessionActive = !!isAdmin;
        if (isAdmin) {
            setAdminRestrictionCssEnabled(true);
            document.documentElement.setAttribute("data-ug-admin-session", "true");
            if (document.body) document.body.setAttribute("data-ug-admin-session", "true");
            applyAdminHidesSafely();
        } else {
            setAdminRestrictionCssEnabled(false);
            document.documentElement.removeAttribute("data-ug-admin-session");
            if (document.body) document.body.removeAttribute("data-ug-admin-session");
            state.isApplyingRestrictions = true;
            try { clearAllAdminHiddenMarkers(); } finally { state.isApplyingRestrictions = false; }
        }
    }

          Discovers real Tabs, Quick Actions, Sections, and KPIs

    function pickSmartIcon(label) {
        var l = String(label || "").toLowerCase();
        if (/(dashboard|overview|home|डैशबोर्ड|होम)/i.test(l)) return "fa-gauge-high";
        if (/(add|create|new|\+|जोड़ें|बनाएं|नया)/i.test(l)) return "fa-circle-plus";
        if (/(question|mcq|bank|प्रश्न|क्वेश्चन)/i.test(l)) return "fa-circle-question";
        if (/(test|exam|quiz|mock|टेस्ट|परीक्षा)/i.test(l)) return "fa-file-signature";
        if (/(user|student|member|छात्र|यूजर)/i.test(l)) return "fa-users";
        if (/(admin|role|permission|access|rbac|एडमिन|परमिशन)/i.test(l)) return "fa-user-shield";
        if (/(result|score|rank|leader|analytic|report|रिजल्ट|रैंक)/i.test(l)) return "fa-chart-line";
        if (/(pay|fee|plan|subscr|price|money|order|पेमेंट|प्लान)/i.test(l)) return "fa-indian-rupee-sign";
        if (/(upload|import|cloud|sync|backup|अपलोड|क्लाउड)/i.test(l)) return "fa-cloud-arrow-up";
        if (/(export|download|pdf|csv|json|डाउनलोड)/i.test(l)) return "fa-file-export";
        if (/(batch|course|folder|subject|category|बैच|कोर्स|विषय)/i.test(l)) return "fa-layer-group";
        if (/(notice|banner|alert|broadcast|message|नोटिस|बैनर)/i.test(l)) return "fa-bullhorn";
        if (/(setting|config|theme|security|सेटिंग)/i.test(l)) return "fa-sliders";
        if (/(delete|remove|trash|हटाएं)/i.test(l)) return "fa-trash-can";
        if (/(edit|update|modify|एडिट)/i.test(l)) return "fa-pen-to-square";
        return "fa-bolt";
    }

    function categorizeItem(label) {
        var l = String(label || "").toLowerCase();
        if (/(test|exam|quiz|question|mcq|batch|course|subject|category|upload|import|टेस्ट|प्रश्न|बैच|कोर्स)/i.test(l)) return "Content & Tests";
        if (/(user|student|admin|role|permission|access|grant|member|छात्र|यूजर|एडमिन)/i.test(l)) return "Users & Access";
        if (/(result|score|rank|pay|fee|plan|revenue|analytic|report|order|approve|रिजल्ट|पेमेंट)/i.test(l)) return "Results & Finance";
        return "Workspace & Settings";
    }

    function isLikelyActiveTab(el) {
        try {
            if (el.getAttribute("aria-selected") === "true" || el.getAttribute("aria-current") === "page") return true;
            var cls = String(el.className || "").toLowerCase();
            if (/\b(active|selected|bg-indigo-600|bg-blue-600|bg-violet-600|bg-sky-600|bg-slate-900|border-b-2)\b/.test(cls)) return true;
        } catch (e) {}
        return false;
    }

    function scanLiveAdminWorkspace() {
        var root = document.getElementById("root") || document.body;
        if (!root) return;

        var tabs = [];
        var actions = [];
        var sections = [];
        var kpis = [];
        var seenTabNames = {};
        var seenActionNames = {};
        var seenSectionNames = {};

        var fixedCandidates = root.querySelectorAll("header, nav, [class*='fixed'], [class*='sticky']");
        for (var f = 0; f < Math.min(fixedCandidates.length, 40); f++) {
            var fel = fixedCandidates[f];
            if (!isElementVisible(fel)) continue;
            try {
                var fst = window.getComputedStyle(fel);
                if (fst.position === "fixed") {
                    var fRect = fel.getBoundingClientRect();
                    if (fRect.top <= 12 && fRect.height <= 92 && fRect.width >= window.innerWidth * 0.7) {
                        fel.setAttribute("data-ug-madmin-shifted", "top");
                    }
                }
            } catch (e) {}
        }

        var controls = root.querySelectorAll("button, [role='tab'], [role='button'], nav a, header a");
        var maxControls = Math.min(controls.length, 320);
        var activeTabDetected = "";

        for (var i = 0; i < maxControls; i++) {
            var el = controls[i];
            if (!isElementVisible(el)) continue;
            if (el.closest && el.closest("[data-ug-admin-hidden]")) continue;

            var label = cleanLabel(el.innerText || el.getAttribute("aria-label") || el.getAttribute("title") || "");
            if (!label || label.length < 2 || label.length > 46) continue;
            if (/^[\d\s.,/+\-×✕<>←→•]+$/.test(label)) continue;
            if (/(logout|log\s*out|sign\s*out|लॉगआउट)/i.test(label)) continue;
            if (/(?:rrb[\s\-–—_/|:•]*alp.{0,45}?(?:pdf|simulator)|alp.{0,30}?pdf.{0,20}?simulator|\bpdf[\s\-–—_/|:•]*simulator\b)/i.test(label)) continue;
            if (/(?:म[ेै]न(?:्य)?[ुू][ँं]?)/u.test(label)) continue;
            if (isToolText(label)) continue;
            if (isPasswordSettingsText(label) || PWD_EXACT_LABEL_RX.test(stripEmojis(label))) continue;

            var key = label.toLowerCase();
            var inNav = !!(el.closest("nav, header, [role='tablist']") || el.getAttribute("role") === "tab");
            var isCreateAction = /(^add\b|^create\b|^new\b|^upload\b|^import\b|^export\b|^publish\b|^broadcast\b|^send\b|जोड़ें|बनाएं|नया|अपलोड)/i.test(label);
            var isTabLike = inNav || /(dashboard|overview|tests|questions|users|students|results|payments|settings|batches|courses|admins|notices|reports|analytics|bank|डैशबोर्ड|टेस्ट|प्रश्न|छात्र|रिजल्ट|पेमेंट|सेटिंग|बैच)/i.test(label);

            if (isTabLike && !isCreateAction && !seenTabNames[key] && tabs.length < 18) {
                seenTabNames[key] = true;
                var isAct = isLikelyActiveTab(el);
                if (isAct && !activeTabDetected) activeTabDetected = label;
                tabs.push({
                    label: label,
                    icon: pickSmartIcon(label),
                    category: categorizeItem(label),
                    active: isAct,
                    el: el
                });
            }

            if (!seenActionNames[key] && actions.length < 40) {
                seenActionNames[key] = true;
                actions.push({
                    label: label,
                    icon: pickSmartIcon(label),
                    category: categorizeItem(label),
                    isPrimaryCreate: isCreateAction,
                    el: el
                });
            }
        }

        var headings = root.querySelectorAll("h1, h2, h3");
        for (var h = 0; h < Math.min(headings.length, 60); h++) {
            var hel = headings[h];
            if (!isElementVisible(hel)) continue;
            if (hel.closest && hel.closest("[data-ug-admin-hidden]")) continue;
            var hTxt = cleanLabel(hel.innerText || "");
            if (!hTxt || hTxt.length < 3 || hTxt.length > 65) continue;
            if (/(?:rrb[\s\-–—_/|:•]*alp.{0,45}?(?:pdf|simulator)|alp.{0,30}?pdf.{0,20}?simulator|\bpdf[\s\-–—_/|:•]*simulator\b)/i.test(hTxt)) continue;
            if (/(?:म[ेै]न(?:्य)?[ुू][ँं]?)/u.test(hTxt)) continue;
            if (isToolText(hTxt)) continue;
            if (isPasswordSettingsText(hTxt) || PWD_EXACT_LABEL_RX.test(stripEmojis(hTxt))) continue;
            var hk = hTxt.toLowerCase();
            if (seenSectionNames[hk]) continue;
            seenSectionNames[hk] = true;
            sections.push({
                label: hTxt,
                icon: pickSmartIcon(hTxt),
                el: hel
            });
        }

        var statEls = root.querySelectorAll("[class*='rounded'], [class*='card'], [class*='stat']");
        var seenKpi = {};
        for (var k = 0; k < Math.min(statEls.length, 160) && kpis.length < 6; k++) {
            var kel = statEls[k];
            if (!isElementVisible(kel)) continue;
            if (kel.closest && kel.closest("[data-ug-admin-hidden]")) continue;
            if (kel.children.length > 6) continue;
            var kTxt = cleanLabel(kel.innerText || "");
            if (!kTxt || kTxt.length < 3 || kTxt.length > 52) continue;
            var m = kTxt.match(/([₹$]?\s*\d[\d,.]*\s*[kKmM%+]?)/);
            if (!m) continue;
            var numStr = m[1].trim();
            var lblStr = cleanLabel(kTxt.replace(numStr, "").replace(/[:\-|]/g, " "));
            if (!lblStr || lblStr.length < 3 || lblStr.length > 28) continue;
            if (/^\d+$/.test(lblStr)) continue;
            var kKey = lblStr.toLowerCase();
            if (seenKpi[kKey]) continue;
            seenKpi[kKey] = true;
            kpis.push({ value: numStr, label: lblStr });
        }

        state.discoveredTabs = tabs;
        state.discoveredActions = actions;
        state.discoveredSections = sections;
        state.discoveredKpis = kpis;
        state.activeSectionLabel = activeTabDetected || (sections[0] ? sections[0].label : "Admin Workspace");
        state.lastScanTs = Date.now();
    }

    /* -----------------------------------------------------------------------
       5. INTERACTIVE UI BINDINGS & SHEET RENDERERS
       ----------------------------------------------------------------------- */
    function bindShellEvents(shell) {
        var btnSearch = shell.querySelector("#ug-ma-btn-search");
        var btnTheme = shell.querySelector("#ug-ma-btn-theme");
        var btnRefresh = shell.querySelector("#ug-ma-btn-refresh");
        var fab = shell.querySelector("#ug-madmin-fab");
        var backdrop = shell.querySelector("#ug-madmin-backdrop");
        var scrollTopBtn = shell.querySelector("#ug-madmin-scrolltop");
        var searchInput = shell.querySelector("#ug-ma-search-input");

        if (btnSearch) btnSearch.addEventListener("click", function () { hapticTap(); openSheet("search"); });
        if (fab) fab.addEventListener("click", function () { hapticTap(); openSheet("quick"); });

        if (btnTheme) {
            btnTheme.addEventListener("click", function () {
                hapticTap();
                toggleAdminTheme();
            });
        }

        if (btnRefresh) {
            btnRefresh.addEventListener("click", function () {
                hapticTap();
                var icon = btnRefresh.querySelector("i");
                if (icon) {
                    icon.style.transition = "transform 0.55s ease";
                    icon.style.transform = "rotate(360deg)";
                    setTimeout(function () { icon.style.transition = ""; icon.style.transform = ""; }, 580);
                }
                hideThreeLinesInAdmin();
                hideToolFeaturesInAdmin();
                hidePasswordSectionInAdmin();
                scanLiveAdminWorkspace();
                renderDynamicChrome();
                showToast("Admin Workspace सिंक हो गया (" + state.discoveredTabs.length + " टैब्स)");
            });
        }

        if (backdrop) backdrop.addEventListener("click", function () { closeAllSheets(); });

        shell.querySelectorAll("[data-close-sheet]").forEach(function (btn) {
            btn.addEventListener("click", function () { hapticTap(); closeAllSheets(); });
        });

        shell.querySelectorAll(".ug-ma-sheet-handle-wrap").forEach(function (handle) {
            var startY = 0;
            handle.addEventListener("touchstart", function (e) {
                if (e.touches && e.touches[0]) startY = e.touches[0].clientY;
            }, { passive: true });
            handle.addEventListener("touchend", function (e) {
                if (e.changedTouches && e.changedTouches[0] && (e.changedTouches[0].clientY - startY) > 36) {
                    closeAllSheets();
                }
            }, { passive: true });
        });

        if (scrollTopBtn) {
            scrollTopBtn.addEventListener("click", function () {
                hapticTap();
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
        }

        if (searchInput) {
            searchInput.addEventListener("input", function () {
                renderSearchResults(searchInput.value);
            });
        }

        shell.querySelectorAll("#ug-madmin-bottomnav .ug-ma-nav-item").forEach(function (navBtn) {
            navBtn.addEventListener("click", function () {
                hapticTap();
                var mode = navBtn.getAttribute("data-nav");
                handleBottomNavClick(mode);
            });
        });

        var cancelLogout = shell.querySelector("#ug-ma-cancel-logout");
        var doLogout = shell.querySelector("#ug-ma-do-logout");
        if (cancelLogout) cancelLogout.addEventListener("click", function () { closeAllSheets(); });
        if (doLogout) {
            doLogout.addEventListener("click", function () {
                hapticTap();
                closeAllSheets();
                var root = document.getElementById("root") || document.body;
                var target = (state.logoutTargetEl && document.contains(state.logoutTargetEl))
                    ? state.logoutTargetEl
                    : findRealLogoutButton(root);
                if (target) {
                    showToast("Admin लॉगआउट किया जा रहा है…");
                    try { target.click(); } catch (e) {}
                    setTimeout(function () { evaluateAndSyncLifecycle(true); }, 350);
                } else {
                    showToast("Logout बटन वर्तमान स्क्रीन पर नहीं मिला");
                }
            });
        }
    }

    function setBottomNavActive(navKey) {
        var shell = document.getElementById("ug-madmin-shell");
        if (!shell) return;
        shell.querySelectorAll("#ug-madmin-bottomnav .ug-ma-nav-item").forEach(function (b) {
            b.classList.toggle("is-active", b.getAttribute("data-nav") === navKey);
        });
    }

    function findBestTabMatch(rx) {
        for (var i = 0; i < state.discoveredTabs.length; i++) {
            if (rx.test(state.discoveredTabs[i].label) && document.contains(state.discoveredTabs[i].el)) {
                return state.discoveredTabs[i];
            }
        }
        for (var j = 0; j < state.discoveredActions.length; j++) {
            if (rx.test(state.discoveredActions[j].label) && document.contains(state.discoveredActions[j].el)) {
                return state.discoveredActions[j];
            }
        }
        return null;
    }

    function triggerRealAdminControl(el, label) {
        if (!el || !document.contains(el)) {
            scanLiveAdminWorkspace();
            showToast("कंट्रोल अपडेट हो रहा है, कृपया पुनः टैप करें");
            return;
        }
        closeAllSheets();
        try {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            el.classList.add("ug-madmin-focus-pulse");
            setTimeout(function () { try { el.classList.remove("ug-madmin-focus-pulse"); } catch (e) {} }, 2100);
            el.click();
            state.activeSectionLabel = label || state.activeSectionLabel;
            showToast("खोला गया: " + label);
            setTimeout(function () {
                hideThreeLinesInAdmin();
                hideToolFeaturesInAdmin();
                hidePasswordSectionInAdmin();
                scanLiveAdminWorkspace();
                renderDynamicChrome();
            }, 320);
        } catch (e) {}
    }

    function handleBottomNavClick(navKey) {
        scanLiveAdminWorkspace();
        setBottomNavActive(navKey);

        if (navKey === "home") {
            closeAllSheets();
            var dashTab = findBestTabMatch(/(dashboard|overview|home|summary|डैशबोर्ड|होम)/i);
            if (dashTab) {
                triggerRealAdminControl(dashTab.el, dashTab.label);
            } else {
                window.scrollTo({ top: 0, behavior: "smooth" });
                showToast("Admin Overview");
            }
            return;
        }

        if (navKey === "tests") {
            var testTab = findBestTabMatch(/(test|exam|quiz|question|course|batch|टेस्ट|प्रश्न|कोर्स|बैच)/i);
            if (testTab) {
                triggerRealAdminControl(testTab.el, testTab.label);
            } else {
                openSheet("search");
                var inp = document.getElementById("ug-ma-search-input");
                if (inp) { inp.value = "test"; renderSearchResults("test"); }
            }
            return;
        }

        if (navKey === "users") {
            var userTab = findBestTabMatch(/(user|student|result|payment|admin|member|छात्र|यूजर|रिजल्ट|पेमेंट)/i);
            if (userTab) {
                triggerRealAdminControl(userTab.el, userTab.label);
            } else {
                openSheet("search");
                var inp2 = document.getElementById("ug-ma-search-input");
                if (inp2) { inp2.value = "user"; renderSearchResults("user"); }
            }
            return;
        }

        if (navKey === "studio") {
            openSheet("studio");
        }
    }

    function openSheet(sheetName) {
        scanLiveAdminWorkspace();
        closeAllSheets(true);
        state.openSheet = sheetName;

        var backdrop = document.getElementById("ug-madmin-backdrop");
        var sheetEl = document.getElementById("ug-ma-sheet-" + sheetName);
        if (!sheetEl) return;

        if (sheetName === "search") {
            var inp = document.getElementById("ug-ma-search-input");
            if (inp) {
                inp.value = "";
                renderSearchResults("");
                setTimeout(function () { try { inp.focus(); } catch (e) {} }, 220);
            }
        } else if (sheetName === "quick") {
            renderQuickActionsSheet();
        } else if (sheetName === "studio") {
            renderStudioDrawerSheet();
        }

        if (backdrop) backdrop.classList.add("is-open");
        sheetEl.classList.add("is-open");
    }

    function closeAllSheets(silent) {
        state.openSheet = null;
        var backdrop = document.getElementById("ug-madmin-backdrop");
        if (backdrop) backdrop.classList.remove("is-open");
        document.querySelectorAll("#ug-madmin-shell .ug-ma-sheet.is-open").forEach(function (s) {
            s.classList.remove("is-open");
        });
        if (!silent) {
            var inp = document.getElementById("ug-ma-search-input");
            if (inp && document.activeElement === inp) inp.blur();
        }
    }

    function showToast(msg) {
        var t = document.getElementById("ug-madmin-toast");
        if (!t || !state.active) return;
        t.textContent = msg;
        t.classList.add("is-show");
        if (state.toastTimer) clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(function () {
            t.classList.remove("is-show");
        }, 2300);
    }

    function toggleAdminTheme() {
        state.theme = (state.theme === "dark") ? "light" : "dark";
        writePref("theme", state.theme);
        applyAdminPreferences();
        showToast(state.theme === "dark" ? "Midnight Dark Pro थीम लागू" : "Ceramic Light Pro थीम लागू");
        if (state.openSheet === "studio") renderStudioDrawerSheet();
    }

    function applyAdminPreferences() {
        if (!state.active) return;
        document.documentElement.setAttribute("data-ug-madmin-theme", state.theme);
        document.documentElement.setAttribute("data-ug-madmin-density", state.density);
        document.documentElement.setAttribute("data-ug-madmin-subbar-collapsed", state.subbarCollapsed ? "true" : "false");

        var btnTheme = document.querySelector("#ug-ma-btn-theme i");
        if (btnTheme) {
            btnTheme.className = state.theme === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon";
