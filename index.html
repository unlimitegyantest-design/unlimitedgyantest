    <script>
        (function(){
            function loadChain(urls, done){
                var i=0;
                function next(){ if(i>=urls.length){ done(); return; } var s=document.createElement("script"); s.crossOrigin="anonymous"; s.src=urls[i++]; s.onload=done; s.onerror=function(){ s.remove(); next(); }; document.head.appendChild(s); }
                next();
            }
            window.__UG_REACT_READY__ = new Promise(function(res){
                if(window.React && window.ReactDOM) return res();
                loadChain(["https://unpkg.com/react@18/umd/react.production.min.js","https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js","https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"], function(){
                    loadChain(["https://unpkg.com/react-dom@18/umd/react-dom.production.min.js","https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js","https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"], res);
                });
            });
        })();

<body style="margin:0;background:#0f172a;font-family:'Noto Sans Devanagari','Inter',Arial,sans-serif;">
    <div id="root">
        <div id="ug-cloud-loader-ui" style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e1b4b);color:#fff;padding:24px;text-align:center;">
            <div style="width:52px;height:52px;border:4px solid rgba(56,189,248,0.25);border-top-color:#38bdf8;border-radius:50%;animation:ugSpin 0.8s linear infinite;margin-bottom:14px;"></div>
            <h2 style="margin:0;font-size:20px;font-weight:900;letter-spacing:0.4px;">Unlimited Gyan Test</h2>
            <p id="ug-boot-status" style="margin:8px 0 0 0;font-size:13px;color:#cbd5e1;font-weight:600;">Cloud से वेबसाइट लोड हो रही है…</p>
        </div>
    </div>
    <script>
    (function () {
        "use strict";
        var firebaseConfig = {"apiKey":"AIzaSyD02eg9jaNN-jACslUNpb0QL8wTsHlQnGM","authDomain":"unlimited-gyan1.firebaseapp.com","projectId":"unlimited-gyan1","storageBucket":"unlimited-gyan1.firebasestorage.app","messagingSenderId":"576198101472","appId":"1:576198101472:web:2496fda85c2d5439934385","measurementId":"G-4ZNEC6QNX0"};
        var APP_ID = "unlimited-gyan-secure-app";
        var BUNDLE_COL = "cloud_code_bundle";
        var CACHE_DB_NAME = "UGT_AutoSync_DB_" + firebaseConfig.projectId;
        var CACHE_STORE = "bundles";
        var FS_BASE = "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(firebaseConfig.projectId) + "/databases/(default)/documents/artifacts/" + encodeURIComponent(APP_ID) + "/public/data/" + encodeURIComponent(BUNDLE_COL) + "/";
        var params = new URLSearchParams(window.location.search);
        var targetPageId = (params.get("page") || "").replace(/[^a-zA-Z0-9_]/g, "");
        var forceFresh = params.has("fresh") || params.has("nocache");
        window.__UG_UPDATE_ERRORS__ = [];
        window.__UG_LOADED_UPDATES__ = [];

        function setStatus(t) { var e = document.getElementById("ug-boot-status"); if (e) e.textContent = t; }
        function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

        function decodeFsVal(v) {
            if (!v || typeof v !== "object") return null;
            if ("stringValue" in v) return v.stringValue;
            if ("integerValue" in v) return Number(v.integerValue);
            if ("doubleValue" in v) return Number(v.doubleValue);
            if ("booleanValue" in v) return Boolean(v.booleanValue);
            if ("nullValue" in v) return null;
            if ("arrayValue" in v) return (v.arrayValue && Array.isArray(v.arrayValue.values)) ? v.arrayValue.values.map(decodeFsVal) : [];
            if ("mapValue" in v) {
                var f = (v.mapValue && v.mapValue.fields) ? v.mapValue.fields : {};
                var o = {}; Object.keys(f).forEach(function (k) { o[k] = decodeFsVal(f[k]); }); return o;
            }
            return null;
        }
        function decodeFsDoc(json) {
            if (!json || !json.fields) return null;
            var out = {};
            Object.keys(json.fields).forEach(function (k) { out[k] = decodeFsVal(json.fields[k]); });
            return out;
        }

        async function fsGetDoc(docId) {
            var url = FS_BASE + encodeURIComponent(docId) + "?key=" + encodeURIComponent(firebaseConfig.apiKey || "");
            var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
            var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 15000) : null;
            try {
                var resp = await fetch(url, ctrl ? { signal: ctrl.signal, cache: "no-store" } : { cache: "no-store" });
                if (resp.status === 404) return null;
                if (!resp.ok) {
                    if (resp.status === 403) throw new Error("Firebase Rules की अनुमति नहीं है। कृपया Uploader से Rules Publish करें।");
                    throw new Error("Firebase सर्वर त्रुटि (HTTP " + resp.status + ")");
                }
                return decodeFsDoc(await resp.json());
            } catch (err) {
                if (err && err.name === "AbortError") throw new Error("Firebase सर्वर से जवाब नहीं मिला (Timeout)। इंटरनेट जाँचें।");
                throw err;
            } finally { if (timer) clearTimeout(timer); }
        }

        function openDB() {
            return new Promise(function (res) {
                if (!window.indexedDB) return res(null);
                try {
                    var r = indexedDB.open(CACHE_DB_NAME, 1);
                    r.onupgradeneeded = function (e) { if (!e.target.result.objectStoreNames.contains(CACHE_STORE)) e.target.result.createObjectStore(CACHE_STORE); };
                    r.onsuccess = function (e) { res(e.target.result); };
                    r.onerror = function () { res(null); };
                } catch (e) { res(null); }
            });
        }
        async function idbGet(k) {
            var db = await openDB(); if (!db) return null;
            return new Promise(function (res) { try { var r = db.transaction(CACHE_STORE, "readonly").objectStore(CACHE_STORE).get(k); r.onsuccess = function () { res(r.result || null); }; r.onerror = function () { res(null); }; } catch (e) { res(null); } });
        }
        async function idbSet(k, v) { var db = await openDB(); if (!db) return; try { db.transaction(CACHE_STORE, "readwrite").objectStore(CACHE_STORE).put(v, k); } catch (e) {} }
        async function idbClear() {
            var db = await openDB(); if (!db) return;
            return new Promise(function (res) { try { var r = db.transaction(CACHE_STORE, "readwrite").objectStore(CACHE_STORE).clear(); r.onsuccess = function () { res(); }; r.onerror = function () { res(); }; } catch (e) { res(); } });
        }

        async function fetchChunks(prefix, count) {
            var total = Number(count || 0);
            if (total <= 0) throw new Error("Cloud चंक संख्या अमान्य है।");
            var ps = [];
            for (var i = 0; i < total; i++) ps.push(fsGetDoc(prefix + i));
            var docs = await Promise.all(ps);
            var parts = [];
            for (var j = 0; j < docs.length; j++) {
                if (!docs[j] || typeof docs[j].data !== "string") throw new Error("Cloud चंक #" + j + " अधूरा मिला।");
                parts.push(docs[j].data);
            }
            return parts.join("");
        }

        async function getCachedOrFreshBundle(cacheKey, liveVer, chunkPrefix, chunkCount, label) {
            var cached = forceFresh ? null : await idbGet(cacheKey);
            if (cached && cached.payloadStr && (!liveVer || Number(cached.version) === Number(liveVer))) {
                try { return { version: cached.version, payloadStr: cached.payloadStr, payloadObj: JSON.parse(cached.payloadStr) }; } catch (e) {}
            }
            if (!chunkCount || Number(chunkCount) <= 0) {
                if (cached && cached.payloadStr) return { version: cached.version, payloadStr: cached.payloadStr, payloadObj: JSON.parse(cached.payloadStr) };
                return null;
            }
            if (label) setStatus(label);
            var str = await fetchChunks(chunkPrefix, chunkCount);
            var obj = JSON.parse(str);
            await idbSet(cacheKey, { version: liveVer || 1, payloadStr: str, savedAt: Date.now() });
            return { version: liveVer || 1, payloadStr: str, payloadObj: obj };
        }

        function ensureHeadLinks(links) {
            (links || []).forEach(function (attrs) {
                if (!attrs || !attrs.href) return;
                if (document.querySelector('link[href="' + attrs.href.replace(/"/g, "") + '"]')) return;
                var lk = document.createElement("link");
                Object.keys(attrs).forEach(function (k) { try { lk.setAttribute(k, attrs[k]); } catch (e) {} });
                document.head.appendChild(lk);
            });
        }

        function loadExternalScripts(list) {
            if (!Array.isArray(list) || !list.length) return Promise.resolve();
            return list.reduce(function (chain, item) {
                return chain.then(function () {
                    if (!item || !item.src) return;
                    if (document.querySelector('script[src="' + item.src.replace(/"/g, "") + '"]')) return;
                    return new Promise(function (resolve) {
                        var el = document.createElement("script");
                        var attrs = item.attrs || {};
                        Object.keys(attrs).forEach(function (k) {
                            if (k.toLowerCase() === "defer" || k.toLowerCase() === "async") return;
                            try { el.setAttribute(k, attrs[k]); } catch (e) {}
                        });
                        if (!el.getAttribute("src")) el.src = item.src;
                        el.async = false;
                        var done = false; function fin() { if (!done) { done = true; resolve(); } }
                        el.onload = fin; el.onerror = fin; setTimeout(fin, 12000);
                        document.body.appendChild(el);
                    });
                });
            }, Promise.resolve());
        }

        function runScriptSafe(sc, tagName, isolated) {
            return new Promise(function (resolve) {
                var code = String((sc && sc.code) || "");
                if (!code.trim()) return resolve();
                var t = String((sc && sc.type) || "").trim().toLowerCase();
                var isModule = t === "module";
                var isClassic = !t || t === "text/javascript" || t === "application/javascript";
                if (isClassic && !isModule) {
                    try { new Function(code); } catch (synErr) {
                        window.__UG_UPDATE_ERRORS__.push(tagName + " SyntaxError: " + synErr.message);
                        if (isolated) return resolve();
                        throw synErr;
                    }
                }
                if (isModule) {
                    var blob = new Blob([code + "\n//# sourceURL=" + tagName + ".mjs"], { type: "text/javascript" });
                    var blobUrl = URL.createObjectURL(blob);
                    var modEl = document.createElement("script");
                    modEl.type = "module";
                    if (sc.id) modEl.id = sc.id;
                    modEl.src = blobUrl;
                    var finDone = false;
                    function fin() { if (!finDone) { finDone = true; setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 2000); resolve(); } }
                    modEl.onload = fin; modEl.onerror = function () { window.__UG_UPDATE_ERRORS__.push(tagName + " Module load error"); fin(); };
                    setTimeout(fin, 15000);
                    document.body.appendChild(modEl);
                    return;
                }
                var jsEl = document.createElement("script");
                if (sc.id) jsEl.id = sc.id;
                if (sc.type) jsEl.type = sc.type;
                jsEl.textContent = isolated
                    ? ("try{\n" + code + "\n}catch(__ugErr){window.__UG_UPDATE_ERRORS__.push(" + JSON.stringify(tagName + ": ") + "+(__ugErr&&__ugErr.message?__ugErr.message:__ugErr));}\n//# sourceURL=" + tagName + ".js")
                    : (code + "\n//# sourceURL=" + tagName + ".js");
                document.body.appendChild(jsEl);
                resolve();
            });
        }

        function installReadyHooks() {
            if (window.__UG_READY_HOOKS_ON__) return;
            window.__UG_READY_HOOKS_ON__ = true;
            var origDoc = document.addEventListener.bind(document);
            var origWin = window.addEventListener.bind(window);
            document.addEventListener = function (type, fn, opts) {
                if (type === "DOMContentLoaded" && typeof fn === "function") { setTimeout(function () { try { fn.call(document, new Event("DOMContentLoaded")); } catch (e) {} }, 0); return; }
                return origDoc(type, fn, opts);
            };
            window.addEventListener = function (type, fn, opts) {
                if ((type === "DOMContentLoaded" || type === "load") && typeof fn === "function") { setTimeout(function () { try { fn.call(window, new Event(type)); } catch (e) {} }, 0); return; }
                return origWin(type, fn, opts);
            };
        }

        async function mountBaseBundle(p) {
            if (!p) throw new Error("मुख्य वेबसाइट का कोड खाली मिला।");
            if (p.title) document.title = p.title;
            if (p.htmlClass) document.documentElement.className = p.htmlClass;
            ensureHeadLinks(p.headLinks);
            (p.styles || []).forEach(function (st) { var el = document.createElement("style"); if (st.id) el.id = st.id; el.textContent = st.css || ""; document.head.appendChild(el); });
            document.body.removeAttribute("style");
            if (p.bodyId) document.body.id = p.bodyId;
            if (p.bodyStyle) document.body.setAttribute("style", p.bodyStyle);
            if (p.bodyClass) document.body.className = p.bodyClass;
            if (p.hasCustomBody && p.bodyHtml) {
                document.body.innerHTML = p.bodyHtml;
            }
            await loadExternalScripts(p.externalScripts || []);
            installReadyHooks();
            var scripts = p.scripts || [];
            for (var i = 0; i < scripts.length; i++) {
                await runScriptSafe(scripts[i], "base_script_" + (i + 1), false);
            }
        }

        // Error-Shielded Linked Update Mount (मुख्य वेबसाइट को कभी क्रैश नहीं होने देता)
        async function mountLinkedPatchSafe(item, p) {
            try {
                if (!p) return;
                ensureHeadLinks(p.headLinks);
                (p.styles || []).forEach(function (st) {
                    var el = document.createElement("style");
                    el.setAttribute("data-ug-update", item.id);
                    if (st.id) el.id = st.id;
                    el.textContent = st.css || "";
                    document.head.appendChild(el);
                });
                if (p.hasCustomBody && p.bodyHtml) {
                    var wrap = document.createElement("div");
                    wrap.id = "ug-update-mount-" + item.id;
                    wrap.setAttribute("data-ug-update-ui", item.id);
                    wrap.innerHTML = p.bodyHtml;
                    document.body.appendChild(wrap);
                }
                await loadExternalScripts(p.externalScripts || []);
                var scripts = p.scripts || [];
                for (var i = 0; i < scripts.length; i++) {
                    await runScriptSafe(scripts[i], "update_" + item.id + "_" + (i + 1), true);
                }
                window.__UG_LOADED_UPDATES__.push({ id: item.id, version: item.version || 1, title: item.title || item.id });
            } catch (err) {
                window.__UG_UPDATE_ERRORS__.push("Update [" + item.id + "]: " + (err && err.message ? err.message : err));
            }
        }

        async function showBootError(msg) {
            var good = await idbGet("last_good_base");
            var hasSafe = !!(good && good.payloadStr);
            var target = document.getElementById("root") || document.body;
            target.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;padding:20px;text-align:center;font-family:\'Noto Sans Devanagari\',Arial,sans-serif;"><div style="width:100%;max-width:450px;background:#fff;border:2px solid #fecdd3;border-radius:22px;padding:24px;"><h2 style="color:#be123c;margin:0 0 8px 0;font-size:19px;font-weight:900;">वेबसाइट Cloud से लोड नहीं हो सकी</h2><p style="color:#475569;font-size:13px;line-height:1.6;margin:0 0 18px 0;">' + esc(msg) + '</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">' + (hasSafe ? '<button id="ug-safe" type="button" style="background:#059669;color:#fff;border:none;padding:10px 16px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;">सुरक्षित मोड खोलें</button>' : '') + '<button id="ug-r1" type="button" style="background:#0284c7;color:#fff;border:none;padding:10px 18px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;">Reload करें</button><button id="ug-r2" type="button" style="background:#f1f5f9;color:#0f172a;border:1px solid #cbd5e1;padding:10px 16px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;">कैश साफ़ करें</button></div></div></div>';
            var r1 = document.getElementById("ug-r1"); if (r1) r1.onclick = function () { window.location.reload(); };
            var r2 = document.getElementById("ug-r2"); if (r2) r2.onclick = async function () { await idbClear(); window.location.reload(); };
            var sf = document.getElementById("ug-safe"); if (sf && hasSafe) sf.onclick = async function () { await idbSet("base_bundle", good); window.location.reload(); };
        }

        async function bootFromFirebaseCloud() {
            try {
                var reactWait = Promise.race([window.__UG_REACT_READY__ || Promise.resolve(), new Promise(function (r) { setTimeout(r, 9000); })]);

                if (targetPageId) {
                    setStatus("लिंक किया पेज (" + targetPageId + ") लोड हो रहा है…");
                    var pageMan = null;
                    try { pageMan = await fsGetDoc("upd_" + targetPageId + "_manifest"); } catch (e) {}
                    var pageData = await getCachedOrFreshBundle("page_" + targetPageId, pageMan && pageMan.version, "upd_" + targetPageId + "_chunk_", pageMan && pageMan.chunkCount, "पेज (" + targetPageId + ") डाउनलोड हो रहा है…");
                    if (!pageData) throw new Error("पेज ?page=" + targetPageId + " Cloud में नहीं मिला।");
                    await reactWait;
                    await mountBaseBundle(pageData.payloadObj);
                    return;
                }

                var manifest = null;
                var regDoc = null;
                try {
                    var pair = await Promise.all([fsGetDoc("manifest"), fsGetDoc("updates_registry")]);
                    manifest = pair[0]; regDoc = pair[1];
                } catch (netErr) {
                    var offlineCached = await idbGet("base_bundle");
                    if (!offlineCached) throw netErr;
                }

                var baseData = await getCachedOrFreshBundle("base_bundle", manifest && manifest.version, "chunk_", manifest && manifest.chunkCount, "मुख्य वेबसाइट (v" + (manifest ? manifest.version : 1) + ") लोड हो रही है…");
                if (!baseData) throw new Error("Cloud में अभी मुख्य वेबसाइट अपलोड नहीं है। कृपया पहले Cloud Uploader से मुख्य वेबसाइट अपलोड करें।");

                var registryItems = [];
                if (regDoc) {
                    if (typeof regDoc.itemsJson === "string") { try { registryItems = JSON.parse(regDoc.itemsJson); } catch (e) {} }
                    else if (Array.isArray(regDoc.items)) registryItems = regDoc.items;
                    await idbSet("updates_registry_cache", registryItems);
                } else {
                    var cachedReg = await idbGet("updates_registry_cache");
                    if (Array.isArray(cachedReg)) registryItems = cachedReg;
                }

                var enabledPatches = (registryItems || []).filter(function (it) { return it && it.mode === "patch" && it.enabled !== false && it.id; });
                var patchPayloads = [];
                if (enabledPatches.length > 0) {
                    setStatus("मुख्य साइट के साथ " + enabledPatches.length + " जुड़े अपडेट तैयार हो रहे हैं…");
                    patchPayloads = await Promise.all(enabledPatches.map(async function (item) {
                        try {
                            var res = await getCachedOrFreshBundle("patch_" + item.id, item.version, "upd_" + item.id + "_chunk_", item.chunkCount, "");
                            return { item: item, data: res };
                        } catch (e) {
                            window.__UG_UPDATE_ERRORS__.push("Fetch [" + item.id + "]: " + (e && e.message ? e.message : e));
                            return { item: item, data: null };
                        }
                    }));
                }

                await reactWait;
                await mountBaseBundle(baseData.payloadObj);

                for (var u = 0; u < patchPayloads.length; u++) {
                    if (patchPayloads[u] && patchPayloads[u].data && patchPayloads[u].data.payloadObj) {
                        await mountLinkedPatchSafe(patchPayloads[u].item, patchPayloads[u].data.payloadObj);
                    }
                }

                setTimeout(function () {
                    if (!document.getElementById("ug-cloud-loader-ui")) {
                        void idbSet("last_good_base", { version: baseData.version, payloadStr: baseData.payloadStr, savedAt: Date.now() });
                    }
                }, 2500);
            } catch (err) {
                await showBootError(err && err.message ? err.message : "इंटरनेट जाँचें और पेज Reload करें।");
            }
        }
        bootFromFirebaseCloud();
    })();
    </script>
