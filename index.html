                    body: `${hiClean}\n${enClean}`
                });
                i++;
            }
            else if (curEnMatch && nextHiMatch && (curEnMatch[1] === nextHiMatch[1] || !curHasOptions)) {
                const enClean = curSeg.replace(/^\s*Q(?:uestion)?(?:\s*No\.?)?\s*[\.\-:]*\s*\d+\s*(?:\[EN\]\s*:?)?\s*[:\.\-\)]?\s*/i, '').trim();
                const hiClean = nextSeg.replace(/^\s*प्र(?:श्न)?(?:\s*क्र\.?)?\s*[\.\-:]*\s*\d+\s*(?:\[HI\]\s*:?)?\s*[:\.\-\)]?\s*/i, '').trim();
                const hiOptsCheck = extractOptionsFromBlockText(hiClean);
                const hiOnlyStem = hiOptsCheck ? hiOptsCheck.beforeOpts : hiClean;
                combinedBlocks.push({
                    qNum: curEnMatch[1],
                    directHiStem: hiOnlyStem,
                    directEnBlock: enClean,
                    body: `${hiOnlyStem}\n${enClean}\n${hiOptsCheck ? hiClean.slice(hiClean.indexOf(hiOnlyStem) + hiOnlyStem.length) : ''}`
                });
                i++;
            }
            else {
                const stripped = curSeg.replace(/^(?:प्र(?:श्न)?(?:\s*क्र\.?)?\s*[\.\-:]*\s*\d*|Q(?:uestion)?\s*(?:No\.?)?\s*[\.\-:]*\s*\d+)\s*(?:\[(?:EN|HI)\]\s*:?)?\s*[:\.\-\)]?\s*/i, '').trim();
                combinedBlocks.push({
                    qNum: (curHiMatch?.[1] || curEnMatch?.[1] || null),
                    body: stripped
                });
            }
        }
        const intermediateItems = [];
        combinedBlocks.forEach((itemObj) => {
            let body = stripRrbMetadataAndNoise(itemObj.body);
            if (!body || /^(?:हल|व्याख्या|Solution|Sol)\s*[\/:ः\-]*$/i.test(body))
                return;

            // पहले Correct Answer (Green) / सही उत्तर (Green) को पहचानें (चाहे वह Solution से पहले हो या बाद में)
            let explicitPreviewAns = null;
            const previewAnsMatch = body.match(/(?:^|\n)\s*(?:सही\s*(?:उत्तर|विकल्प)(?:\s*\(Green\))?|उत्तर|Ans(?:wer)?|Correct\s*(?:Option|Answer)(?:\s*\(Green\))?)\s*[:\-\=]\s*\(?([A-Da-d1-4अ-द])\)?(?=\s|$)/i);
            if (previewAnsMatch) {
                const rawA = previewAnsMatch[1].toUpperCase();
                const mapCode = { '1': 'A', '2': 'B', '3': 'C', '4': 'D', 'अ': 'A', 'ब': 'B', 'स': 'C', 'द': 'D' };
                explicitPreviewAns = mapCode[rawA] || rawA;
                body = body.replace(/(?:^|\n)\s*(?:सही\s*(?:उत्तर|विकल्प)(?:\s*\(Green\))?|उत्तर|Ans(?:wer)?|Correct\s*(?:Option|Answer)(?:\s*\(Green\))?)\s*[:\-\=]\s*\(?[A-Da-d1-4अ-द]\)?(?=\s|$)/gi, '').trim();
            }

            body = body.replace(/(हल|व्याख्या)\s*(?:\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]\s*)*(\/\s*)*(?:\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]\s*)*(Solution|हल)?\s*(?:\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]\s*)*([ः:\-])/gi, '$1 $2$3$4 ');
            body = body.replace(/(?:^|\n)\s*[|।]?\s*(?:हल\s*(?:\/\s*)+Solution|व्याख्या|हल|Solution)\s*[ः:\-]\s*\n(\s*\([B-D]\)\s*[^\n]+)/gi, '\n$1\nहल / Solution: ');

            // Solution / हल / व्याख्या / Explanation को निकालें
            let solText = '';
            const solSplit = body.split(/(?:^|\n|\s|[|।])\s*[-\u2013\u2014•*👉|।]*\s*(?:हल\s*(?:\/\s*)+(?:Solution|हल)|Solution\s*(?:\/\s*)+हल|व्याख्या\s*(?:\/\s*)+Solution|उत्तर\s*व्याख्या|व्याख्या|हल|Solution|Explanation|Sol\.?)\s*[ः:\-]\s*/i);
            if (solSplit.length > 1) {
                let rawSol = solSplit.slice(1).join(' / ').trim();
                let beforeSol = solSplit[0].trim();
                const solLines = rawSol.split('\n');
                const keptSolLines = [];
                for (const sLine of solLines) {
                    if (/^\s*\(\s*[A-D1-4]\s*\)/i.test(sLine.trim()) && (!/\(\s*[B2]\s*\)/i.test(beforeSol) || !/\(\s*[C3]\s*\)/i.test(beforeSol) || !/\(\s*[D4]\s*\)/i.test(beforeSol))) {
                        beforeSol += '\n' + sLine.trim();
                    }
                    else {
                        keptSolLines.push(sLine);
                    }
                }
                solText = fixBrokenHindiText(keptSolLines
                    .join('\n')
                    .replace(/\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]/g, '')
                    .replace(/\$/g, '')
                    .trim());
                body = beforeSol;
            }

            let qStem = body;
            let options = null;
            let detectedCorrectIdx = -1;
            let hasExtractedOptions = false;
            const ansSplit = body.split(/(?:^|\n|\s)Ans(?:wer)?\s*[:\-]?\s*(?=\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]|🟢|✅|[X✗×Χ✔☑☐]|[1-4]\s*[\.\)]|\(\s*[A-Da-d1-4]\s*\)|\s|$)/i);
            const stemCandidate = ansSplit.length > 1 ? ansSplit[0].trim() : body;
            const optsRegion = ansSplit.length > 1 ? ansSplit.slice(1).join('\n').trim() : body;
            const hasExplicitGreenBadge = (markerStr, rawSlice = '') => {
                if (/🟢|✅|✔|✓|☑|💚|\[\s*स\s*ह\s*ी?\s*उ\s*(?:त्त|त|\s)*र\s*\]|\(\s*स\s*ह\s*ी?\s*उ\s*(?:त्त|त|\s)*र\s*\)|\[\s*Correct\s*Answer\s*\]/i.test(markerStr || '')) {
                    return true;
                }
                const trimmedSlice = String(rawSlice || '').replace(/\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]/g, '').trim();
                if (/✓|✔|☑|🟢|✅|\[\s*स\s*ह\s*ी?\s*उ\s*(?:त्त|त|\s)*र\s*\]/i.test(trimmedSlice))
                    return true;
                if (/(?<![a-zA-Z])\s*\/$/.test(trimmedSlice) && !/\b(?:km|m|s|hr|min|kg)\s*\/$/i.test(trimmedSlice)) {
                    return true;
                }
                return false;
            };
            const getGreenPixelScore = (markerStr) => {
                if (!markerStr)
                    return 0;
                let totalScore = 0;
                const matches = String(markerStr).matchAll(/\[GREEN_ANS(?::(\d+))?\]/g);
                for (const m of matches) {
                    totalScore += (m[1] ? parseInt(m[1], 10) : 50);
                }
                return totalScore;
            };
            const seqResult = extractOptionsFromBlockText(optsRegion);
            const optLetters = ['A', 'B', 'C', 'D'];
            let explicitBadgeFound = false;
            if (seqResult && seqResult.rawOpts.length === 4) {
                hasExtractedOptions = true;
                qStem = ansSplit.length > 1 ? stemCandidate : seqResult.beforeOpts;
                options = seqResult.rawOpts;
                const markers = seqResult.markers;
                const rawSlices = seqResult.rawSlices || [];
                const innerOptsResult = extractOptionsFromBlockText(qStem);
                if (innerOptsResult && innerOptsResult.rawOpts.length === 4) {
                    const afterFirstOpts = qStem.slice(qStem.indexOf(innerOptsResult.beforeOpts) + innerOptsResult.beforeOpts.length);
                    const secondStemLines = afterFirstOpts
                        .replace(/(?:\(\s*[A-Da-d1-4]\s*\)|[A-Da-d1-4]\s*[\.\)])\s*[^\n]+/g, '')
                        .trim();
                    qStem = innerOptsResult.beforeOpts + '\n' + secondStemLines;
                    options = mergeOptionArraysWithSlash(innerOptsResult.rawOpts, options);
                }
                const explicitBadgeIdx = markers.findIndex((m, idx) => hasExplicitGreenBadge(m, rawSlices[idx]));
                if (explicitBadgeIdx !== -1) {
                    detectedCorrectIdx = explicitBadgeIdx;
                    explicitBadgeFound = true;
                }
                else {
                    const greenScores = markers.map(m => getGreenPixelScore(m));
                    const maxGreenScore = Math.max(...greenScores);
                    if (maxGreenScore > 0) {
                        detectedCorrectIdx = greenScores.indexOf(maxGreenScore);
                    }
                    else {
                        const isWrong = markers.map(m => m.includes('[RED_OPT]') || /[X✗✘❌×Χ]/i.test(m));
                        if (isWrong.filter(Boolean).length === 3) {
                            detectedCorrectIdx = isWrong.indexOf(false);
                        }
                    }
                }
            }
            let solMatchedLetter = null;
            if (solText && options && options.length === 4) {
                solMatchedLetter = matchOptionFromSolutionText(solText, options, qStem);
            }
            let ansLetter = null;
            if (explicitBadgeFound && detectedCorrectIdx !== -1) {
                ansLetter = optLetters[detectedCorrectIdx];
            }
            else if (detectedCorrectIdx !== -1) {
                ansLetter = optLetters[detectedCorrectIdx];
            }
            else if (solMatchedLetter) {
                ansLetter = solMatchedLetter;
            }
            else if (explicitPreviewAns) {
                ansLetter = explicitPreviewAns;
            }
            const rawCleanedStem = qStem
                .replace(/\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]/g, '')
                .replace(/\$/g, '')
                .trim();
            const stemImgCheck = extractAndStripImageFromText(rawCleanedStem);
            const bodyImgCheck = !stemImgCheck.imageSrc ? extractAndStripImageFromText(itemObj.body) : { imageSrc: '' };
            const detectedImageSrc = stemImgCheck.imageSrc || bodyImgCheck.imageSrc || '';
            const cleanedStem = stemImgCheck.cleanedText;

            if (!cleanedStem && !detectedImageSrc)
                return;
            let extractedEn = '';
            let extractedHi = '';
            if (itemObj.directHiStem && cleanedStem.startsWith(itemObj.directHiStem.slice(0, 20))) {
                const rawHiPart = extractAndStripImageFromText(itemObj.directHiStem
                    .replace(/\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]/g, '')
                    .replace(/\$/g, '')
                    .trim()).cleanedText;
                const rawEnPart = extractAndStripImageFromText(cleanedStem
                    .slice(itemObj.directHiStem.length)
                    .replace(/\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]/g, '')
                    .replace(/\$/g, '')
                    .trim()).cleanedText;
                extractedHi = fixBrokenHindiText(normalizeFillInTheBlankStem(rawHiPart, true));
                extractedEn = normalizeFillInTheBlankStem(rawEnPart, false);
                const tableLines = rawEnPart.split('\n').filter(l => l.trim().startsWith('|'));
                if (tableLines.length > 0 && !extractedHi.includes('|')) {
                    extractedHi = extractedHi + '\n' + tableLines.join('\n');
                }
            }
            else {
                const splitRes = splitBilingualStem(cleanedStem);
                extractedEn = splitRes.en;
                extractedHi = splitRes.hi;
            }
            if (!extractedEn && !extractedHi && !detectedImageSrc)
                return;

            // निकाले गए Solution को साफ रूप में सेव करें
            const parsedSolParts = splitBilingualSolutionParts(solText);
            let formattedRawSol = '';
            if (parsedSolParts.hi && parsedSolParts.en) {
                formattedRawSol = `हल: ${parsedSolParts.hi} / Solution: ${parsedSolParts.en}`;
            } else if (parsedSolParts.hi) {
                formattedRawSol = `हल: ${parsedSolParts.hi}`;
            } else if (parsedSolParts.en) {
                formattedRawSol = `Solution: ${parsedSolParts.en}`;
            }

            intermediateItems.push({
                explicitQNum: itemObj.qNum,
                questionEn: extractedEn,
                questionHi: extractedHi,
                options: hasExtractedOptions ? options : null,
                hasExtractedOptions,
                answer: ansLetter,
                solution: formattedRawSol,
                image: detectedImageSrc
            });
        });

        const mergedQuestions = [];
        const optLetters = ['A', 'B', 'C', 'D'];
        for (let i = 0; i < intermediateItems.length; i++) {
            const cur = intermediateItems[i];
            const next = i + 1 < intermediateItems.length ? intermediateItems[i + 1] : null;
            let shouldMergeWithNext = false;
            if (next) {
                const curIsHiOnly = !!cur.questionHi && !cur.questionEn;
                const curIsEnOnly = !!cur.questionEn && !cur.questionHi;
                const nextIsHiOnly = !!next.questionHi && !next.questionEn;
                const nextIsEnOnly = !!next.questionEn && !next.questionHi;
                const complementaryLangs = (curIsHiOnly && nextIsEnOnly) || (curIsEnOnly && nextIsHiOnly);
                if (complementaryLangs && (!cur.hasExtractedOptions || !next.hasExtractedOptions || cur.explicitQNum === next.explicitQNum)) {
                    shouldMergeWithNext = true;
                }
            }
            if (shouldMergeWithNext && next) {
                const combinedEn = cur.questionEn || next.questionEn || '';
                const combinedHi = cur.questionHi || next.questionHi || '';
                const combinedOpts = mergeOptionArraysWithSlash(cur.questionEn ? cur.options : next.options, cur.questionHi ? cur.options : next.options);
                const finalAns = ['A', 'B', 'C', 'D'].includes(cur.answer || next.answer) ? (cur.answer || next.answer) : 'A';
                const p1 = splitBilingualSolutionParts(cur.solution);
                const p2 = splitBilingualSolutionParts(next.solution);
                const sHi = p1.hi || p2.hi || '';
                const sEn = p1.en || p2.en || '';
                const finalSol = (sHi && sEn)
                    ? `हल: ${sHi} / Solution: ${sEn}`
                    : sHi
                        ? `हल: ${sHi}`
                        : sEn
                            ? `Solution: ${sEn}`
                            : `हल: सही उत्तर विकल्प (${finalAns}) है। / Solution: The correct answer is option (${finalAns}).`;
                mergedQuestions.push({
                    id: Date.now() + mergedQuestions.length + 1,
                    section: subCategory || 'ALP PYQ 2026-27',
                    questionEn: combinedEn,
                    questionHi: combinedHi,
                    options: combinedOpts,
                    answer: finalAns,
                    solution: finalSol,
                    image: cur.image || next.image || ''
                });
                i++;
            }
            else {
                const finalOpts = cur.hasExtractedOptions && cur.options
                    ? cur.options.map((o, idx) => o || `Option ${optLetters[idx]} / विकल्प ${optLetters[idx]}`)
                    : ['Option A / विकल्प A', 'Option B / विकल्प B', 'Option C / विकल्प C', 'Option D / विकल्प D'];
                const finalAns = ['A', 'B', 'C', 'D'].includes(cur.answer) ? cur.answer : 'A';
                const finalSol = cur.solution || `हल: सही उत्तर विकल्प (${finalAns}) है। / Solution: The correct answer is option (${finalAns}).`;
                mergedQuestions.push({
                    id: Date.now() + mergedQuestions.length + 1,
                    section: subCategory || 'ALP PYQ 2026-27',
                    questionEn: cur.questionEn || '',
                    questionHi: cur.questionHi || '',
                    options: finalOpts,
                    answer: finalAns,
                    solution: finalSol,
                    image: cur.image || ''
                });
            }
        }
        return mergedQuestions;
    };

    const mergeParsedIntoLanguageSlot = async (parsedList, targetLangSlot, baseList = tbQuestions, replaceAll = false) => {
        if (!Array.isArray(parsedList) || parsedList.length === 0) return [];
        const isEnglish = targetLangSlot === 'EN';
        const incomingOnly = [];
        for (let i = 0; i < parsedList.length; i++) {
            const q = parsedList[i];
            const sourceText = isEnglish
                ? (q.questionEn || q.questionHi || '')
                : (q.questionHi || q.questionEn || '');
            const options = (q.options || []).map(o => String(o || '').trim()).filter(Boolean);
            const ans = ['A', 'B', 'C', 'D'].includes(q.answer) ? q.answer : 'A';
            const formattedSol = await formatSolutionHindiEnglish(q.solution || '', true, sourceText, ans);
            incomingOnly.push({
                ...q,
                id: Date.now() + i + 1,
                section: subCategory || q.section || 'ALP PYQ 2026-27',
                questionEn: isEnglish ? sourceText : '',
                questionHi: isEnglish ? '' : fixBrokenHindiText(sourceText),
                options,
                answer: ans,
                solution: formattedSol,
                image: q.image || ''
            });
        }
        const isDefaultDemo = baseList.length === 2 && baseList[0]?.id === 1 && baseList[1]?.id === 2;
        const base = (replaceAll || isDefaultDemo) ? [] : baseList;
        const merged = [...base, ...incomingOnly];
        setTbQuestions(merged);
        if (isEnglish) setRawEnglishInput(formatEnglishBoxText(incomingOnly));
        else setRawHindiInput(formatHindiBoxText(incomingOnly));
        return incomingOnly;
    };

    // PDF पेज के अंदर बने ग्राफ़ / चित्र / आकृति को ऑटोमैटिक पहचानकर क्रॉप करने वाला हेल्पर फंक्शन
    const cropDiagramFromPdfGap = (offscreenCanvas, imgData, viewport, upperPdfY, lowerPdfY) => {
        if (!offscreenCanvas || !imgData) return '';
        try {
            const [, cyTop] = viewport.convertToViewportPoint(0, upperPdfY);
            const [, cyBottom] = viewport.convertToViewportPoint(0, lowerPdfY);
            const yStart = Math.max(0, Math.floor(Math.min(cyTop, cyBottom)) + 6);
            const yEnd = Math.min(offscreenCanvas.height - 1, Math.ceil(Math.max(cyTop, cyBottom)) - 6);
            if (yEnd - yStart < 42) return '';

            const w = offscreenCanvas.width;
            const data = imgData.data;
            let minX = w, maxX = 0, minY = yEnd, maxY = yStart;
            let darkPixels = 0;
            const xLeftBound = Math.floor(w * 0.04);
            const xRightBound = Math.ceil(w * 0.96);

            for (let py = yStart; py <= yEnd; py++) {
                for (let px = xLeftBound; px <= xRightBound; px++) {
                    const idx = (py * w + px) * 4;
                    const r = data[idx], g = data[idx + 1], b = data[idx + 2];
                    if (r < 215 || g < 215 || b < 215) {
                        darkPixels++;
                        if (px < minX) minX = px;
                        if (px > maxX) maxX = px;
                        if (py < minY) minY = py;
                        if (py > maxY) maxY = py;
                    }
                }
            }

            const boxW = maxX - minX + 1;
            const boxH = maxY - minY + 1;
            if (darkPixels < 220 || boxW < 45 || boxH < 32) return '';

            const pad = 10;
            const cropX = Math.max(0, minX - pad);
            const cropY = Math.max(0, minY - pad);
            const cropW = Math.min(w - cropX, boxW + pad * 2);
            const cropH = Math.min(offscreenCanvas.height - cropY, boxH + pad * 2);

            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = cropW;
            cropCanvas.height = cropH;
            const cropCtx = cropCanvas.getContext('2d');
            cropCtx.fillStyle = '#ffffff';
            cropCtx.fillRect(0, 0, cropW, cropH);
            cropCtx.drawImage(offscreenCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            return cropCanvas.toDataURL('image/png');
        } catch (e) {
            return '';
        }
    };

    const extractTextFromPdfFile = async (file, targetLangSlot = 'BI') => {
        if (!file)
            return;
        if (targetLangSlot === 'EN')
            setExtractingEn(true);
        else
            setExtractingHi(true);
        const slotLabel = targetLangSlot === 'EN' ? 'English Box' : 'शुद्ध हिन्दी Box';
        setExtractStatus(`${slotLabel}: PDF "${file.name}" से प्रश्न, Options, Solutions और चित्र स्कैन किए जा रहे हैं...`);
        setMsg({ text: `${slotLabel} में PDF "${file.name}" से प्रश्न, Options, Solutions और ग्राफ़/चित्र निकाले जा रहे हैं...`, type: 'info' });
        try {
            const pdfjsLib = await loadPdfJsScript();
            const arrayBuf = await file.arrayBuffer();
            const pdfDoc = await pdfjsLib.getDocument({
                data: arrayBuf,
                cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                cMapPacked: true,
                standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'
            }).promise;
            let fullText = '';
            const maxPages = Math.min(pdfDoc.numPages, 200);
            const offscreenCanvas = document.createElement('canvas');
            const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });
            for (let p = 1; p <= maxPages; p++) {
                setExtractStatus(`${slotLabel}: पेज ${p} / ${maxPages} स्कैन हो रहा है...`);
                const page = await pdfDoc.getPage(p);
                const scale = 1.5;
                const viewport = page.getViewport({ scale });
                offscreenCanvas.width = Math.ceil(viewport.width);
                offscreenCanvas.height = Math.ceil(viewport.height);
                let imgData = null;
                try {
                    await page.render({ canvasContext: offscreenCtx, viewport }).promise;
                    imgData = offscreenCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
                }
                catch (renderErr) { }
                const detectItemColorTag = (it, checkLeftIcon = false) => {
                    if (!imgData || !it || !it.str || !it.str.trim())
                        return '';
                    const fontSize = it.fontSize || 10;
                    const itemW = Math.max(it.w || 0, it.str.trim().length * fontSize * 0.42, 8);
                    const pdfXStart = checkLeftIcon ? (it.x - 18) : it.x;
                    const pdfXEnd = it.x + itemW;
                    const safeBottomPdfY = it.y + 0.5;
                    const safeTopPdfY = it.y + fontSize * 0.80;
                    const [cx1, cyBottom] = viewport.convertToViewportPoint(pdfXStart, safeBottomPdfY);
                    const [cx2, cyTop] = viewport.convertToViewportPoint(pdfXEnd, safeTopPdfY);
                    const xStart = Math.max(0, Math.floor(Math.min(cx1, cx2)));
                    const xEnd = Math.min(offscreenCanvas.width - 1, Math.ceil(Math.max(cx1, cx2)));
                    const yStart = Math.max(0, Math.floor(Math.min(cyBottom, cyTop)));
                    const yEnd = Math.min(offscreenCanvas.height - 1, Math.ceil(Math.max(cyBottom, cyTop)));
                    let greenCount = 0;
                    let redCount = 0;
                    const data = imgData.data;
                    const w = offscreenCanvas.width;
                    for (let py = yStart; py <= yEnd; py++) {
                        for (let px = xStart; px <= xEnd; px++) {
                            const idx = (py * w + px) * 4;
                            const r = data[idx];
                            const g = data[idx + 1];
                            const b = data[idx + 2];
                            if (g >= 60 && r < 175 && g > r + 22 && g > b + 18) {
                                greenCount++;
                            }
                            else if (r > 125 && g < 160 && r > g + 32 && r > b + 28) {
                                redCount++;
                            }
                        }
                    }
                    if (greenCount >= 4 && greenCount > redCount * 1.3)
                        return `[GREEN_ANS:${greenCount}] `;
                    if (redCount >= 8 && redCount > greenCount * 1.5)
                        return '[RED_OPT] ';
                    return '';
                };
                const textContent = await page.getTextContent();
                const rows = [];
                for (const item of textContent.items) {
                    if (item.str === undefined || item.str === null || item.str === '')
                        continue;
                    const x = item.transform ? item.transform[4] : 0;
                    const y = item.transform ? item.transform[5] : 0;
                    const fontSize = item.transform ? Math.abs(item.transform[0] || item.transform[3] || 10) : 10;
                    const w = item.width !== undefined ? item.width : (item.str.length * fontSize * 0.45);
                    let targetRow = rows.find(r => Math.abs(r.y - y) <= 4.2);
                    if (!targetRow && item.str.trim()) {
                        targetRow = rows.find(r => {
                            if (Math.abs(r.y - y) > 8.5)
                                return false;
                            const x1 = x;
                            const x2 = x + Math.max(w, 6);
                            const hasXOverlap = r.items.some(existing => {
                                if (!existing.str.trim())
                                    return false;
                                const ex1 = existing.x;
                                const ex2 = existing.x + Math.max(existing.w, 6);
                                return Math.min(x2, ex2) - Math.max(x1, ex1) > 4;
                            });
                            return !hasXOverlap;
                        });
                    }
                    if (!targetRow) {
                        targetRow = { y, items: [] };
                        rows.push(targetRow);
                    }
                    targetRow.items.push({ str: item.str, x, y, w, fontSize, hasEOL: !!item.hasEOL });
                }
                rows.sort((a, b) => b.y - a.y);
                const metaZoneRe = /^(?:Question\s*Type|Question\s*ID|Option\s*[1-4]\s*ID|Status|Chosen\s*Option|Not\s*Attempted|Marked\s*For\s*Review|Not\s*Answered|Answered)\b/i;
                const watermarkRe = /^(?:SCIENCE|MAGNET|SCIENC|MAGNE|MAGN|SCIE|AGN|INDIAN\s*RAILWAY)$/i;
                const isSolutionLineRe = /^(?:\|?\s*(?:हल\s*(?:\/\s*)+Solution|व्याख्या|हल|Solution)\s*[ः:\-\/])/i;
                let pageLines = [];
                let lastValidRowY = null;
                for (let rIdx = 0; rIdx < rows.length; rIdx++) {
                    const row = rows[rIdx];
                    row.items.sort((a, b) => a.x - b.x);
                    let cleanItems = [];
                    for (const it of row.items) {
                        const t = it.str.trim();
                        if (t && watermarkRe.test(t))
                            continue;
                        if (t && (metaZoneRe.test(t) || /^441009\d{6}$/.test(t)))
                            break;
                        cleanItems.push(it);
                    }
                    if (cleanItems.length === 0)
                        continue;

                    if (imgData && lastValidRowY !== null && (lastValidRowY - row.y) > 46) {
                        const croppedDiagram = cropDiagramFromPdfGap(offscreenCanvas, imgData, viewport, lastValidRowY - 8, row.y + 12);
                        if (croppedDiagram) {
                            pageLines.push(storeImageInVault(croppedDiagram));
                        }
                    }
                    lastValidRowY = row.y;

                    const rawRowPreview = cleanItems.map(ci => ci.str).join(' ').trim();
                    const isSolRow = isSolutionLineRe.test(rawRowPreview);
                    let lineStr = '';
                    let lastEndX = null;
                    let seenSolutionInRow = isSolRow;
                    const itemSpans = [];
                    for (let cIdx = 0; cIdx < cleanItems.length; cIdx++) {
                        const it = cleanItems[cIdx];
                        const rawCleaned = String(it.str || '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\u00AD\u200B-\u200F\uE000-\uF8FF\uFEFF\uFFF0-\uFFFF]/g, '');
                        if (!rawCleaned)
                            continue;
                        if (!rawCleaned.trim()) {
                            if (lineStr.length > 0 && !lineStr.endsWith(' '))
                                lineStr += ' ';
                            if (it.w > 0)
                                lastEndX = it.x + it.w;
                            continue;
                        }
                        const cleanedItemStr = fixBrokenHindiText(rawCleaned);
                        if (!cleanedItemStr)
                            continue;
                        if (/(?:^|\s|\|)(?:हल|व्याख्या|Solution)\s*[ः:\-\/]/i.test(cleanedItemStr)) {
                            seenSolutionInRow = true;
                        }
                        if (lastEndX !== null) {
                            const gap = it.x - lastEndX;
                            const prevChar = lineStr.slice(-1);
                            const nextChar = cleanedItemStr.charAt(0);
                            const isMatraOrHalant = /[\u0901-\u0903\u093C\u093E-\u094D]/.test(nextChar) || prevChar === '\u094D';
                            const isInsideOptionParen = (prevChar === '(' && /^[A-Da-d1-4अ-द]$/.test(cleanedItemStr)) ||
                                (/^\([A-Da-d1-4अ-द]$/.test(lineStr.slice(-2)) && nextChar === ')');
                            const spaceThreshold = Math.max(1.8, it.fontSize * 0.18);
                            if (!isMatraOrHalant && !isInsideOptionParen && gap > spaceThreshold && !lineStr.endsWith(' ') && !cleanedItemStr.startsWith(' ')) {
                                lineStr += ' ';
                            }
                        }
                        const startOffset = lineStr.length;
                        lineStr += cleanedItemStr;
                        const endOffset = lineStr.length;
                        let itemTag = '';
                        if (!seenSolutionInRow && imgData && !/^Ans$/i.test(cleanedItemStr.trim())) {
                            const canCheckLeftIcon = (cIdx === 0 || (lastEndX !== null && (it.x - lastEndX) > 16)) &&
                                /^(?:Ans\s*)?(?:\(\s*[A-Da-d1-4]\s*\)|[1-4A-Da-d]\s*[\.\)])/i.test(cleanedItemStr.trim());
                            itemTag = detectItemColorTag(it, canCheckLeftIcon);
                        }
                        itemSpans.push({ startOffset, endOffset, itemTag });
                        lastEndX = it.x + Math.max(0, it.w);
                    }
                    lineStr = lineStr.replace(/[ \t]{2,}/g, ' ').trim();
                    if (!lineStr)
                        continue;
                    if (!seenSolutionInRow && !/^(?:हल|व्याख्या|Solution)\b/i.test(lineStr) && itemSpans.some(sp => sp.itemTag)) {
                        const optMarkerRe = /(?:\(\s*[A-Da-d1-4अ-द\u0391\u0392]\s*\)|(?<=^|\s)[A-Da-d1-4]\s*[\.\)])/g;
                        const optMatches = [...lineStr.matchAll(optMarkerRe)];
                        if (optMatches.length > 0) {
                            let rebuiltLine = lineStr.slice(0, optMatches[0].index);
                            for (let mIdx = 0; mIdx < optMatches.length; mIdx++) {
                                const segStart = optMatches[mIdx].index;
                                const segEnd = mIdx + 1 < optMatches.length ? optMatches[mIdx + 1].index : lineStr.length;
                                const segText = lineStr.slice(segStart, segEnd).trimEnd();
                                let greenSum = 0;
                                let hasRed = false;
                                itemSpans.forEach(sp => {
                                    if (sp.endOffset > segStart && sp.startOffset < segEnd && sp.itemTag) {
                                        const gm = sp.itemTag.match(/\[GREEN_ANS:(\d+)\]/);
                                        if (gm)
                                            greenSum += parseInt(gm[1], 10);
                                        if (sp.itemTag.includes('[RED_OPT]'))
                                            hasRed = true;
                                    }
                                });
                                const segTag = greenSum > 0 ? ` [GREEN_ANS:${greenSum}]` : (hasRed ? ' [RED_OPT]' : '');
                                rebuiltLine += segText + segTag + (mIdx + 1 < optMatches.length ? ' ' : '');
                            }
                            lineStr = rebuiltLine.trim();
                        }
                        else if (!/^(?:प्र(?:श्न)?|Q(?:uestion)?)\s*[\.\-:]*\s*\d+/i.test(lineStr)) {
                            let greenSum = 0;
                            itemSpans.forEach(sp => {
                                const gm = sp.itemTag ? sp.itemTag.match(/\[GREEN_ANS:(\d+)\]/) : null;
                                if (gm)
                                    greenSum += parseInt(gm[1], 10);
                            });
                            if (greenSum >= 6) {
                                lineStr += ` [GREEN_ANS:${greenSum}]`;
                            }
                        }
                    }
                    lineStr = lineStr.replace(/^(Ans)\s*([X✗×Χ✔☑☐🟢✅]?\s*(?:\(?[1-4A-Da-d]\)?[\.\)]?))/i, '$1 $2');
                    lineStr = lineStr.replace(/^((?:Ans\s+)?[X✗×Χ✔☑☐🟢✅]?\s*(?:\([1-4A-Da-d]\)|[1-4A-Da-d][\.\)]))(\S)/i, '$1 $2');
                    pageLines.push(lineStr);
                }
                fullText += `\n${pageLines.join('\n')}\n`;
            }
            const extractedQs = parseBilingualQuestionsFromText(fullText);
            if (extractedQs.length > 0) {
                const normalizedForBox = extractedQs.map(q => ({
                    ...q,
                    questionEn: targetLangSlot === 'EN' ? (q.questionEn || q.questionHi || '') : q.questionEn,
                    questionHi: targetLangSlot === 'HI' ? fixBrokenHindiText(q.questionHi || q.questionEn || '') : q.questionHi
                }));
                if (targetLangSlot === 'EN') setRawEnglishInput(formatEnglishBoxText(normalizedForBox));
                else setRawHindiInput(formatHindiBoxText(normalizedForBox));
                const imgCount = extractedQs.filter(q => !!q.image).length;
                setMsg({
                    text: `✅ ${slotLabel} में PDF से ${extractedQs.length} प्रश्न और उनके Solutions ${imgCount > 0 ? `(साथ में ${imgCount} ग्राफ़/चित्र)` : ''} लोड हो गए हैं। नीचे जोड़ने के लिए '${targetLangSlot === 'EN' ? 'English Box के प्रश्न जोड़ें' : 'हिन्दी Box के प्रश्न जोड़ें'}' बटन दबाएँ।`,
                    type: 'success'
                });
            }
            else {
                setMsg({ text: 'PDF से प्रश्न नहीं निकल सके। कृपया टेक्स्ट कॉपी-पेस्ट का उपयोग करें।', type: 'error' });
            }
        }
        catch (err) {
            setMsg({ text: `PDF पढ़ने में त्रुटि: ${err.message}`, type: 'error' });
        }
        finally {
            setExtractingEn(false);
            setExtractingHi(false);
            setExtractStatus('');
        }
    };

    const readRichClipboardText = async () => {
        let clipText = '';
        if (navigator.clipboard && navigator.clipboard.read) {
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    const plainBlob = item.types.includes('text/plain') ? await item.getType('text/plain') : null;
                    const plainStr = plainBlob ? await plainBlob.text() : '';
                    if (item.types.includes('text/html')) {
                        const htmlBlob = await item.getType('text/html');
                        const htmlStr = await htmlBlob.text();
                        clipText = extractGreenTagsFromClipboardHtml(htmlStr, plainStr);
                    }
                    else {
                        clipText = plainStr;
                    }
                    if (clipText)
                        break;
                }
            }
            catch (readErr) {
                clipText = await navigator.clipboard.readText();
            }
        }
        else {
            clipText = await navigator.clipboard.readText();
        }
        return clipText;
    };

    const handleClipboardPasteByLang = async (targetLangSlot) => {
        try {
            const clipText = await readRichClipboardText();
            if (!clipText || !clipText.trim())
                return;
            const cleanedClip = targetLangSlot === 'HI'
                ? fixBrokenHindiText(stripRrbMetadataAndNoise(clipText))
                : stripRrbMetadataAndNoise(clipText);

                }));

                if (targetLangSlot === 'EN') {

            setMsg({ text: `✅ प्रश्न और उनके Solutions ${targetLangSlot === 'EN' ? 'English Box' : 'शुद्ध हिन्दी Box'} में पेस्ट हो गए हैं। नीचे जोड़ने के लिए 'प्रश्न जोड़ें' बटन दबाएँ।`, type: 'success' });
        }
        catch (err) { }
    };

    const handleSyncBothBoxes = async (appendMode = false) => {
        const enText = rawEnglishInput.trim();
        const hiText = rawHindiInput.trim();
        if (!enText && !hiText) {
            setMsg({ text: 'कृपया पहले English Box या शुद्ध हिन्दी Box में PDF अपलोड करें या प्रश्न पेस्ट करें।', type: 'error' });
            return;
        }
        const parsedEn = enText ? parseBilingualQuestionsFromText(enText) : [];
        const parsedHi = hiText ? parseBilingualQuestionsFromText(hiText) : [];
        const maxLen = Math.max(parsedEn.length, parsedHi.length);
        const combinedList = [];
        for (let i = 0; i < maxLen; i++) {
            const qE = parsedEn[i] || {};
            const qH = parsedHi[i] || {};
            const mergedOpts = mergeOptionArraysWithSlash(qE.options, qH.options);
            const ans = ['A', 'B', 'C', 'D'].includes(qH.answer || qE.answer) ? (qH.answer || qE.answer) : 'A';
            const qEnText = qE.questionEn || qE.questionHi || qH.questionEn || '';
            const qHiText = fixBrokenHindiText(qH.questionHi || qH.questionEn || qE.questionHi || '');
            const mergedSol = await mergeSolutionsIntoHindiEnglish(qE.solution, qH.solution, true, qEnText || qHiText, ans);
            combinedList.push({
                id: Date.now() + i + 1,

        if (appendMode) {

            setMsg({ text: `✅ दोनों बॉक्स से ${finalEnriched.length} नए प्रश्न और उनके 'Hindi / English' Solutions टेस्ट में जोड़ दिए गए हैं!`, type: 'success' });

            setMsg({ text: `✅ दोनों बॉक्स से ${finalEnriched.length} प्रश्न और उनके 'Hindi / English' Solutions सिंक हो गए हैं!`, type: 'success' });
        }

    const importQuestionsFromHtmlFile = async (file, preferredSlot = 'EN') => {
        if (!file)
            return;
        const setBusy = preferredSlot === 'HI' ? setExtractingHi : setExtractingEn;
        const slotLabel = preferredSlot === 'HI' ? 'शुद्ध हिन्दी Box' : 'English Box';
        setBusy(true);
        setExtractStatus(`${slotLabel}: HTML फ़ाइल "${file.name}" से प्रश्न, Options, Solutions और चित्र निकाले जा रहे हैं...`);
        setMsg({ text: `${slotLabel}: HTML फ़ाइल "${file.name}" को पढ़ा जा रहा है...`, type: 'info' });
        try {
            const rawHtml = await file.text();
            const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
            doc.querySelectorAll('script, style, noscript').forEach(el => el.remove());
            const hasDevanagariText = (str) => /[\u0900-\u097F]/.test(String(str || ''));
            const cleanNodeText = (el) => (el ? (el.innerText || el.textContent || '') : '').replace(/\u00a0/g, ' ').replace(/\r/g, '\n').trim();

            const extractNodeImageSrc = (node) => {
                if (!node) return '';
                const imgEl = node.querySelector('img');
                if (imgEl) {
                    const src = imgEl.getAttribute('src') || imgEl.getAttribute('data-src') || '';
                    if (src) return src.trim();
                }
                const svgEl = node.querySelector('svg');
                if (svgEl) {
                    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svgEl.outerHTML);
                }
                const rawHtmlInside = node.innerHTML || '';
                const check = extractAndStripImageFromText(rawHtmlInside);
                return check.imageSrc || '';
            };

            const candidateNodes = Array.from(doc.querySelectorAll('article.q, .q-row, .question-container, .question-card, .question, .mcq-item, [data-question], .que, .q-item'));
            const uniqueNodes = candidateNodes.filter((node, i, arr) => !arr.some((other, j) => i !== j && other.contains(node)));
            let extractedList = [];
            const optLetters = ['A', 'B', 'C', 'D'];
            for (let idx = 0; idx < uniqueNodes.length; idx++) {
                const node = uniqueNodes[idx];
                const imgSrc = extractNodeImageSrc(node);
                const stemEl = node.querySelector('.stem, .question-text, .q-text, .q-num-text, .q-title, [data-question-text]');
                let stemText = cleanNodeText(stemEl);
                if (!stemText) {
                    const clone = node.cloneNode(true);
                    clone.querySelectorAll('.opt, .options, .q-opts, .solution, .explanation, .ans-exp, .sol, .exp, [data-solution], .answer, label, input, button, img, svg').forEach(el => el.remove());
                    stemText = cleanNodeText(clone);
                }
                stemText = extractAndStripImageFromText(stemText).cleanedText;
                stemText = stemText.replace(/^(?:प्र(?:श्न)?(?:\s*क्र\.?)?\s*[\.\-:]*\s*\d+|Q(?:uestion)?\s*(?:No\.?)?\s*[\.\-:]*\s*\d+)\s*[:\.\-\)]?\s*/i, '').trim();
                let optEls = Array.from(node.querySelectorAll('.opt, .q-opts label, .options label, .option, [data-option], li'));
                if (optEls.length < 2) {
                    optEls = Array.from(node.querySelectorAll('label')).filter(l => l.querySelector('input[type="radio"]'));
                }
                const rawOptions = [];
                let detectedAns = '';
                optEls.slice(0, 4).forEach((el, oIdx) => {
                    let t = cleanNodeText(el).replace(/^(?:\(\s*[A-Da-d1-4अ-द]\s*\)|[A-Da-d1-4अ-द]\s*[\.\)\:\-])\s*/, '').trim();
                    const radio = el.querySelector('input[type="radio"]');
                    const styleStr = (el.getAttribute('style') || '').toLowerCase();
                    const isGreenStyle = /#16a34a|#15803d|#22c55e|#dcfce7|green/.test(styleStr);
                    const isCorrectMarked = el.classList.contains('correct') ||
                        el.classList.contains('right') ||
                        el.getAttribute('data-correct') === 'true' ||
                        (radio && radio.hasAttribute('checked')) ||
                        isGreenStyle ||
                        /✓|✔|🟢|✅/.test(t);
                    t = t.replace(/✓|✔|🟢|✅/g, '').trim();
                    if (isCorrectMarked && !detectedAns) {
                        detectedAns = optLetters[oIdx];
                    }
                    rawOptions.push(t);
                });
                const dataAnsAttr = node.getAttribute('data-ans') || node.getAttribute('data-answer') || '';
                if (!detectedAns && /^[A-Da-d1-4]$/.test(dataAnsAttr.trim())) {
                    const mapNum = { '1': 'A', '2': 'B', '3': 'C', '4': 'D' };
                    const up = dataAnsAttr.trim().toUpperCase();
                    detectedAns = mapNum[up] || up;
                }
                const nodeFullText = cleanNodeText(node);
                if (!detectedAns) {
                    const ansMatch = nodeFullText.match(/(?:सही\s*(?:उत्तर|विकल्प)|Correct\s*(?:Answer|Option)|Ans(?:wer)?)\s*[:\-\=]\s*\(?\s*([A-Da-d1-4])\s*\)?/i);
                    if (ansMatch) {
                        const mapNum = { '1': 'A', '2': 'B', '3': 'C', '4': 'D' };
                        const up = ansMatch[1].toUpperCase();
                        detectedAns = mapNum[up] || up;
                    }
                }
                const solEl = node.querySelector('.solution, .explanation, .ans-exp, .sol, .exp, .solution-box, .solution-text, details, [data-solution]');
                let solText = cleanNodeText(solEl);
                if (!solText) {
                    const fallbackSolMatch = nodeFullText.match(/(?:हल\s*\/\s*Solution|व्याख्या|हल|Solution|Explanation|Sol)\s*[:\-\/]\s*([\s\S]+)$/i);
                    if (fallbackSolMatch) solText = fallbackSolMatch[1].trim();
                }
                solText = solText.replace(/^(?:हल|व्याख्या|Solution|Explanation|Sol)\s*[:\-\/]?\s*/i, '').trim();

                    const splitStem = splitBilingualStem(stemText);
                    let qEn = '';
                    let qHi = '';
                    if (splitStem.en && splitStem.hi) {
                        qEn = splitStem.en;

                        qHi = fixBrokenHindiText(stemText);

                    else {

                    const finalAns = ['A', 'B', 'C', 'D'].includes(detectedAns) ? detectedAns : 'A';
                    const parsedSol = splitBilingualSolutionParts(solText);

                            ? `हल: ${parsedSol.hi}`
                            : parsedSol.en
                                ? `Solution: ${parsedSol.en}`
                                : `हल: सही उत्तर विकल्प (${finalAns}) है। / Solution: The correct answer is option (${finalAns}).`;

                    extractedList.push({
                        id: Date.now() + idx + 1,
                        section: subCategory || 'ALP PYQ 2026-27',
                        questionEn: qEn,
                        questionHi: qHi,
                        options: rawOptions,
                        answer: finalAns,
                        solution: boxSol,
                        image: imgSrc

            }
            if (extractedList.length === 0 && doc.body) {
                const bodyText = extractGreenTagsFromClipboardHtml(rawHtml, cleanNodeText(doc.body));
                const fallbackParsed = parseBilingualQuestionsFromText(bodyText);
                extractedList = fallbackParsed.map((item, idx) => {
                    const rawQ = (item.questionHi || item.questionEn || '').trim();
                    const isHi = preferredSlot === 'HI' || hasDevanagariText(rawQ);
                    return {
                        ...item,
                        id: Date.now() + idx + 1,
                        section: subCategory || 'ALP PYQ 2026-27',
                        questionEn: (item.questionEn && item.questionHi) ? item.questionEn : (isHi ? '' : rawQ),
                        questionHi: (item.questionEn && item.questionHi) ? fixBrokenHindiText(item.questionHi) : (isHi ? fixBrokenHindiText(rawQ) : ''),
                        image: item.image || ''

            }
            if (extractedList.length === 0) {

            }
            const formattedQuestions = [];
            for (let i = 0; i < extractedList.length; i++) {
                setExtractStatus(`${slotLabel}: प्रश्न ${i + 1} / ${extractedList.length} के Options, Solutions व चित्र सेट किए जा रहे हैं...`);
                const item = extractedList[i];
                const sourceOptions = (item.options || []).map(opt => String(opt || '').trim()).filter(Boolean);
                const finalAns = ['A', 'B', 'C', 'D'].includes(item.answer) ? item.answer : 'A';
                const sourceQuestion = preferredSlot === 'HI'
                    ? (item.questionHi || item.questionEn || '')
                    : (item.questionEn || item.questionHi || '');
                formattedQuestions.push({
                    ...item,
                    questionEn: preferredSlot === 'EN' ? sourceQuestion : '',
                    questionHi: preferredSlot === 'HI' ? fixBrokenHindiText(sourceQuestion) : '',
                    options: sourceOptions,
                    answer: finalAns,
                    solution: item.solution || '',
                    image: item.image || ''
                });
            }
            if (preferredSlot === 'EN') {
                setRawEnglishInput(formatEnglishBoxText(formattedQuestions));
            }
            else {
                setRawHindiInput(formatHindiBoxText(formattedQuestions));
            }

    // Clipboard se aane wale mathematical expressions ko standard LaTeX format mein sudharein.
    // Existing LaTeX delimiters ko preserve karein; sirf unwrapped equation lines ko wrap karein.
    const repairClipboardMath = (value) => {
        const superscripts = { '⁰':'0', '¹':'1', '²':'2', '³':'3', '⁴':'4', '⁵':'5', '⁶':'6', '⁷':'7', '⁸':'8', '⁹':'9', '⁻':'-' };
        const subscripts = { '₀':'0', '₁':'1', '₂':'2', '₃':'3', '₄':'4', '₅':'5', '₆':'6', '₇':'7', '₈':'8', '₉':'9', '₊':'+', '₋':'-' };
        const convertScriptDigits = (line, map, marker) => line.replace(new RegExp('([' + Object.keys(map).join('') + ']+)', 'g'), part => marker + '{' + Array.from(part).map(ch => map[ch]).join('') + '}');
        const clean = String(value || '').replace(/\r\n?/g, '\n').replace(/[\u00a0\u2007\u202f]/g, ' ');
        return clean.split('\n').map(line => {
            let text = line.trim();
            if (!text) return '';
            // Unicode mathematical symbols -> standard LaTeX tokens.
            text = text.replace(/×/g, ' \\times ').replace(/÷/g, ' \\div ')
                .replace(/≤/g, ' \\leq ').replace(/≥/g, ' \\geq ')
                .replace(/≠/g, ' \\ne ').replace(/≈/g, ' \\approx ')
                .replace(/√\s*([A-Za-z0-9]+)/g, '\\sqrt{$1}')
                .replace(/π/g, '\\pi');
            text = convertScriptDigits(text, superscripts, '^');
            text = convertScriptDigits(text, subscripts, '_');
            // A formula-only line without delimiters should be rendered as math.
            const alreadyDelimited = /\\\(|\\\[|\$\$?/.test(text);
            const bulletMatch = text.match(/^(\s*[•●▪◦‣*-]\s*|\s*\d+[.)]\s*)/);
            const listPrefix = bulletMatch ? bulletMatch[0] : '';
            const content = text.slice(listPrefix.length);
            const labelMatch = content.match(/^(.{1,90}?:\s*)(.*)$/);
            const label = labelMatch ? labelMatch[1] : '';
            const equation = (labelMatch ? labelMatch[2] : content).replace(/[;।]+$/, '');
            const looksLikeEquation = /(?:=|\\frac|\\sqrt|\\times|\\div|\\pi|\\leq|\\geq|\\approx|\\ne)/.test(equation) &&

    <!-- ==================== MOBILE INTERFACE JS (शुरू) ==================== -->
<script id="ug-mobile-interface-js">
(function () {
    // 1. मोबाइल स्क्रीन की असली ऊँचाई (Address bar के साथ) सेट करें
    function updateMobileHeight() {
        var vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--ug-vh', vh + 'px');
    }
    updateMobileHeight();
    window.addEventListener('resize', updateMobileHeight);
    window.addEventListener('orientationchange', updateMobileHeight);

    // पेज लोड होने के बाद मोबाइल इंटरफ़ेस के बटन और फ़ीचर जोड़ें
    window.addEventListener('DOMContentLoaded', function () {

        // 2. साइडबार के पीछे का काला पर्दा (Backdrop) बनाएं
        var backdrop = document.createElement('div');
        backdrop.id = 'ug-mobile-backdrop';
        document.body.appendChild(backdrop);

        // साइडबार खोलने और बंद करने का फ़ंक्शन
        function toggleMobileSidebar(forceClose) {
            var sidebar = document.querySelector('.sidebar, aside');
            if (!sidebar) return;
            if (forceClose) {
                sidebar.classList.remove('ug-mobile-open');
                backdrop.classList.remove('ug-show');
            } else {
                var isOpen = sidebar.classList.toggle('ug-mobile-open');
                backdrop.classList.toggle('ug-show', isOpen);
            }
        }

        // पर्दे पर टच करने से साइडबार बंद हो जाए
        backdrop.addEventListener('click', function () {
            toggleMobileSidebar(true);
        });

        // 3. मोबाइल के नीचे वाला ऐप बार (Bottom Navigation Bar) बनाएं
        var bottomBar = document.createElement('nav');
        bottomBar.id = 'ug-mobile-bottom-bar';
        bottomBar.setAttribute('aria-label', 'Mobile Navigation');
        bottomBar.innerHTML = '' +
            '<button type="button" id="ug-btn-menu"><span class="ug-icon">&#9776;</span><span>मेनू</span></button>' +
            '<button type="button" id="ug-btn-top"><span class="ug-icon">&#8593;</span><span>ऊपर जाएं</span></button>' +
            '<button type="button" id="ug-btn-full"><span class="ug-icon">&#9974;</span><span>फुलस्क्रीन</span></button>' +
            '<button type="button" id="ug-btn-reload"><span class="ug-icon">&#8635;</span><span>रिफ्रेश</span></button>';
        document.body.appendChild(bottomBar);

        // मेनू बटन क्लिक
        document.getElementById('ug-btn-menu').addEventListener('click', function () {
            toggleMobileSidebar(false);
        });

        // ऊपर जाएं (Scroll to Top) बटन क्लिक
        document.getElementById('ug-btn-top').addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            var scrollBox = document.querySelector('.settings-scroll-wrapper, .test-fullscreen, main');
            if (scrollBox) scrollBox.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // फुलस्क्रीन (App Mode) बटन क्लिक
        document.getElementById('ug-btn-full').addEventListener('click', function () {
            try {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            } catch (err) {
                console.warn('Fullscreen उपलब्ध नहीं है:', err);
            }
        });

        // रिफ्रेश बटन क्लिक
        document.getElementById('ug-btn-reload').addEventListener('click', function () {
            window.location.reload();
        });

        // 4. मोबाइल पर उंगली से दाएं स्वाइप (Swipe Right) करके मेनू खोलना
        var touchStartX = 0;
        var touchStartY = 0;
        document.addEventListener('touchstart', function (e) {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        document.addEventListener('touchend', function (e) {
            if (!e.changedTouches || !e.changedTouches.length) return;
            var dx = e.changedTouches[0].clientX - touchStartX;
            var dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
            // बाएं किनारे से दाएं स्वाइप करने पर साइडबार खुलेगा
            if (touchStartX < 35 && dx > 70 && dy < 50) {
                var sidebar = document.querySelector('.sidebar, aside');
                if (sidebar && !sidebar.classList.contains('ug-mobile-open')) {
                    toggleMobileSidebar(false);
                }
            }
            // बाएं स्वाइप करने पर साइडबार बंद होगा
            if (dx < -70 && dy < 50) {
                toggleMobileSidebar(true);
            }
        }, { passive: true });

        // 5. बड़ी टेबल को अपने-आप मोबाइल स्क्रॉल बॉक्स में रखें
        document.querySelectorAll('table').forEach(function (tbl) {
            if (!tbl.parentElement.classList.contains('ug-table-scroll')) {
                var wrapper = document.createElement('div');
                wrapper.className = 'ug-table-scroll';
                tbl.parentNode.insertBefore(wrapper, tbl);
                wrapper.appendChild(tbl);
            }
        });
    });
})();
</script>
<!-- ==================== MOBILE INTERFACE JS (समाप्त) ==================== -->


<!-- ==================== MOBILE SECURE LOGIN FIX (शुरू) ==================== -->
<style id="ug-mobile-login-fix-css">
    /* 1. मोबाइल में टाइप करते समय या लॉगिन पेज पर नीचे का बार छिपा दें ताकि Login बटन न दबे */
    body.ug-keyboard-open #ug-mobile-bottom-bar,
    body.ug-login-screen-active #ug-mobile-bottom-bar {
        display: none !important;
    }

    body.ug-login-screen-active {
        padding-bottom: 0 !important;
    }

    /* 2. लॉगिन बॉक्स/मॉडल हमेशा मोबाइल स्क्रीन में सही फिट रहे */
    #loginModal, .login-modal, .login-box, .login-container, .login-glass-card, [id*="login" i], [class*="login" i] {
        max-width: 100%;
        box-sizing: border-box;
    }

    /* 3. मोबाइल पर लॉगिन एरर / सहायता संदेश दिखाने का सुंदर बैनर */
    #ug-login-status-banner {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 24px);
        max-width: 440px;
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid #f43f5e;
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        z-index: 100001;
        font-family: 'Noto Sans Devanagari', sans-serif;
        font-size: 13px;
        line-height: 1.45;
        display: none;
    }
    #ug-login-status-banner .ug-lb-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 700;
        color: #fda4af;
        margin-bottom: 4px;
    }
    #ug-login-status-banner .ug-lb-close {
        background: rgba(255, 255, 255, 0.12);
        border: none;
        color: #fff;
        border-radius: 8px;
        padding: 2px 8px;
        font-size: 12px;
        cursor: pointer;
    }
    #ug-login-status-banner .ug-lb-actions {
        margin-top: 8px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    #ug-login-status-banner .ug-lb-btn {
        background: #f43f5e;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
    }
</style>

<script id="ug-mobile-login-fix-js">
(function () {
    // 0. मोबाइल पर Login पेज के दौरान ऑटो-Fullscreen को रोकें (वरना कीबोर्ड और Secure Login अटक जाते हैं)
    var isSmallTouchDevice = window.innerWidth <= 900 || ('ontouchstart' in window);
    if (isSmallTouchDevice && Element.prototype.requestFullscreen) {
        var origReqFs = Element.prototype.requestFullscreen;
        Element.prototype.requestFullscreen = function () {
            if (document.querySelector('.login-glass-wrapper')) {
                return Promise.resolve();
            }
            return origReqFs.apply(this, arguments);
        };
    }

    // 1. Mobile Private Mode / Safari में localStorage ब्लॉक होने पर साइट को क्रैश होने से बचाएं
    try {
        localStorage.setItem('__ug_test__', '1');
        localStorage.removeItem('__ug_test__');
    } catch (storageErr) {
        console.warn('Mobile Storage ब्लॉक है, मेमोरी बैकअप चालू किया गया।');
        window.__ugMemoryStore = {};
    }

    // 2. हिंदी में साफ संदेश (Banner) दिखाने का फ़ंक्शन
    function showLoginHelpBanner(title, message, showReloadBtn) {
        var banner = document.getElementById('ug-login-status-banner');
        if (!banner) {
            banner = document.createElement('div');
            banner.id = 'ug-login-status-banner';
            document.body.appendChild(banner);
        }
        var btnHtml = showReloadBtn
            ? '<div class="ug-lb-actions"><button type="button" class="ug-lb-btn" id="ug-lb-retry">पेज रिफ्रेश करके फिर से कोशिश करें</button></div>'
            : '';
        banner.innerHTML =
            '<div class="ug-lb-head"><span>&#9888; ' + title + '</span>' +
            '<button type="button" class="ug-lb-close" id="ug-lb-close-btn">बंद करें &#10005;</button></div>' +
            '<div>' + message + '</div>' + btnHtml;
        banner.style.display = 'block';

        var closeBtn = document.getElementById('ug-lb-close-btn');
        if (closeBtn) closeBtn.onclick = function () { banner.style.display = 'none'; };

        var retryBtn = document.getElementById('ug-lb-retry');
        if (retryBtn) retryBtn.onclick = function () { window.location.reload(); };
    }

    // तकनीकी Error को सरल हिंदी में बदलना ताकि पता चले लॉगिन क्यों रुका
    function translateAuthError(errText) {
        var msg = String(errText || '').toLowerCase();
        if (msg.indexOf('popup-blocked') !== -1 || msg.indexOf('popup-closed') !== -1) {
            return 'मोबाइल ब्राउज़र ने लॉगिन Popup को रोक दिया है। कृपया Popup Allow करें या Chrome ब्राउज़र में खोलें।';
        }
        if (msg.indexOf('unauthorized-domain') !== -1) {
            return 'यह वेबसाइट लिंक/IP आपके Firebase Authorized Domains में जुड़ा नहीं है।';
        }
        if (msg.indexOf('network') !== -1 || msg.indexOf('failed to fetch') !== -1 || msg.indexOf('timeout') !== -1) {
            return 'सर्वर से संपर्क नहीं हो पा रहा है। इंटरनेट चेक करें या जांचें कि कोड में localhost तो नहीं लिखा है।';
        }
        if (msg.indexOf('storage') !== -1 || msg.indexOf('cookie') !== -1) {
            return 'मोबाइल में Cookies/Storage ब्लॉक है। कृपया Incognito मोड बंद करके सामान्य Chrome में खोलें।';
        }
        return 'लॉगिन प्रक्रिया में तकनीकी रुकावट आई: ' + String(errText || 'अज्ञात त्रुटि');
    }

    // अटके हुए "Secure Login" बटन और स्पिनर को अनलॉक करने का फ़ंक्शन
    var activeLoginBtn = null;
    var activeBtnOriginalHTML = '';
    var loginWatchdogTimer = null;

    function unlockStuckLoginButton() {
        if (loginWatchdogTimer) {
            clearTimeout(loginWatchdogTimer);
            loginWatchdogTimer = null;
        }
        if (activeLoginBtn) {
            activeLoginBtn.disabled = false;
            activeLoginBtn.style.pointerEvents = 'auto';
            activeLoginBtn.style.opacity = '1';
            if (activeBtnOriginalHTML) {
                activeLoginBtn.innerHTML = activeBtnOriginalHTML;
            }
            activeLoginBtn = null;
        }
        document.querySelectorAll('.login-loader, .auth-spinner, #secureLoginLoader').forEach(function (el) {
            el.style.display = 'none';
        });
    }

    window.addEventListener('DOMContentLoaded', function () {
        // Login स्क्रीन खुली रहने पर Bottom Bar को अपने-आप छिपाएँ
        function syncLoginScreenClass() {
            var isOnLogin = !!document.querySelector('.login-glass-wrapper');
            document.body.classList.toggle('ug-login-screen-active', isOnLogin);
        }
        syncLoginScreenClass();
        var domObserver = new MutationObserver(syncLoginScreenClass);
        domObserver.observe(document.body, { childList: true, subtree: true });

        // 3. WhatsApp / Facebook / Instagram के अंदर वेबसाइट खुलने पर चेतावनी दें
        var ua = navigator.userAgent || '';
        if (/FBAN|FBAV|Instagram|WhatsApp|Line\\//i.test(ua)) {
            showLoginHelpBanner(
                'इन-ऐप ब्राउज़र में लॉगिन रुक सकता है',
                'आप यह वेबसाइट WhatsApp/Social App के अंदर चला रहे हैं। सही "Secure Login" के लिए ऊपर दाईं ओर 3 डॉट (⋮) दबाकर <b>"Open in Chrome"</b> चुनें।',
                false
            );
        }

        // 4. मोबाइल कीबोर्ड खुलने पर Bottom Bar छिपाएं ताकि Login बटन आसानी से दबे
        document.addEventListener('focusin', function (e) {
            if (e.target && /^(INPUT|TEXTAREA|SELECT)$/i.test(e.target.tagName)) {
                document.body.classList.add('ug-keyboard-open');
            }
        });
        document.addEventListener('focusout', function () {
            setTimeout(function () {
                if (!document.activeElement || !/^(INPUT|TEXTAREA|SELECT)$/i.test(document.activeElement.tagName)) {
                    document.body.classList.remove('ug-keyboard-open');
                }
            }, 150);
        });

        // 5. लॉगिन से पहले मोबाइल कीबोर्ड द्वारा जोड़ा गया फालतू Space अपने-आप हटाएं
        function trimLoginInputs(container) {
            var scope = container || document;
            scope.querySelectorAll('input[type="text"], input[type="email"], input[type="tel"]').forEach(function (inp) {
                if (typeof inp.value === 'string') {
                    inp.value = inp.value.trim();
                }
            });
        }

        // फॉर्म सबमिट या लॉगिन बटन क्लिक पर निगरानी (12 सेकंड Anti-Hang Watchdog)
        document.addEventListener('click', function (e) {
            var btn = e.target.closest('button, input[type="submit"], a');
            if (!btn) return;
            var txt = (btn.innerText || btn.value || '').toLowerCase();
            if (/login|sign in|secure|लॉगिन|प्रवेश/i.test(txt)) {
                trimLoginInputs(btn.closest('form') || document);

                if (activeLoginBtn !== btn) {
                    activeLoginBtn = btn;
                    activeBtnOriginalHTML = btn.innerHTML;
                }

                if (loginWatchdogTimer) clearTimeout(loginWatchdogTimer);
                loginWatchdogTimer = setTimeout(function () {
                    if (!document.body.contains(btn)) return;
                    var currentTxt = (btn.innerText || '').toLowerCase();
                    var hasSpinner = btn.querySelector('.fa-spin, .spinner, .animate-spin');
                    if (btn.disabled || hasSpinner || /securing|loading|checking|wait|connecting/i.test(currentTxt)) {
                        unlockStuckLoginButton();
                        showLoginHelpBanner(
                            'Secure Login में अधिक समय लग रहा है',
                            'मोबाइल नेटवर्क धीमा है या Firebase से जुड़ने में समय लग रहा है। कृपया इंटरनेट जांचें और <b>Chrome ब्राउज़र</b> में दोबारा कोशिश करें।',
                            true
                        );
                    }
                }, 12000);
            }
        }, true);

        document.addEventListener('submit', function (e) {
            trimLoginInputs(e.target);
        }, true);
    });

    // 6. मोबाइल पर छिपे हुए JS / Promise Error को पकड़ें और लॉगिन अटकने से बचाएं
    window.addEventListener('unhandledrejection', function (event) {
        if (activeLoginBtn) {
            var reason = event.reason && (event.reason.message || event.reason.code || event.reason);
            unlockStuckLoginButton();
            showLoginHelpBanner('लॉगिन पूरा नहीं हो सका', translateAuthError(reason), true);
        }
    });
})();
</script>
