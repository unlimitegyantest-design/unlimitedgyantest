    /* -----------------------------------------------------------------------
       7. STRICT ACTIVATION & COMPLETE ZERO-LEAK TEARDOWN CONTROLLER
       ----------------------------------------------------------------------- */
    function setCssEnabled(enabled) {
        var st = document.getElementById("ug-mobile-admin-app-css");
        if (st) st.disabled = !enabled;
    }

    function activateMobileAdminApp(evalInfo) {
        state.adminRoleLabel = evalInfo.roleLabel || "Admin";
        state.adminIdentity = evalInfo.identity || "Verified Admin Session";
        state.logoutTargetEl = evalInfo.logoutEl || null;

        setCssEnabled(true);
        document.documentElement.removeAttribute("data-ug-mobile-admin-paused");
        document.documentElement.setAttribute("data-ug-admin-verified", "true");
        document.documentElement.setAttribute("data-ug-mobile-admin-active", "true");
        if (document.body) document.body.setAttribute("data-ug-mobile-admin-active", "true");

        var wasActive = state.active;
        state.active = true;

        ensureShellMounted();
        applyAdminPreferences();
        applyAdminHidesSafely();
        scanLiveAdminWorkspace();
        renderDynamicChrome();

        if (!wasActive) {
            showToast("Modern Mobile Admin App सक्रिय (" + state.adminRoleLabel + ")");
        }
    }

    function deactivateMobileAdminApp(keepPausedFlag) {
        closeAllSheets(true);
        state.active = false;

        document.documentElement.removeAttribute("data-ug-mobile-admin-active");
        document.documentElement.removeAttribute("data-ug-admin-verified");
        document.documentElement.removeAttribute("data-ug-madmin-theme");
        document.documentElement.removeAttribute("data-ug-madmin-density");
        document.documentElement.removeAttribute("data-ug-madmin-subbar-collapsed");
        if (!keepPausedFlag) {
            state.pausedByAdmin = false;
            document.documentElement.removeAttribute("data-ug-mobile-admin-paused");
        }
        if (document.body) {
            document.body.removeAttribute("data-ug-mobile-admin-active");
        }

        try {
            document.querySelectorAll("[data-ug-madmin-shifted]").forEach(function (el) {
                el.removeAttribute("data-ug-madmin-shifted");
            });
        } catch (e) {}

        setCssEnabled(!!keepPausedFlag && isStrictlyMobileMode() && state.adminSessionActive);
    }

    function evaluateAndSyncLifecycle(forceScan) {
        try {
            var evalInfo = evaluateAdminSession();

            // 1. Admin-Only Restrictions (Applies ONLY when an Admin ID is logged in)
            syncAdminOnlyRestrictions(evalInfo.isAdmin);

            // 2. Locked Mobile Admin App UI (Applies ONLY when Mobile + Admin ID)
            if (!isStrictlyMobileMode() || !evalInfo.isAdmin) {
                if (state.active || state.pausedByAdmin || document.documentElement.hasAttribute("data-ug-mobile-admin-active")) {
                    deactivateMobileAdminApp(false);
                } else {
                    setCssEnabled(false);
                }
                return;
            }

            if (state.pausedByAdmin) {
                setCssEnabled(true);
                document.documentElement.setAttribute("data-ug-mobile-admin-paused", "true");
                ensureRestorePill();
                return;
            }

            if (!state.active || forceScan || !document.getElementById("ug-madmin-shell")) {
                activateMobileAdminApp(evalInfo);
            } else if (Date.now() - state.lastScanTs > 1500) {
                state.adminRoleLabel = evalInfo.roleLabel || state.adminRoleLabel;
                state.logoutTargetEl = evalInfo.logoutEl || state.logoutTargetEl;
                applyAdminHidesSafely();
                scanLiveAdminWorkspace();
                renderDynamicChrome();
            }
        } catch (err) {
            try { deactivateMobileAdminApp(false); } catch (e2) {}
        }
    }

    function scheduleEvaluation(delayMs) {
        if (state.scanTimer) clearTimeout(state.scanTimer);
        state.scanTimer = setTimeout(function () {
            evaluateAndSyncLifecycle(false);
        }, typeof delayMs === "number" ? delayMs : 200);
    }

    /* -----------------------------------------------------------------------
       8. LIFECYCLE WATCHERS (MODE CHANGES, SCROLL, MUTATIONS + STYLE GUARD)
       ----------------------------------------------------------------------- */
    function initEngineWatchers() {
        setCssEnabled(false);
        setAdminRestrictionCssEnabled(false);
        installAdminPasswordGuard();

        try {
            var htmlObs = new MutationObserver(function () {
                evaluateAndSyncLifecycle(true);
            });
            htmlObs.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ["data-ug-mode"]
            });
        } catch (e) {}

        function attachBodyObserver() {
            if (!document.body) return;
            try {
                var bodyObs = new MutationObserver(function (mutations) {
                    if (state.isApplyingRestrictions) return;
                    var externalChange = false;
                    for (var i = 0; i < mutations.length; i++) {
                        var t = mutations[i].target;
                        if (t && isInsideAppShell(t)) continue;
                        externalChange = true;
                        break;
                    }
                    if (externalChange) {
                        if (state.adminSessionActive) {
                            applyAdminHidesSafely();
                        }
                        scheduleEvaluation(200);
                    }
                });
                /* Also watch style/class changes so patches cannot re-show hidden 3-lines/tools */
                bodyObs.observe(document.body, {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    attributeFilter: ["style", "class"]
                });
            } catch (e) {}
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", function () {
                attachBodyObserver();
                scheduleEvaluation(180);
            });
        } else {
            attachBodyObserver();
            scheduleEvaluation(180);
        }

        window.addEventListener("resize", function () { scheduleEvaluation(120); });
        window.addEventListener("orientationchange", function () { scheduleEvaluation(160); });
        window.addEventListener("online", function () { if (state.active) renderDynamicChrome(); });
        window.addEventListener("offline", function () { if (state.active) renderDynamicChrome(); });

        window.addEventListener("scroll", function () {
            if (!state.active) return;
            var btn = document.getElementById("ug-madmin-scrolltop");
            if (btn) {
                var y = window.scrollY || document.documentElement.scrollTop || 0;
                btn.classList.toggle("is-visible", y > 260);
            }
        }, { passive: true });

        setInterval(function () {
            evaluateAndSyncLifecycle(false);
        }, 900);
    }

    initEngineWatchers();
})();
</script>

        min-width: 0 !important;

    #ug-mintro-bottomdock {

    html[data-ug-mode="mobile"][data-ug-modern-test="true"] #root {

    function readPref(k, fb) {

    function isVisible(el, allowMutedBar) {
        if (!el || el.nodeType !== 1 || isOwnUi(el)) return false;
        if (el.getAttribute("data-ug-perm-hidden") || el.getAttribute("data-ug-admin-hidden")) return false;
        if (allowMutedBar && (el.getAttribute("data-ug-mt-muted-bar") === "true" || el.getAttribute("data-ug-mi-muted-bar") === "true" ||
            (el.closest && (el.closest('[data-ug-mt-muted-bar="true"]') || el.closest('[data-ug-mi-muted-bar="true"]'))))) {

        try {
            var st = window.getComputedStyle(el);
            if (!st || st.display === "none" || st.visibility === "hidden" || parseFloat(st.opacity) === 0) return false;
            var r = el.getBoundingClientRect();

        } catch (e) {
            return false;
        }
    }

    function isLoaderOrLoginActive() {
        var loader = document.getElementById("ug-cloud-loader-ui");
        if (loader && isVisible(loader)) return true;
        var pwds = document.querySelectorAll('input[type="password"]');
        for (var i = 0; i < pwds.length; i++) {
            if (!isVisible(pwds[i])) continue;
            var wrap = pwds[i].closest("form, [role='dialog'], section, div");
            var txt = clean(wrap ? wrap.textContent : "").toLowerCase();
            if (/(student\s*login|admin\s*login|user\s*login|sign\s*in|लॉगिन)/i.test(txt)) return true;
        }
        return false;
    }

    function formatStopwatch(sec) {
        var s = Math.max(0, Math.floor(sec || 0));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
    }

    /* -----------------------------------------------------------------------
       1. SMART CONTEXT DETECTOR (INSTRUCTIONS vs LIVE TEST vs DUAL-BOX vs PYQ)
       ----------------------------------------------------------------------- */
    function detectMobileContext() {
        var root = document.getElementById("root") || document.body;
        if (!root || isLoaderOrLoginActive()) return "idle";

        var visibleText = clean(root.innerText || "").slice(0, 11000);
        if (!visibleText) return "idle";

        var visibleTextareas = Array.from(root.querySelectorAll("textarea")).filter(function (el) { return isVisible(el); });
        var isAdminAuthoring = /(add\s*question|edit\s*question|question\s*bank|bulk\s*upload|create\s*new\s*test|cloud\s*uploader)/i.test(visibleText) && visibleTextareas.length >= 1;

        /* Inspect ACTUAL interactive buttons (so explanatory instruction paragraphs
           mentioning "Save & Next" or "Mark for Review" NEVER falsely trigger live_test!) */
        var allBtns = root.querySelectorAll("button, a, [role='button'], input[type='submit'], input[type='button']");
        var hasSaveNextBtn = false;
        var hasMarkReviewBtn = false;
        var hasClearRespBtn = false;
        var hasSubmitTestBtn = false;
        var hasIntroProceedBtn = false;
        var paletteBtnCount = 0;

        for (var bi = 0; bi < allBtns.length; bi++) {
            var bEl = allBtns[bi];
            if (!isVisible(bEl, true)) continue;
            var bLbl = clean(bEl.innerText || bEl.textContent || bEl.value || bEl.getAttribute("aria-label") || "");
            if (!bLbl || bLbl.length > 60) continue;
            if (/^\d{1,3}$/.test(bLbl)) { paletteBtnCount++; continue; }
            if (/(save\s*&\s*next|save\s*and\s*next|सेव\s*और\s*नेक्स्ट|save\s*&\s*continue|next\s*question)/i.test(bLbl)) hasSaveNextBtn = true;
            if (/(mark\s*for\s*review|review\s*&\s*next|^review$|रिव्यू\s*के\s*लिए)/i.test(bLbl)) hasMarkReviewBtn = true;
            if (/(clear\s*response|clear\s*answer|उत्तर\s*हटाएं|रिस्पॉन्स\s*हटाएं)/i.test(bLbl)) hasClearRespBtn = true;
            if (/(submit\s*test|submit\s*exam|final\s*submit|end\s*test|टेस्ट\s*सबमिट|फाइनल\s*सबमिट)/i.test(bLbl)) hasSubmitTestBtn = true;
            if (/(i\s*am\s*ready\s*to\s*begin|ready\s*to\s*begin|agree\s*(?:&|and)\s*continue|agree\s*(?:&|and)\s*start|start\s*(?:the\s*)?(?:test|exam)|begin\s*(?:the\s*)?(?:test|exam)|proceed\s*to\s*test|^proceed$|^next$|continue\s*to\s*test|मैं\s*शुरू\s*करने\s*के\s*लिए\s*तैयार|टेस्ट\s*शुरू\s*करें|परीक्षा\s*शुरू\s*करें|आगे\s*बढ़ें)/i.test(bLbl)) {
                hasIntroProceedBtn = true;
            }
        }

        var hasRadioOptions = root.querySelectorAll('input[type="radio"]').length >= 2;
        var visibleCheckboxes = Array.from(root.querySelectorAll('input[type="checkbox"]')).filter(function (cb) { return isVisible(cb, true); });
        var isResultScreen = /(score\s*card|your\s*score|result\s*summary|accuracy|rank\s*card|re-?attempt|view\s*solution|आपका\s*स्कोर)/i.test(visibleText) && !hasSaveNextBtn && !hasClearRespBtn;

        /* --- Check 0: Test Introduction / General Instructions Screen (BEFORE Live Test!) --- */
        var introScore = 0;
        var hasIntroHeading = /(general\s*instructions|test\s*instructions|exam\s*instructions|other\s*important\s*instructions|important\s*instructions|please\s*read\s*(?:the\s*)?(?:following\s*)?instructions|read\s*the\s*instructions\s*carefully|सामान्य\s*निर्देश|परीक्षा\s*निर्देश|महत्वपूर्ण\s*निर्देश|कृपया\s*(?:सभी\s*)?निर्देश\s*पढ़ें)/i.test(visibleText);
        var hasDeclarationText = /(i\s*have\s*read\s*and\s*understood|i\s*agree\s*to\s*(?:the\s*)?(?:instructions|terms)|default\s*language|choose\s*your\s*default\s*language|declaration|all\s*the\s*computer\s*hardware|मैंने\s*(?:सभी\s*)?निर्देश\s*पढ़|डिफ़ॉल्ट\s*भाषा|अपनी\s*भाषा\s*चुनें)/i.test(visibleText);
        var hasLegendExplain = /(you\s*have\s*not\s*visited\s*the\s*question|you\s*have\s*not\s*answered\s*the\s*question|you\s*have\s*answered\s*the\s*question|marked\s*for\s*review\s*will\s*be\s*considered|आपने\s*अभी\s*तक\s*प्रश्न\s*नहीं\s*देखा)/i.test(visibleText);
        var isDefinitelyInLiveExam = hasSaveNextBtn && (hasRadioOptions || paletteBtnCount >= 4 || hasClearRespBtn || hasMarkReviewBtn);

        if (hasIntroHeading) introScore += 2.5;
        if (hasDeclarationText) introScore += 2.0;
        if (hasLegendExplain) introScore += 2.0;
        if (hasIntroProceedBtn) introScore += 1.5;
        if (visibleCheckboxes.length >= 1 && (hasIntroHeading || hasDeclarationText)) introScore += 1.5;

        if (introScore >= 3.5 && !isDefinitelyInLiveExam && !isAdminAuthoring && !isResultScreen && visibleTextareas.length === 0) {
            return "instructions";
        }

        /* --- Check A: Live Exam Taking Screen (Actual Exam Controls Present) --- */
        var examSignals = 0;
        var hasTimer = /\b\d{1,2}:\d{2}(?::\d{2})?\b/.test(visibleText);
        var hasQNum = /(?:^|\s)(?:q\.?\s*\d+|question\s*\d+|प्रश्न\s*\d+)(?:\s*(?:of|\/)\s*\d+)?/i.test(visibleText);

        if (hasSaveNextBtn) examSignals += 2.5;
        if (hasMarkReviewBtn) examSignals += 1.5;
        if (hasSubmitTestBtn) examSignals += 1.5;
        if (hasClearRespBtn) examSignals += 1.5;
        if (hasTimer) examSignals += 1;
        if (hasQNum) examSignals += 1;
        if (hasRadioOptions) examSignals += 1.5;
        if (paletteBtnCount >= 5) examSignals += 1.5;

        var threshold = (Date.now() < state.attemptBoostUntil) ? 3.5 : 4.0;
        if (examSignals >= threshold && !isAdminAuthoring && !isResultScreen) {
            return "live_test";
        }

        /* --- Check B: Test Generator Simulator (Dual Box PDF & Copy-Paste) --- */
        var genHeaderRx = /(test\s*generator|dual\s*box|pdf\s*&\s*copy[\s-]*paste|copy[\s-]*paste\s*test|pdf\s*to\s*test|टेस्ट\s*जनरेटर|डुअल\s*बॉक्स|कॉपी[\s-]*पेस्ट)/i;
        var genActionRx = /(generate\s*test|start\s*generated|create\s*mock|parse\s*questions|extract\s*pdf|convert\s*to\s*test|टेस्ट\s*बनाएं|टेस्ट\s*शुरू\s*करें)/i;
        var pdfInputs = Array.from(root.querySelectorAll('input[type="file"]')).filter(function (inp) {
            var acc = String(inp.getAttribute("accept") || "").toLowerCase();
            var sig = (String(inp.id || "") + " " + String(inp.className || "") + " " + String(inp.name || "")).toLowerCase();
            return acc.indexOf("pdf") !== -1 || /pdf|file|doc|upload/.test(sig);

        if (genHeaderRx.test(visibleText) && (visibleTextareas.length >= 1 || pdfInputs.length >= 1)) {
            return "dual_gen";
        }
        if (visibleTextareas.length >= 2 && (genActionRx.test(visibleText) || pdfInputs.length >= 1) && !/(admin\s*settings|firebase\s*config|cloud\s*uploader)/i.test(visibleText)) {

        /* --- Check C: RRB PYQ TEST Catalog / Test List --- */
        if (/(rrb\s*pyq|pyq\s*test|rrb\s*(?:alp|ntpc|group\s*d|je|rpf|technician)|previous\s*year\s*(?:paper|test|question)|प्रीवियस\s*ईयर)/i.test(visibleText)) {
            return "pyq_list";

    /* -----------------------------------------------------------------------

    function clearMutedBars() {

                "data-ug-mt-viewport",

    /* -----------------------------------------------------------------------
       2A. TESTBOOK INSTRUCTIONS SCREEN SCANNER & NON-DESTRUCTIVE TAGGER
       ----------------------------------------------------------------------- */
    function scanAndTagIntroScreen() {
        var root = document.getElementById("root") || document.body;
        if (!root) return;

        var refs = state.refs;
        refs.introBackBtn = null;
        refs.introProceedBtn = null;
        refs.introProceedLabel = "Agree & Continue";
        refs.introCheckbox = null;
        refs.introLangSelect = null;
        refs.introLangBtns = [];

        var snippet = clean(root.innerText || "").slice(0, 6500);

        /* 1. Extract Exam Title & Metadata (Questions, Duration, Marks) */
        state.introMeta.title = "General Instructions";
        var headings = root.querySelectorAll("h1, h2, h3, header span, header div");
        for (var h = 0; h < Math.min(headings.length, 45); h++) {
            var hel = headings[h];
            if (!isVisible(hel, true)) continue;
            var ht = clean(hel.textContent || "");
            if (ht.length >= 4 && ht.length <= 75) {
                if (/(rrb|pyq|alp|ntpc|group\s*d|rpf|je|cbt|mock|test|paper|shift|set|exam|टेस्ट|परीक्षा)/i.test(ht) &&

                    state.introMeta.title = ht;

        var qm = snippet.match(/(?:total\s*)?(?:questions?|प्रश्नों?|प्रश्न)\s*[:\-–]?\s*(\d{1,3})\b|\b(\d{1,3})\s*(?:questions?|qs|प्रश्न)\b/i);
        var dm = snippet.match(/(?:duration|time|समय)\s*[:\-–]?\s*(\d{1,3})\s*(?:mins?|minutes?|मिनट)|\b(\d{1,3})\s*(?:mins?|minutes?|मिनट)\b/i);
        var mm = snippet.match(/(?:max(?:imum)?\s*marks?|total\s*marks?|अधिकतम\s*अंक|कुल\s*अंक)\s*[:\-–]?\s*(\d{1,3}(?:\.\d+)?)\b|\b(\d{1,3})\s*(?:marks?|अंक)\b/i);

        state.introMeta.questions = qm ? ((qm[1] || qm[2]) + " Qs") : "";
        state.introMeta.duration = dm ? ((dm[1] || dm[2]) + " Mins") : "";
        state.introMeta.marks = mm ? ((mm[1] || mm[2]) + " Marks") : "";

        /* 2. Find Declaration Checkbox */
        var cbs = root.querySelectorAll('input[type="checkbox"]');
        for (var c = 0; c < cbs.length; c++) {
            var cb = cbs[c];
            if (!isVisible(cb, true)) continue;
            refs.introCheckbox = cb;
            var lblWrap = cb.closest("label") || cb.parentElement;
            var cTxt = clean(lblWrap ? lblWrap.textContent : "");
            if (cTxt && cTxt.length >= 12 && cTxt.length <= 240) {
                state.introMeta.consentText = cTxt;
            }
            break;
        }

        /* 3. Find Default Language Select or Language Buttons */
        var selects = root.querySelectorAll("select");
        for (var s = 0; s < selects.length; s++) {
            var sel = selects[s];
            if (!isVisible(sel, true)) continue;
            var optTxt = clean(sel.textContent || "");
            if (/(english|hindi|हिंदी|हिन्दी|language|भाषा)/i.test(optTxt) || /(lang|language)/i.test(String(sel.id || "") + " " + String(sel.name || ""))) {
                refs.introLangSelect = sel;
                break;
            }
        }

        /* 4. Find Back Button, Language Buttons & Primary Proceed / Ready / Start Test Button */
        var btns = root.querySelectorAll("button, a, [role='button'], input[type='submit'], input[type='button']");
        var bestProceedScore = 0;
        for (var b = 0; b < btns.length; b++) {
            var btn = btns[b];
            if (!isVisible(btn, true)) continue;
            var lbl = clean(btn.innerText || btn.textContent || btn.value || btn.getAttribute("aria-label") || "");

            }

            if (/^(?:english|hindi|हिंदी|हिन्दी|bilingual|en|hi)$/i.test(lbl)) {
                refs.introLangBtns.push({ label: lbl, el: btn });
                continue;
            }

            var pScore = 0;
            if (/(i\s*am\s*ready\s*to\s*begin|ready\s*to\s*begin|agree\s*(?:&|and)\s*continue|agree\s*(?:&|and)\s*start|मैं\s*शुरू\s*करने\s*के\s*लिए\s*तैयार)/i.test(lbl)) {
                pScore = 4;
            } else if (/(start\s*(?:the\s*)?(?:test|exam)|begin\s*(?:the\s*)?(?:test|exam)|proceed\s*to\s*test|continue\s*to\s*test|टेस्ट\s*शुरू\s*करें|परीक्षा\s*शुरू\s*करें)/i.test(lbl)) {
                pScore = 3;
            } else if (/(^proceed$|^continue$|^next$|आगे\s*बढ़ें|शुरू\s*करें)/i.test(lbl)) {
                pScore = 2;
            }

            if (pScore > bestProceedScore) {
                bestProceedScore = pScore;
                refs.introProceedBtn = btn;
                refs.introProceedLabel = lbl;
            }
        }

        /* 5. Detect if Instructions live inside a fixed modal overlay or rigid desktop wrapper
              and reflow every ancestor so 100% of instructions fit inside the mobile screen */
        var anchorEl = root.querySelector("ul, ol, table") || refs.introProceedBtn || refs.introCheckbox || root.querySelector("h1, h2, h3");
        if (anchorEl) {
            var cur = anchorEl.parentElement;
            var depth = 0;
            var foundFixedScroll = false;
            var vw = window.innerWidth || document.documentElement.clientWidth || 375;
            while (cur && cur !== document.body && cur !== document.documentElement && depth < 12) {
                depth++;

                    if (!foundFixedScroll && st.position === "fixed" && (rect.height >= window.innerHeight * 0.55 || cur.scrollHeight > window.innerHeight * 0.55)) {
                        cur.setAttribute("data-ug-mi-scrollbox", "true");
                        foundFixedScroll = true;
                    } else if (
                        st.overflow === "hidden" || st.overflowY === "hidden" ||
                        rect.width > vw + 2 || cur.scrollWidth > vw + 2 ||
                        (st.display === "flex" && st.flexDirection === "row" && rect.width >= vw * 0.8) ||
                        (st.display === "grid" && (st.gridTemplateColumns || "").split(" ").length > 1)

                    }
                } catch (e) {}

            }

        /* 6. Safely tuck away duplicate raw top header and bottom action/checkbox bar while keeping React controls live */
        if (refs.introBackBtn) {
            var topBar = refs.introBackBtn.closest("header, nav") || refs.introBackBtn.parentElement;
            if (topBar && topBar !== root && topBar !== document.body &&
                !topBar.querySelector("ul, ol, table") &&
                clean(topBar.textContent || "").length <= 180) {
                topBar.setAttribute("data-ug-mi-muted-bar", "true");
            }
        }
        if (refs.introProceedBtn) {
            var footerRow = refs.introProceedBtn.parentElement;
            if (footerRow && footerRow !== root && footerRow !== document.body &&
                !footerRow.querySelector("ul, ol, table") &&
                clean(footerRow.textContent || "").length <= 260) {
                var outerFooter = footerRow.parentElement;
                if (outerFooter && outerFooter !== root && outerFooter !== document.body &&
                    !outerFooter.querySelector("ul, ol, table") &&
                    clean(outerFooter.textContent || "").length <= 320 &&
                    ((refs.introCheckbox && outerFooter.contains(refs.introCheckbox)) ||
                     (refs.introLangSelect && outerFooter.contains(refs.introLangSelect)))) {
                    outerFooter.setAttribute("data-ug-mi-muted-bar", "true");
                } else {
                    footerRow.setAttribute("data-ug-mi-muted-bar", "true");
                }
            }
        }
        if (refs.introCheckbox) {
            var cbRow = refs.introCheckbox.closest("label, div");
            if (cbRow && cbRow !== root && cbRow !== document.body &&
                !cbRow.querySelector("ul, ol, table") &&
                clean(cbRow.textContent || "").length <= 260) {
                cbRow.setAttribute("data-ug-mi-muted-bar", "true");
            }
        }

        /* 7. Polish main instruction content container as a crisp Testbook card */
        var listEl = root.querySelector("ul, ol");
        if (listEl && isVisible(listEl)) {
            var card = listEl.closest("section, article, main, [class*='card' i], [class*='rounded'], div");
            if (card && card !== root && card !== document.body && !card.getAttribute("data-ug-mi-scrollbox")) {
                card.setAttribute("data-ug-mi-card", "true");
            }
        }
    }

    function safeScanIntroScreen() {
        var prevGuard = state.isMutatingOwnDom;
        state.isMutatingOwnDom = true;
        try {
            scanAndTagIntroScreen();
        } catch (e) {
        } finally {
            state.isMutatingOwnDom = prevGuard;
        }
    }

    function classifyPaletteStatus(btnEl, num) {
        if (!btnEl) return { status: "notvisited", isCurrent: false };
        var cls = (String(btnEl.className || "") + " " + String(btnEl.getAttribute("data-status") || "")).toLowerCase();
        var bg = "";
        try { bg = String(window.getComputedStyle(btnEl).backgroundColor || "").toLowerCase(); } catch (e) {}

        var status = "notvisited";
        if (/(purple|violet|review|marked)/.test(cls) || /rgb\(\s*(?:1[2-6]\d|9[0-9]|10\d),\s*(?:4\d|5\d|6\d|7\d|8\d|9\d),\s*(?:2\d\d|1[89]\d)/.test(bg)) {
            status = "review";
        } else if (/(green|emerald|answered|bg-teal)/.test(cls) || /rgb\(\s*(?:[0-4]\d),\s*(?:1[4-9]\d|2\d\d),\s*(?:[6-9]\d|1[0-4]\d)/.test(bg)) {
            status = "answered";
        } else if (/(red|rose|orange|amber|not-?answered|visited)/.test(cls) || /rgb\(\s*(?:2[0-5]\d|19\d),\s*(?:[3-9]\d|1[0-4]\d),\s*(?:[2-9]\d)/.test(bg)) {
            status = "notans";
        }
        return {
            status: status,
            isCurrent: num === state.currentQ || /(ring-|scale-105|current|active|border-blue|border-indigo|border-cyan)/.test(cls)
        };
    }

    function scanAndTagLiveTest() {
        var root = document.getElementById("root") || document.body;
        if (!root) return;

        clearLiveTestLayoutTags();

        var refs = state.refs;
        refs.prevBtn = null;
        refs.nextBtn = null;
        refs.reviewBtn = null;
        refs.clearBtn = null;
        refs.submitBtn = null;
        refs.langBtn = null;
        refs.timerEl = null;
        refs.paletteBtns = [];
        refs.subjectBtns = [];

        var visibleTxt = clean(root.innerText || "").slice(0, 8000);
        var vw = window.innerWidth || document.documentElement.clientWidth || 375;

        /* 1. Extract Test Title */
        var headings = root.querySelectorAll("h1, h2, h3, header span, header div");
        for (var h = 0; h < Math.min(headings.length, 40); h++) {
            var hel = headings[h];
            if (!isVisible(hel, true)) continue;
            var ht = clean(hel.textContent || "");
            if (ht.length >= 4 && ht.length <= 70 && !/^\d{1,2}:\d{2}/.test(ht) &&
                /(rrb|pyq|alp|ntpc|group\s*d|rpf|je|cbt|mock|test|paper|shift|set|exam|टेस्ट|परीक्षा)/i.test(ht)) {
                state.testTitle = ht;
                break;
            }
        }

        /* 2. Extract Live Countdown Timer Element */
        var timeNodes = root.querySelectorAll("time, span, div, p, b, strong");
        for (var t = 0; t < Math.min(timeNodes.length, 220); t++) {
            var tel = timeNodes[t];
            if (!isVisible(tel, true) || tel.children.length > 2) continue;
            var tt = clean(tel.textContent || "");
            if (tt.length >= 4 && tt.length <= 24 && /\b\d{1,2}:\d{2}(?::\d{2})?\b/.test(tt)) {

            }
        }

        var posMatch = visibleTxt.match(/\+(\d(?:\.\d+)?)\b/);
        var negMatch = visibleTxt.match(/-(\d(?:\.\d+)?)\b/);
        if (posMatch) state.marksPos = "+" + posMatch[1];
        if (negMatch) state.marksNeg = "-" + negMatch[1];

        /* 4. Discover Real Exam Navigation, Action, Subject & Palette Buttons */
        var btns = root.querySelectorAll("button, a, [role='button']");
        var seenPaletteNums = {};
        var seenSubj = {};

        for (var i = 0; i < btns.length; i++) {
            var b = btns[i];
            if (!isVisible(b, true)) continue;
            var lbl = clean(b.innerText || b.textContent || b.getAttribute("aria-label") || "");
            if (!lbl || lbl.length > 52) continue;

            if (/^\d{1,3}$/.test(lbl)) {

                if (qNum >= 1 && qNum <= 300 && !seenPaletteNums[qNum]) {

                }
                continue;
            }

            if (!refs.nextBtn && /(save\s*&\s*next|save\s*and\s*next|सेव\s*और\s*नेक्स्ट|save\s*&\s*continue|next\s*question|^next$)/i.test(lbl)) {
                refs.nextBtn = b;
            } else if (!refs.prevBtn && /(^prev$|^previous$|prev\s*question|previous\s*question|पिछला|प्रीवियस)/i.test(lbl)) {
                refs.prevBtn = b;
            } else if (!refs.reviewBtn && /(mark\s*for\s*review|review\s*&\s*next|^review$|unmark|रिव्यू)/i.test(lbl)) {
                refs.reviewBtn = b;
            } else if (!refs.clearBtn && /(clear\s*response|clear\s*answer|^clear$|उत्तर\s*हटाएं|रिस्पॉन्स\s*हटाएं)/i.test(lbl)) {
                refs.clearBtn = b;
            } else if (!refs.submitBtn && /(submit\s*test|submit\s*exam|final\s*submit|end\s*test|^submit$|टेस्ट\s*सबमिट|फाइनल\s*सबमिट)/i.test(lbl)) {
                refs.submitBtn = b;
            } else if (!refs.langBtn && /^(?:en\s*\/\s*hi|en\s*\/\s*हिं|english|hindi|हिंदी|हिन्दी|language|भाषा|bilingual)$/i.test(lbl)) {
                refs.langBtn = b;
            } else if (lbl.length >= 3 && lbl.length <= 28 &&
                /(math|maths|reasoning|science|general|gk|ga|awareness|current|physics|chemistry|biology|computer|english|hindi|technical|trade|aptitude|part\s*[a-d]|section\s*[a-d1-4]|गणित|रीजनिंग|विज्ञान|सामान्य)/i.test(lbl) &&
                !seenSubj[lbl.toLowerCase()]) {
                seenSubj[lbl.toLowerCase()] = true;
                refs.subjectBtns.push({ label: lbl, el: b });
            }
        }

        refs.paletteBtns.sort(function (a, c) { return a.num - c.num; });

        /* 5. Extract Current Question Number & Total Questions */
        var qPair = visibleTxt.match(/(?:q\.?\s*|question\s*|प्रश्न\s*)(\d{1,3})\s*(?:of|\/)\s*(\d{1,3})/i);
        var qSingle = visibleTxt.match(/(?:^|\s)(?:q\.?\s*|question\s*|प्रश्न\s*)(\d{1,3})\b/i);
        var detectedQ = qPair ? parseInt(qPair[1], 10) : (qSingle ? parseInt(qSingle[1], 10) : state.currentQ);
        var detectedTotal = qPair ? parseInt(qPair[2], 10) : Math.max(state.totalQ, refs.paletteBtns.length);

        if (refs.paletteBtns.length > detectedTotal) detectedTotal = refs.paletteBtns.length;
        if (detectedQ >= 1) state.currentQ = detectedQ;
        if (detectedTotal >= 1) state.totalQ = detectedTotal;

        if (state.currentQ !== state.lastTrackedQ) {
            var hadPrevQ = state.lastTrackedQ > 0;
            state.lastTrackedQ = state.currentQ;
            state.qStartedAt = Date.now();
            if (hadPrevQ) scrollActiveTestViewportTop();
        }

        /* 6. Non-destructive Testbook Card & Option Styling Tags (supports both Radio & Button/Card MCQs) */
        var primaryAnchor = null;
        var radios = root.querySelectorAll('input[type="radio"]');
        for (var r = 0; r < radios.length; r++) {
            var rad = radios[r];
            if (isInsideDialog(rad)) continue;
            var optWrap = rad.closest("label, button, li, div");
            if (optWrap && optWrap !== root && optWrap !== document.body && clean(optWrap.textContent || "").length <= 360) {
                optWrap.setAttribute("data-ug-mt-option", "true");
                if (!primaryAnchor) primaryAnchor = optWrap;
                if (rad.checked) optWrap.setAttribute("data-ug-mt-option-selected", "true");
                else optWrap.removeAttribute("data-ug-mt-option-selected");
            }
        }

        /* Fallback MCQ option detection for button/div options without <input type="radio"> */
        if (!primaryAnchor) {
            var optCandidates = root.querySelectorAll("button, [role='radio'], [role='option'], label");
            var matchedOpts = [];
            for (var oc = 0; oc < Math.min(optCandidates.length, 160); oc++) {
                var oel = optCandidates[oc];
                if (!isVisible(oel) || isInsideDialog(oel)) continue;
                if (oel === refs.prevBtn || oel === refs.nextBtn || oel === refs.reviewBtn || oel === refs.clearBtn || oel === refs.submitBtn || oel === refs.langBtn) continue;
                var ot = clean(oel.textContent || "");
                if (!ot || ot.length < 2 || ot.length > 320 || /^\d{1,3}$/.test(ot)) continue;
                if (/^(?:\(?[A-D1-4]\)?[\.\):\s]\s*\S)/i.test(ot) && !/(save\s*&|mark\s*for|submit|clear|previous|next|answered|visited|review)/i.test(ot)) {
                    matchedOpts.push(oel);
                }
            }
            if (matchedOpts.length >= 2 && matchedOpts.length <= 6) {
                for (var mo = 0; mo < matchedOpts.length; mo++) {
                    var mel = matchedOpts[mo];
                    mel.setAttribute("data-ug-mt-option", "true");
                    var mCls = String(mel.className || "").toLowerCase();
                    if (mel.getAttribute("aria-checked") === "true" || mel.getAttribute("aria-pressed") === "true" ||

                }

        }

        /* Tag primary question statement container */
        var qCardEl = null;
        var qNodes = root.querySelectorAll("p, h2, h3, h4, div");
        for (var q = 0; q < Math.min(qNodes.length, 180); q++) {
            var qn = qNodes[q];
            if (!isVisible(qn) || isInsideDialog(qn) || qn.getAttribute("data-ug-mt-option") === "true") continue;
            if (qn.querySelector('input[type="radio"]')) continue;
            var qt = clean(qn.textContent || "");
            if (qt.length >= 16 && qt.length <= 950 && /^(?:q\.?\s*\d+|question\s*\d+|प्रश्न\s*\d+|\d{1,3}[\.\)])/i.test(qt)) {
                var qCard = qn.closest("article, section, [class*='card' i], [class*='rounded'], div") || qn;
                if (qCard && qCard !== root && qCard !== document.body && !qCard.querySelector('input[type="radio"]') && !qCard.querySelector('[data-ug-mt-option="true"]')) {
                    qCard.setAttribute("data-ug-mt-qcard", "true");
                    qCardEl = qCard;
                } else {
                    qn.setAttribute("data-ug-mt-qcard", "true");
                    qCardEl = qn;
                }

                break;
            }

        /* 7. Safely tuck Desktop Right Palette Sidebar on Mobile (reclaims 100% mobile width
              while keeping all real palette buttons mounted, styled, and clickable!) */
        if (refs.paletteBtns.length >= 5) {
            var palBox = refs.paletteBtns[0].el.parentElement;
            var bestPalSidebar = null;
            var pDepth = 0;
            while (palBox && palBox !== root && palBox !== document.body && pDepth < 9) {
                pDepth++;
                var containsExamContent = (primaryAnchor && palBox.contains(primaryAnchor)) ||
                    (qCardEl && palBox.contains(qCardEl)) ||
                    !!palBox.querySelector('input[type="radio"], [data-ug-mt-option="true"], [data-ug-mt-qcard="true"], [role="dialog"]');
                if (containsExamContent) break;
                if (palBox.contains(refs.paletteBtns[Math.min(4, refs.paletteBtns.length - 1)].el)) {
                    bestPalSidebar = palBox;
                }

            }

        if (refs.timerEl && !isInsideDialog(refs.timerEl)) {
            var hdr = refs.timerEl.closest("header, nav");
            if (!hdr) {
                var hWalk = refs.timerEl.parentElement;
                var hStep = 0;
                while (hWalk && hWalk !== root && hWalk !== document.body && hStep < 5) {
                    hStep++;
                    var hContainsQ = (primaryAnchor && hWalk.contains(primaryAnchor)) ||
                        (qCardEl && hWalk.contains(qCardEl)) ||
                        !!hWalk.querySelector('input[type="radio"], [data-ug-mt-option="true"], [data-ug-mt-qcard="true"], [role="dialog"]');
                    if (hContainsQ) break;
                    try {
                        var hRect = hWalk.getBoundingClientRect();
                        if (hRect.height > 0 && hRect.height <= 125 && clean(hWalk.textContent || "").length <= 280) {
                            hdr = hWalk;
                        }

            if (hdr && hdr !== root && hdr !== document.body &&
                !(primaryAnchor && hdr.contains(primaryAnchor)) &&
                !(qCardEl && hdr.contains(qCardEl)) &&

        }

        if (refs.nextBtn && !isInsideDialog(refs.nextBtn)) {

                !bar.querySelector('input[type="radio"], [data-ug-mt-option="true"], [data-ug-mt-qcard="true"], [role="dialog"]') &&
                clean(bar.textContent || "").length <= 240 &&

        /* 10. FULL MOBILE VIEWPORT REFLOW:

               heights, overflow-hidden traps, rigid min-widths, and 2-column horizontal splits
               so 100% of the exam displays inside the mobile screen without clipping or errors. */
        var flowAnchor = primaryAnchor || qCardEl;
        if (flowAnchor) {
            var cur = flowAnchor.parentElement;
            var fDepth = 0;
            var viewportAssigned = false;

                    var cst = window.getComputedStyle(cur);
                    var crect = cur.getBoundingClientRect();
                    if (!viewportAssigned && cst.position === "fixed" && (crect.height >= window.innerHeight * 0.55 || cur.scrollHeight > window.innerHeight * 0.55)) {
                        cur.setAttribute("data-ug-mt-viewport", "true");
                        viewportAssigned = true;
                    } else {
                        var isHorizontalLayout = (cst.display === "flex" && cst.flexDirection === "row") ||
                            (cst.display === "grid" && (cst.gridTemplateColumns || "").trim().split(/\s+/).length > 1);
                        var isLockedHeight = (cst.overflow === "hidden" || cst.overflowY === "hidden" || cst.overflowY === "auto" || cst.overflowY === "scroll");
                        var isOversized = (crect.width > vw + 2 || cur.scrollWidth > vw + 2);

                        }
                    }
                } catch (e) {}
                cur = cur.parentElement;
            }

            /* Clamp any wide inner blocks (except scrollable tables/pre/MathJax) to mobile screen width */
            var scopeRoot = document.querySelector('[data-ug-mt-viewport="true"]') || root;
            var wideNodes = scopeRoot.querySelectorAll("div, section, article, main");
            for (var wn = 0; wn < Math.min(wideNodes.length, 160); wn++) {
                var wel = wideNodes[wn];
                if (isOwnUi(wel) || isInsideDialog(wel) || wel.getAttribute("data-ug-mt-muted-bar") === "true") continue;
                try {
                    var wr = wel.getBoundingClientRect();
                    if (wr.width > vw + 2 || wel.scrollWidth > vw + 6) {
                        if (!wel.querySelector("table, pre, mjx-container")) {
                            wel.setAttribute("data-ug-mt-fit", "true");
                        }
                    }
                } catch (e) {}
            }
        }

    /* -----------------------------------------------------------------------
       3. DUAL BOX TEST GENERATOR SCANNER & ENHANCER (NON-DESTRUCTIVE)
       ----------------------------------------------------------------------- */
    function scanAndTagDualGenerator() {
        var root = document.getElementById("root") || document.body;
        if (!root) return;

        var refs = state.refs;
        refs.genBox1 = null;
        refs.genBox2 = null;
        refs.genPdfInput = null;
        refs.genPrimaryBtn = null;
        refs.genClearBtn = null;

        var tas = Array.from(root.querySelectorAll("textarea")).filter(function (el) { return isVisible(el); });
        if (tas[0]) {
            refs.genBox1 = tas[0];
            tas[0].setAttribute("data-ug-gen-textarea", "1");
            var card1 = tas[0].closest("section, article, [class*='card' i], [class*='rounded'], div");
            if (card1 && card1 !== root && card1 !== document.body && !card1.contains(tas[1])) {
                card1.setAttribute("data-ug-gen-box-card", "1");
                if (card1.parentElement && tas[1] && card1.parentElement.contains(tas[1])) {
                    card1.parentElement.setAttribute("data-ug-gen-dual-grid", "true");
                }
            } else {
                tas[0].setAttribute("data-ug-gen-box-card", "1");
            }
        }
        if (tas[1]) {
            refs.genBox2 = tas[1];
            tas[1].setAttribute("data-ug-gen-textarea", "2");
            var card2 = tas[1].closest("section, article, [class*='card' i], [class*='rounded'], div");
            if (card2 && card2 !== root && card2 !== document.body && !card2.contains(tas[0])) {
                card2.setAttribute("data-ug-gen-box-card", "2");
            } else {
                tas[1].setAttribute("data-ug-gen-box-card", "2");
            }
        }

        var pdfInp = root.querySelector('input[type="file"][accept*="pdf" i], input[type="file"]');
        if (pdfInp) refs.genPdfInput = pdfInp;

        var btns = root.querySelectorAll("button, [role='button']");
        for (var i = 0; i < btns.length; i++) {
            var b = btns[i];
            if (!isVisible(b)) continue;
            var txt = clean(b.innerText || b.textContent || "");
            if (!txt || txt.length > 55) continue;
            if (!refs.genPrimaryBtn && /(generate\s*test|start\s*test|create\s*test|launch\s*test|parse\s*&\s*start|start\s*simulator|टेस्ट\s*शुरू|टेस्ट\s*बनाएं)/i.test(txt)) {
                refs.genPrimaryBtn = b;
            } else if (!refs.genClearBtn && /(^clear$|clear\s*all|reset\s*boxes|साफ\s*करें)/i.test(txt)) {
                refs.genClearBtn = b;
            }
        }
    }

    function estimateDualBoxQuestions() {
        var combined = "";
        if (state.refs.genBox1) combined += "\n" + String(state.refs.genBox1.value || "");
        if (state.refs.genBox2) combined += "\n" + String(state.refs.genBox2.value || "");
        if (!combined.trim()) return 0;
        var matches = combined.match(/(?:^|\n)\s*(?:Q\.?\s*\d+|प्रश्न\s*\d+|\d{1,3}[\.)])\s+/gi);
        return matches ? matches.length : 0;
    }

       4. RRB PYQ TEST CATALOG CARD POLISHER (NON-DESTRUCTIVE)
       ----------------------------------------------------------------------- */
    function tagRrbPyqCards() {
        var root = document.getElementById("root") || document.body;
        if (!root) return;
        var btns = root.querySelectorAll("button, a");
        for (var i = 0; i < Math.min(btns.length, 260); i++) {
            var b = btns[i];
            if (!isVisible(b)) continue;
            var t = clean(b.innerText || b.textContent || "");
            if (t.length >= 4 && t.length <= 36 && /(start\s*test|attempt\s*now|^attempt$|take\s*test|re-?attempt|resume\s*test|टेस्ट\s*शुरू|अटेम्प्ट)/i.test(t)) {
                b.setAttribute("data-ug-pyq-start-btn", "true");
                var card = b.closest("article, li, [class*='card' i], [class*='rounded-xl'], [class*='rounded-2xl'], [class*='shadow']");
                if (card && card !== root && card !== document.body && clean(card.textContent || "").length <= 420) {
                    card.setAttribute("data-ug-pyq-card", "true");
                }
            }
        }
    }

    function bindIntroEvents(shell) {
        var btnBack = shell.querySelector("#ug-mi-btn-back");
        var btnTheme = shell.querySelector("#ug-mi-btn-theme");
        var btnClassic = shell.querySelector("#ug-mi-btn-classic");
        var langSel = shell.querySelector("#ug-mi-lang-select");
        var consentRow = shell.querySelector("#ug-mi-consent-row");
        var ctaBtn = shell.querySelector("#ug-mi-cta-btn");

        if (btnBack) btnBack.addEventListener("click", function () {
            tapHaptic();
            safeScanIntroScreen();
            if (state.refs.introBackBtn && document.contains(state.refs.introBackBtn)) {
                try { state.refs.introBackBtn.click(); } catch (e) {}
                setTimeout(function () { syncEngine(true); }, 200);
            } else {
                try { window.history.back(); } catch (e) {}
            }
        });

        if (btnTheme) btnTheme.addEventListener("click", function () { tapHaptic(); cycleTheme(); });
        if (btnClassic) btnClassic.addEventListener("click", function () { tapHaptic(); pauseModernUi(); });

        if (langSel) langSel.addEventListener("change", function () {
            tapHaptic();
            var val = langSel.value;
            if (state.refs.introLangSelect && document.contains(state.refs.introLangSelect)) {
                try {
                    var setter = Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype, "value").set;
                    if (setter) setter.call(state.refs.introLangSelect, val);
                    else state.refs.introLangSelect.value = val;
                    state.refs.introLangSelect.dispatchEvent(new Event("change", { bubbles: true }));
                    state.refs.introLangSelect.dispatchEvent(new Event("input", { bubbles: true }));
                    showToast("भाषा बदली गई");
                } catch (e) {}
            } else if (state.refs.introLangBtns.length) {
                var matched = state.refs.introLangBtns.find(function (b) { return b.label === val; });
                if (matched && document.contains(matched.el)) {
                    try { matched.el.click(); } catch (e) {}
                }
            }
            setTimeout(function () { syncEngine(true); }, 180);
        });

        if (consentRow) consentRow.addEventListener("click", function () {
            tapHaptic();
            safeScanIntroScreen();
            if (state.refs.introCheckbox && document.contains(state.refs.introCheckbox)) {
                try { state.refs.introCheckbox.click(); } catch (e) {}
                setTimeout(function () { renderIntroChrome(); }, 60);
            }
        });

        if (ctaBtn) ctaBtn.addEventListener("click", function () {
            tapHaptic();
            safeScanIntroScreen();
            state.attemptBoostUntil = Date.now() + 9000;

            var cb = state.refs.introCheckbox;
            var proceed = state.refs.introProceedBtn;

            /* If declaration checkbox exists and isn't checked yet, tick it smoothly first so user never gets stuck */
            if (cb && document.contains(cb) && !cb.checked) {
                try { cb.click(); } catch (e) {}
                renderIntroChrome();
                setTimeout(function () {
                    safeScanIntroScreen();
                    var p2 = state.refs.introProceedBtn || proceed;
                    if (p2 && document.contains(p2)) {
                        try { p2.click(); } catch (e) {}
                        [120, 350, 750].forEach(function (d) { setTimeout(function () { syncEngine(true); }, d); });
                    }
                }, 90);
                return;
            }

            if (proceed && document.contains(proceed)) {
                try { proceed.click(); } catch (e) {}
                [120, 350, 750].forEach(function (d) { setTimeout(function () { syncEngine(true); }, d); });
            } else {
                showToast("Start Test बटन लोड हो रहा है…");
            }
        });
    }

    function renderIntroChrome() {
        var titleEl = document.getElementById("ug-mi-title");
        var subEl = document.getElementById("ug-mi-sub");
        var metaQ = document.querySelector("#ug-mi-meta-q span");
        var metaT = document.querySelector("#ug-mi-meta-t span");
        var metaM = document.querySelector("#ug-mi-meta-m span");
        var langRow = document.getElementById("ug-mi-lang-row");
        var langSel = document.getElementById("ug-mi-lang-select");
        var consentRow = document.getElementById("ug-mi-consent-row");
        var cbBox = document.getElementById("ug-mi-checkbox");
        var cbIcon = cbBox ? cbBox.querySelector("i") : null;
        var consentText = document.getElementById("ug-mi-consent-text");
        var ctaLabel = document.getElementById("ug-mi-cta-label");
        var dock = document.getElementById("ug-mintro-bottomdock");

        if (titleEl) titleEl.textContent = state.introMeta.title || "General Instructions";
        if (subEl) subEl.textContent = state.refs.introCheckbox ? "Declaration & Start Test" : "General Instructions • Testbook View";

        var hasMeta = !!(state.introMeta.questions || state.introMeta.duration || state.introMeta.marks);
        if (hasMeta) {
            document.documentElement.setAttribute("data-ug-mi-has-meta", "true");
            if (metaQ) metaQ.textContent = state.introMeta.questions || "CBT Exam";
            if (metaT) metaT.textContent = state.introMeta.duration || "Timed";
            if (metaM) metaM.textContent = state.introMeta.marks || "PYQ";
        } else {
            document.documentElement.removeAttribute("data-ug-mi-has-meta");
        }

        /* Sync Default Language dropdown */
        if (langRow && langSel) {
            if (state.refs.introLangSelect && document.contains(state.refs.introLangSelect)) {
                langRow.style.display = "flex";
                var realOpts = Array.from(state.refs.introLangSelect.options || []);
                var sig = realOpts.map(function (o) { return o.value + ":" + o.text; }).join("|");
                if (langSel.getAttribute("data-opt-sig") !== sig) {
                    langSel.setAttribute("data-opt-sig", sig);
                    langSel.innerHTML = "";
                    realOpts.forEach(function (o) {
                        var op = document.createElement("option");
                        op.value = o.value;
                        op.textContent = o.text;
                        langSel.appendChild(op);
                    });
                }
                langSel.value = state.refs.introLangSelect.value;
            } else if (state.refs.introLangBtns.length >= 2) {
                langRow.style.display = "flex";
                var bSig = state.refs.introLangBtns.map(function (b) { return b.label; }).join("|");
                if (langSel.getAttribute("data-opt-sig") !== bSig) {
                    langSel.setAttribute("data-opt-sig", bSig);
                    langSel.innerHTML = "";
                    state.refs.introLangBtns.forEach(function (b) {
                        var op = document.createElement("option");
                        op.value = b.label;
                        op.textContent = b.label;
                        langSel.appendChild(op);
                    });
                }
            } else {
                langRow.style.display = "none";
            }
        }

        /* Sync Declaration Checkbox */
        if (consentRow) {
            if (state.refs.introCheckbox && document.contains(state.refs.introCheckbox)) {
                var isChecked = !!state.refs.introCheckbox.checked;
                consentRow.style.display = "flex";
                consentRow.setAttribute("aria-checked", isChecked ? "true" : "false");
                if (cbBox) cbBox.classList.toggle("is-checked", isChecked);
                if (cbIcon) cbIcon.style.display = isChecked ? "inline-block" : "none";
                if (consentText) consentText.textContent = state.introMeta.consentText;
            } else {
                consentRow.style.display = "none";
            }
        }

        if (ctaLabel) {
            ctaLabel.textContent = state.refs.introProceedLabel || "Agree & Continue";
        }

        /* Sync exact dynamic dock height so bottom instruction text is never obscured */
        if (dock) {
            var h = dock.getBoundingClientRect().height;
            if (h > 40) {
                document.documentElement.style.setProperty("--mi-dock-h", Math.ceil(h + 12) + "px");
            }
        }

        var introTop = document.getElementById("ug-mintro-topbar");
        if (introTop) {
            var thIntro = introTop.getBoundingClientRect().height;
            if (thIntro > 40) {
                document.documentElement.style.setProperty("--mi-top-h", Math.ceil(thIntro) + "px");
            }
        }
    }

            '      <button type="button" id="ug-mg-btn-theme" class="ug-mt-icon-btn" title="Eye-Care Theme"><i class="fa-solid fa-moon"></i></button>',
            '      <button type="button" id="ug-mg-btn-classic" class="ug-mt-icon-btn" title="Classic View"><i class="fa-solid fa-eye-slash"></i></button>',
            '    </div>',
            '  </div>',
            '  <div class="ug-mg-segment-wrap">',
            '    <div class="ug-mg-segment">',
            '      <button type="button" class="ug-mg-seg-btn is-active" data-gen-focus="dual">Dual Box</button>',
            '      <button type="button" class="ug-mg-seg-btn" data-gen-focus="box1">Box 1 (PDF/Q)</button>',
            '      <button type="button" class="ug-mg-seg-btn" data-gen-focus="box2">Box 2 (Paste)</button>',
            '    </div>',
            '  </div>',
            '</header>',

            '<div id="ug-mgen-bottomdock">',
            '  <button type="button" id="ug-mg-btn-pdf" class="ug-mt-dock-btn" title="Upload PDF"><i class="fa-solid fa-file-pdf" style="color:var(--mt-rose);"></i><span>PDF</span></button>',
            '  <button type="button" id="ug-mg-btn-paste" class="ug-mt-dock-btn" title="Paste Questions"><i class="fa-solid fa-paste" style="color:var(--mt-accent);"></i><span>Paste</span></button>',
            '  <button type="button" id="ug-mg-btn-clear" class="ug-mt-dock-btn is-clear" title="Clear Boxes"><i class="fa-solid fa-eraser"></i></button>',
            '  <button type="button" id="ug-mg-btn-start" class="ug-mt-dock-primary"><i class="fa-solid fa-play"></i><span>Generate &amp; Start</span></button>',
            '</div>'
        ].join("\n");

        document.body.appendChild(shell);
        bindGeneratorEvents(shell);
        return shell;
    }

    function showToast(msg) {
        if (!msg || !document.body) return;
        var t = document.getElementById("ug-mtest-toast");
        if (!t) {
            t = document.createElement("div");
            t.id = "ug-mtest-toast";
            t.setAttribute("role", "status");
            t.setAttribute("aria-live", "polite");
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.classList.add("is-show");
        if (state.toastTimer) clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(function () {
            t.classList.remove("is-show");
        }, 2100);
    }

    function applyThemeAndFont() {
        document.documentElement.setAttribute("data-ug-mtest-theme", state.theme);
        document.documentElement.setAttribute("data-ug-mtest-font", state.font);
        var iconCls = state.theme === "dark" ? "fa-solid fa-sun" : (state.theme === "sepia" ? "fa-solid fa-book-open" : "fa-solid fa-moon");
        var ti1 = document.querySelector("#ug-mt-btn-theme i");
        var ti2 = document.querySelector("#ug-mg-btn-theme i");
        var ti3 = document.querySelector("#ug-mi-btn-theme i");
        if (ti1) ti1.className = iconCls;
        if (ti2) ti2.className = iconCls;
        if (ti3) ti3.className = iconCls;
        var fBtn = document.getElementById("ug-mt-btn-font");
        if (fBtn) fBtn.textContent = state.font === "xl" ? "A++" : (state.font === "lg" ? "A+" : "A");
    }

    function cycleTheme() {
        var order = ["light", "sepia", "dark"];
        var idx = order.indexOf(state.theme);
        state.theme = order[(idx + 1) % order.length];
        writePref("theme", state.theme);
        applyThemeAndFont();
        var names = { light: "Light Mode", sepia: "Sepia Eye-Care", dark: "AMOLED Dark" };
        showToast("थीम: " + (names[state.theme] || state.theme));
        if (state.sheetOpen) renderPaletteSheet();
    }

    function cycleFont() {
        var order = ["md", "lg", "xl"];
        var idx = order.indexOf(state.font);
        state.font = order[(idx + 1) % order.length];
        writePref("font", state.font);
        applyThemeAndFont();
        var names = { md: "Normal (100%)", lg: "Large (112%)", xl: "Extra Large (124%)" };
        showToast("फ़ॉन्ट साइज़: " + (names[state.font] || state.font));
        if (state.sheetOpen) renderPaletteSheet();
    }

    function closeAllOverlays() {
        state.sheetOpen = false;
        state.pauseModalOpen = false;
        var bd = document.getElementById("ug-mtest-backdrop");
        var sh = document.getElementById("ug-mtest-sheet");
        var pm = document.getElementById("ug-mtest-pause-modal");
        if (bd) bd.classList.remove("is-open");
        if (sh) sh.classList.remove("is-open");
        if (pm) pm.classList.remove("is-open");
    }

    function openPaletteSheet() {
        closeAllOverlays();
        safeScanLiveTest();
        renderPaletteSheet();
        state.sheetOpen = true;
        var bd = document.getElementById("ug-mtest-backdrop");
        var sh = document.getElementById("ug-mtest-sheet");
        if (bd) bd.classList.add("is-open");
        if (sh) sh.classList.add("is-open");
    }

    function openPauseModal() {
        closeAllOverlays();
        safeScanLiveTest();
        renderPauseSummary();
        state.pauseModalOpen = true;
        var bd = document.getElementById("ug-mtest-backdrop");
        var pm = document.getElementById("ug-mtest-pause-modal");
        if (bd) bd.classList.add("is-open");
        if (pm) pm.classList.add("is-open");
    }

    function triggerExamControl(refKey, fallbackMsg) {
        safeScanLiveTest();
        var btn = state.refs[refKey];
        if (btn && document.contains(btn)) {
            try { btn.click(); } catch (e) {}
            setTimeout(function () {
                safeScanLiveTest();
                renderLiveTestChrome();
                if (state.sheetOpen) renderPaletteSheet();
            }, 90);
            return true;
        }
        if (fallbackMsg) showToast(fallbackMsg);
        return false;
    }

    function bindLiveTestEvents(shell) {
        var btnPause = shell.querySelector("#ug-mt-btn-pause");
        var btnLang = shell.querySelector("#ug-mt-btn-lang");
        var btnFont = shell.querySelector("#ug-mt-btn-font");
        var btnPalette = shell.querySelector("#ug-mt-btn-palette");
        var btnTopStar = shell.querySelector("#ug-mt-top-star");
        var btnTheme = shell.querySelector("#ug-mt-btn-theme");
        var dockPrev = shell.querySelector("#ug-mt-dock-prev");
        var dockReview = shell.querySelector("#ug-mt-dock-review");
        var dockClear = shell.querySelector("#ug-mt-dock-clear");
        var dockNext = shell.querySelector("#ug-mt-dock-next");
        var backdrop = shell.querySelector("#ug-mtest-backdrop");
        var sheetClose = shell.querySelector("#ug-mt-sheet-close");
        var pauseClose = shell.querySelector("#ug-mt-pause-close");
        var pauseResume = shell.querySelector("#ug-mt-pause-resume");
        var pauseSubmit = shell.querySelector("#ug-mt-pause-submit");
        var pauseClassic = shell.querySelector("#ug-mt-pause-classic");

        if (btnPause) btnPause.addEventListener("click", function () { tapHaptic(); openPauseModal(); });
        if (btnLang) btnLang.addEventListener("click", function () { tapHaptic(); triggerExamControl("langBtn", "भाषा स्विच उपलब्ध नहीं है"); });
        if (btnFont) btnFont.addEventListener("click", function () { tapHaptic(); cycleFont(); });
        if (btnPalette) btnPalette.addEventListener("click", function () { tapHaptic(); openPaletteSheet(); });
        if (btnTopStar) btnTopStar.addEventListener("click", function () { tapHaptic(); triggerExamControl("reviewBtn", "Review विकल्प उपलब्ध नहीं है"); });
        if (btnTheme) btnTheme.addEventListener("click", function () { tapHaptic(); cycleTheme(); });

        if (dockPrev) dockPrev.addEventListener("click", function () { tapHaptic(); triggerExamControl("prevBtn", "यह पहला प्रश्न है"); });
        if (dockReview) dockReview.addEventListener("click", function () { tapHaptic(); triggerExamControl("reviewBtn", "Review विकल्प उपलब्ध नहीं है"); });
        if (dockClear) dockClear.addEventListener("click", function () { tapHaptic(); triggerExamControl("clearBtn", "Clear विकल्प उपलब्ध नहीं है"); });
        if (dockNext) dockNext.addEventListener("click", function () {
            tapHaptic();
            if (!triggerExamControl("nextBtn")) {
                triggerExamControl("submitBtn", "अगला प्रश्न उपलब्ध नहीं है");
            }
        });

        if (backdrop) backdrop.addEventListener("click", function () { closeAllOverlays(); });
        if (sheetClose) sheetClose.addEventListener("click", function () { tapHaptic(); closeAllOverlays(); });
        if (pauseClose) pauseClose.addEventListener("click", function () { tapHaptic(); closeAllOverlays(); });
        if (pauseResume) pauseResume.addEventListener("click", function () { tapHaptic(); closeAllOverlays(); });
        if (pauseSubmit) pauseSubmit.addEventListener("click", function () {
            tapHaptic();
            closeAllOverlays();
            triggerExamControl("submitBtn", "Submit बटन नहीं मिला");
        });
        if (pauseClassic) pauseClassic.addEventListener("click", function () {
            tapHaptic();
            pauseModernUi();
        });

        /* Testbook-style question swipe: left = Save & Next (answers saved by the real CBT button), right = Previous.
           Gestures are accepted only on the question content, never on controls or vertical scrolling. */
        if (!window.__UG_MT_SWIPE_BOUND__) {
            window.__UG_MT_SWIPE_BOUND__ = true;
            var sx = 0, sy = 0, swipeStartTarget = null, lastSwipeAt = 0;
            document.addEventListener("touchstart", function (e) {
                if (state.mode !== "live_test" || !state.swipeEnabled || state.sheetOpen || state.pauseModalOpen) return;
                if (!e.touches || e.touches.length !== 1) return;
                var target = e.target;
                if (!target || !target.closest || !target.closest("#root")) return;
                if (target.closest("button, a, input, textarea, select, label, [role='button'], #ug-mtest-sheet, #ug-mtest-topbar, #ug-mtest-bottomdock")) return;
                sx = e.touches[0].clientX;
                sy = e.touches[0].clientY;
                swipeStartTarget = target;
            }, { passive: true });
            document.addEventListener("touchend", function (e) {
                if (state.mode !== "live_test" || !state.swipeEnabled || state.sheetOpen || state.pauseModalOpen || !swipeStartTarget) return;
                if (!e.changedTouches || !e.changedTouches[0]) { swipeStartTarget = null; return; }
                var dx = e.changedTouches[0].clientX - sx;
                var dy = e.changedTouches[0].clientY - sy;
                swipeStartTarget = null;
                if (Math.abs(dx) < 68 || Math.abs(dx) < Math.abs(dy) * 1.55) return;
                if (Date.now() - lastSwipeAt < 350) return;
                lastSwipeAt = Date.now();
                if (dx < 0) {
                    /* This clicks the source test's Save & Next control, preserving its native answer-save logic. */
                    if (!triggerExamControl("nextBtn")) showToast("Save & Next बटन उपलब्ध नहीं है");
                } else {
                    triggerExamControl("prevBtn", "यह पहला प्रश्न है");
                }
            }, { passive: true });
        }

        /* Swipe the open question palette to the right to dismiss it. */
        if (!window.__UG_MT_PALETTE_SWIPE_BOUND__) {
            window.__UG_MT_PALETTE_SWIPE_BOUND__ = true;
            var psx = 0, psy = 0;
            var palette = shell.querySelector("#ug-mtest-sheet");
            if (palette) {
                palette.addEventListener("touchstart", function (e) {
                    if (!state.sheetOpen || !e.touches || e.touches.length !== 1) return;
                    psx = e.touches[0].clientX;
                    psy = e.touches[0].clientY;
                }, { passive: true });
                palette.addEventListener("touchend", function (e) {
                    if (!state.sheetOpen || !e.changedTouches || !e.changedTouches[0]) return;
                    var pdx = e.changedTouches[0].clientX - psx;
                    var pdy = e.changedTouches[0].clientY - psy;
                    if (pdx > 65 && pdx > Math.abs(pdy) * 1.35) {
                        tapHaptic();
                        closeAllOverlays();
                    }
                }, { passive: true });
            }
        }
    }

    function bindGeneratorEvents(shell) {
        var btnTheme = shell.querySelector("#ug-mg-btn-theme");
        var btnClassic = shell.querySelector("#ug-mg-btn-classic");
        var btnPdf = shell.querySelector("#ug-mg-btn-pdf");
        var btnPaste = shell.querySelector("#ug-mg-btn-paste");
        var btnClear = shell.querySelector("#ug-mg-btn-clear");
        var btnStart = shell.querySelector("#ug-mg-btn-start");

        shell.querySelectorAll(".ug-mg-seg-btn").forEach(function (seg) {
            seg.addEventListener("click", function () {
                tapHaptic();
                state.genFocus = seg.getAttribute("data-gen-focus") || "dual";
                document.documentElement.setAttribute("data-ug-gen-focus", state.genFocus);
                shell.querySelectorAll(".ug-mg-seg-btn").forEach(function (b) {
                    b.classList.toggle("is-active", b === seg);
                });
            });
        });

        if (btnTheme) btnTheme.addEventListener("click", function () { tapHaptic(); cycleTheme(); });
        if (btnClassic) btnClassic.addEventListener("click", function () { tapHaptic(); pauseModernUi(); });

        if (btnPdf) btnPdf.addEventListener("click", function () {
            tapHaptic();
            scanAndTagDualGenerator();
            if (state.refs.genPdfInput && document.contains(state.refs.genPdfInput)) {
                try { state.refs.genPdfInput.click(); } catch (e) {}
            } else {
                showToast("PDF अपलोड इनपुट नहीं मिला");
            }
        });

        if (btnPaste) btnPaste.addEventListener("click", function () {
            tapHaptic();
            scanAndTagDualGenerator();
            var targetBox = (state.genFocus === "box2" && state.refs.genBox2) ? state.refs.genBox2 : (state.refs.genBox1 || state.refs.genBox2);
            if (!targetBox) {
                showToast("पेस्ट करने के लिए बॉक्स नहीं मिला");
                return;
            }
            targetBox.focus();
            if (navigator.clipboard && typeof navigator.clipboard.readText === "function") {
                navigator.clipboard.readText().then(function (clipTxt) {
                    if (!clipTxt) { showToast("क्लिपबोर्ड खाली है"); return; }
                    var setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, "value").set;
                    var nextVal = (targetBox.value ? targetBox.value + "\n" : "") + clipTxt;
                    if (setter) setter.call(targetBox, nextVal);
                    else targetBox.value = nextVal;
                    targetBox.dispatchEvent(new Event("input", { bubbles: true }));
                    targetBox.dispatchEvent(new Event("change", { bubbles: true }));
                    renderGeneratorChrome();
                    showToast("प्रश्न पेस्ट किए गए");
                }).catch(function () {
                    showToast("बॉक्स में टैप करके Paste करें");
                });
            } else {
                showToast("बॉक्स में लॉन्ग-प्रेस करके Paste करें");
            }
        });

        if (btnClear) btnClear.addEventListener("click", function () {
            tapHaptic();
            scanAndTagDualGenerator();
            if (state.refs.genClearBtn && document.contains(state.refs.genClearBtn)) {
                try { state.refs.genClearBtn.click(); } catch (e) {}
                setTimeout(renderGeneratorChrome, 100);
                return;
            }
            var setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, "value").set;
            [state.refs.genBox1, state.refs.genBox2].forEach(function (ta) {
                if (!ta) return;
                if (setter) setter.call(ta, "");
                else ta.value = "";
                ta.dispatchEvent(new Event("input", { bubbles: true }));
                ta.dispatchEvent(new Event("change", { bubbles: true }));
            });
            renderGeneratorChrome();
            showToast("बॉक्स साफ़ कर दिए गए");
        });

        if (btnStart) btnStart.addEventListener("click", function () {
            tapHaptic();
            scanAndTagDualGenerator();
            state.attemptBoostUntil = Date.now() + 9000;
            if (state.refs.genPrimaryBtn && document.contains(state.refs.genPrimaryBtn)) {
                try { state.refs.genPrimaryBtn.click(); } catch (e) {}
                [120, 400, 850].forEach(function (d) { setTimeout(function () { syncEngine(true); }, d); });
            } else {
                showToast("Start Test बटन नहीं मिला");
            }
        });
    }

    function computePaletteCounts() {
        var counts = { answered: 0, review: 0, notans: 0, notvisited: 0 };
        var list = state.refs.paletteBtns || [];
        for (var i = 0; i < list.length; i++) {
            var st = classifyPaletteStatus(list[i].el, list[i].num).status;
            if (counts[st] !== undefined) counts[st]++;
        }
        return counts;
    }

    function renderLiveTestChrome() {
        var timerBox = document.getElementById("ug-mt-timer");
        var timerSpan = timerBox ? timerBox.querySelector("span") : null;
        var titleEl = document.getElementById("ug-mt-title");
        var langBtn = document.getElementById("ug-mt-btn-lang");
        var palCount = document.getElementById("ug-mt-pal-count");
        var qBadge = document.getElementById("ug-mt-qbadge");
        var qWatchSpan = document.querySelector("#ug-mt-qwatch span");
        var marksEl = document.getElementById("ug-mt-marks");
        var progFill = document.getElementById("ug-mtest-progress-fill");
        var dockPrev = document.getElementById("ug-mt-dock-prev");
        var dockReview = document.getElementById("ug-mt-dock-review");
        var dockClear = document.getElementById("ug-mt-dock-clear");

        /* Sync Live Countdown Timer */
        if (timerBox && timerSpan) {
            var rawTime = (state.refs.timerEl && document.contains(state.refs.timerEl)) ? clean(state.refs.timerEl.textContent || "") : "";
            var mTime = rawTime.match(/\b(\d{1,2}:\d{2}(?::\d{2})?)\b/);
            var tStr = mTime ? mTime[1] : "--:--";
            timerSpan.textContent = tStr;

            var secsLeft = -1;
            if (mTime) {
                var parts = tStr.split(":").map(Number);
                secsLeft = parts.length === 3 ? (parts[0] * 3600 + parts[1] * 60 + parts[2]) : (parts[0] * 60 + parts[1]);
            }
            timerBox.classList.toggle("is-danger", secsLeft >= 0 && secsLeft <= 60);
            timerBox.classList.toggle("is-warn", secsLeft > 60 && secsLeft <= 300);
        }

        if (titleEl) titleEl.textContent = state.testTitle || "RRB PYQ Test";
        if (langBtn) langBtn.style.display = (state.refs.langBtn && document.contains(state.refs.langBtn)) ? "inline-flex" : "none";

        var counts = computePaletteCounts();
        var total = Math.max(state.totalQ, (state.refs.paletteBtns || []).length, state.currentQ);
        if (palCount) palCount.textContent = counts.answered + "/" + total;
        if (qBadge) qBadge.textContent = "Q. " + state.currentQ + (total ? (" / " + total) : "");
        if (qWatchSpan) qWatchSpan.textContent = formatStopwatch((Date.now() - state.qStartedAt) / 1000);
        if (marksEl) {
            marksEl.innerHTML = '<span class="ug-tb-mark-pos">' + esc(state.marksPos) + '</span><span style="opacity:0.35;">|</span><span class="ug-tb-mark-neg">' + esc(state.marksNeg) + '</span>';
        }
        if (progFill && total > 0) {
            var pct = Math.min(100, Math.max(4, Math.round((state.currentQ / total) * 100)));
            progFill.style.width = pct + "%";
        }

        if (dockPrev) dockPrev.style.opacity = state.refs.prevBtn ? "1" : "0.45";
        if (dockReview) dockReview.style.opacity = state.refs.reviewBtn ? "1" : "0.45";
        if (dockClear) dockClear.style.opacity = state.refs.clearBtn ? "1" : "0.45";

        /* Sync exact dynamic Topbar & Bottom Dock heights so 100% of test stays inside mobile screen */
        try {
            var topEl = document.getElementById("ug-mtest-topbar");
            var botEl = document.getElementById("ug-mtest-bottomdock");
            if (topEl) {
                var th = topEl.getBoundingClientRect().height;
                if (th > 40) document.documentElement.style.setProperty("--mt-top-h", Math.ceil(th) + "px");
            }
            if (botEl) {
                var bh = botEl.getBoundingClientRect().height;
                if (bh > 36) document.documentElement.style.setProperty("--mt-bot-h", Math.ceil(bh) + "px");
            }
        } catch (e) {}
    }

    function renderPaletteSheet() {
        var body = document.getElementById("ug-mt-sheet-body");
        var footer = document.getElementById("ug-mt-drawer-footer");
        var dTitle = document.getElementById("ug-mt-drawer-title");
        if (!body || !footer) return;

        if (dTitle) dTitle.textContent = state.testTitle || "Question Palette";
        var counts = computePaletteCounts();
        body.innerHTML = "";

        /* 1. Testbook 2x2 Status Legend */
        var leg = document.createElement("div");
        leg.className = "ug-tb-legend-2x2";
        leg.innerHTML = [
            '<div class="ug-tb-leg-item"><span class="ug-tb-leg-dot d-ans">' + counts.answered + '</span><span>Answered</span></div>',
            '<div class="ug-tb-leg-item"><span class="ug-tb-leg-dot d-rev">' + counts.review + '</span><span>Marked</span></div>',
            '<div class="ug-tb-leg-item"><span class="ug-tb-leg-dot d-skip">' + counts.notans + '</span><span>Not Answered</span></div>',
            '<div class="ug-tb-leg-item"><span class="ug-tb-leg-dot d-left">' + counts.notvisited + '</span><span>Not Visited</span></div>'
        ].join("");
        body.appendChild(leg);

        /* 2. Quick Reading Controls Strip */
        var prefs = document.createElement("div");
        prefs.className = "ug-mt-pref-strip";
        var pSwipe = document.createElement("button");
        pSwipe.type = "button";
        pSwipe.className = "ug-mt-mini-pill" + (state.swipeEnabled ? " is-on" : "");
        pSwipe.textContent = state.swipeEnabled ? "Swipe: ON" : "Swipe: OFF";
        pSwipe.addEventListener("click", function () {
            tapHaptic();
            state.swipeEnabled = !state.swipeEnabled;
            writePref("swipe", state.swipeEnabled ? "true" : "false");
            renderPaletteSheet();
            showToast(state.swipeEnabled ? "स्वाइप नेविगेशन चालू" : "स्वाइप नेविगेशन बंद");
        });

        var pTheme = document.createElement("button");
        pTheme.type = "button";
        pTheme.className = "ug-mt-mini-pill";
        pTheme.textContent = "Theme: " + state.theme.toUpperCase();
        pTheme.addEventListener("click", function () { tapHaptic(); cycleTheme(); });

        var pFont = document.createElement("button");
        pFont.type = "button";
        pFont.className = "ug-mt-mini-pill";
        pFont.textContent = "Font: " + state.font.toUpperCase();
        pFont.addEventListener("click", function () { tapHaptic(); cycleFont(); });

        prefs.appendChild(pSwipe);
        prefs.appendChild(pTheme);
        prefs.appendChild(pFont);
        body.appendChild(prefs);

        /* 3. Subject Filter Chips */
        if (state.refs.subjectBtns.length) {
            var sRow = document.createElement("div");
            sRow.className = "ug-mt-subject-row";
            state.refs.subjectBtns.forEach(function (sb) {
                var chip = document.createElement("button");
                chip.type = "button";
                chip.className = "ug-mt-sub-chip";
                chip.textContent = sb.label;
                chip.addEventListener("click", function () {
                    tapHaptic();
                    if (sb.el && document.contains(sb.el)) {
                        try { sb.el.click(); } catch (e) {}
                        closeAllOverlays();
                        setTimeout(function () { syncEngine(true); }, 150);
                    }
                });
                sRow.appendChild(chip);
            });
            body.appendChild(sRow);
        }

        /* 4. Circular 5-Column Question Number Grid */
        var grid = document.createElement("div");
        grid.className = "ug-mt-palette-grid";
        var pList = state.refs.paletteBtns || [];
        if (pList.length) {
            pList.forEach(function (item) {
                var info = classifyPaletteStatus(item.el, item.num);
                var qBtn = document.createElement("button");
                qBtn.type = "button";
                qBtn.className = "ug-mt-qnum" +
                    (info.status === "answered" ? " st-answered" :
                     info.status === "review" ? " st-review" :
                     info.status === "notans" ? " st-notans" : "") +
                    (info.isCurrent ? " st-current" : "");
                qBtn.textContent = String(item.num);
